[workspace]
name = "gitaway"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
nbdev = "*"  # fh-saas imports nbdev.showdoc at load time but does not declare it
pyyaml = ">=6.0.3,<7"
pypdf = ">=6.21.4,<7"
pillow = ">=13.0.0,<14"
pillow-heif = ">=1.8.0,<2"
pypdfium2 = ">=5.13.0,<6"
trafilatura = ">=2.0.0,<3"
defusedxml = ">=0.7.1,<0.8"

[pypi-dependencies]
python-fasthtml = ">=0.14.13"
fh-saas = ">=0.9.14"
pywebpush = ">=2.5.0, <3"
webauthn = ">=3.0.1, <4"
anthropic = ">=2.6.0, <3"
stripe = ">=15.6.1, <16"

[feature.test.dependencies]  # tools for the tests only: the production image (environment "prod") leaves them out
pytest = "*"
playwright-python = ">=1.62.0,<2"
pytest-randomly = ">=5.0.0,<6"
pytest-reverse = ">=1.7.0,<2"
pip-audit = ">=2.10.1,<3"
filelock = ">=4.2.9,<5"

[environments]
default = { features = ["test"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

[tasks]
dev = "python main.py"
vapid-keys = "python scripts/vapid_keys.py"  # makes the push keys for the morning plan and writes them to .env (F-066)
forget-person = "python scripts/forget_person.py"  # delete a person's (or family's) data by hand; a dry run unless --yes (F-076)
ai-report = "python scripts/ai_report.py"  # what the AI did: calls, time and tokens per job and per day, no content (F-079)
probe-tp = "python scripts/probe_travelpayouts.py"  # one real Travelpayouts partner-links call; needs TRAVELPAYOUTS_TOKEN and _MARKER (F-179)
probe-import = "python scripts/probe_creator_import.py"  # one real creator-import draft with Claude Haiku 5.5: prints the draft JSON, tokens and cost; needs ANTHROPIC_API_KEY (F-183)
draft-creators = "python scripts/draft_creators.py"  # draft every A-priority creator's example post from docs/research/creators.csv and print the claim links; needs ANTHROPIC_API_KEY (F-188)
test = "pytest -q -p no:randomly"
test-random = "pytest -q -p randomly"
test-browser-install = "playwright install chromium"  # once per machine: downloads the browser the browser suite drives
test-browser = "pytest -q -p no:randomly tests_browser"
audit = "pip-audit"  # known vulnerabilities in the installed packages, from PyPI's advisory data; run before a release (F-193)

[activation.env]
PYTHONUTF8 = "1"  # read and write text as UTF-8 everywhere: Windows otherwise defaults to cp1252 and files without encoding= break (F-089)
