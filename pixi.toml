[workspace]
name = "gitaway"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
nbdev = "*"  # fh-saas imports nbdev.showdoc at load time but does not declare it
pytest = "*"

[pypi-dependencies]
python-fasthtml = ">=0.14.13"
fh-saas = ">=0.9.14"

[tasks]
dev = "python main.py"
test = "pytest -q"
