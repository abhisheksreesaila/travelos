<!doctype html>
<!--
  PROTOTYPE (throwaway). Three variants of GitAway's booking page (/plan, gitaway/pages/plan_search.py) that put flights and stays side by side,
  switchable with ?variant=1|2|3 and the yellow bar at the bottom. All places, times and prices are MADE UP. Not wired to anything.
  The question: can a family pick a flight and a stay together, against a budget, and see the date trade-off at a glance?
    1  Split view       two panes like a browser split; on a phone two slot-machine reels with the total pinned
    2  Trade-off board  every flight x every stay as a heat map of the total, a budget slider and "what matters" chips
    3  Bento cockpit    widgets on top (total ring, a draggable date window, weather, drive, best picks), two swipeable decks, a Trip tray you drag into
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Booking side by side · GitAway</title>
<style>

:root{

  --spring:cubic-bezier(.3,1.12,.4,1); --spring-big:cubic-bezier(.34,1.45,.5,1); --spring-dur:380ms; --quick:160ms;

  --sh1:0 1px 2px rgba(10,10,20,.06),0 0 0 1px rgba(10,10,20,.04);
  --sh2:0 8px 24px rgba(10,10,20,.08),0 0 0 1px rgba(10,10,20,.04);
  --sh3:0 18px 48px rgba(10,10,20,.16),0 0 0 1px rgba(10,10,20,.05);
  --k-flight-t:#E4E3FB; --k-flight-i:#2A2185; --k-stay-t:#F1E3FA; --k-stay-i:#5A1785; --k-car-t:#DDF3E4; --k-car-i:#0F5128; --k-wx-t:#DBEFFA; --k-wx-i:#034769;
  --up-bg:#0B0B0D; --up-fg:#FFFFFF; --up-fg2:#C9C9D1; --up-line:#3A3A41; --up-tile:#26262B; --up-btn:#FFFFFF; --up-btn-fg:#0B0B0D; --up-warn:#FF9C8F; --up-ok:#7EE2A8;
}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]){

  --hairline:#2E2E33; --hairline-2:#3A3A40; --accent:#F5F5F7; --on-accent:#0B0B0D; --state:245 245 247;
  --ok:#30C060; --ok-ink:#6EE7A0; --ok-tint:#123222; --danger:#FF6B5E; --danger-tint:#3A1412; --danger-ink:#FFB4AB;

  --k-flight-t:#1F1C4A; --k-flight-i:#CBC8FF; --k-stay-t:#2C1740; --k-stay-i:#E7CCFA; --k-car-t:#10301C; --k-car-i:#BFEBCD; --k-wx-t:#0C2A3B; --k-wx-i:#C3E6FA;
  --up-bg:#F5F5F7; --up-fg:#0B0B0D; --up-fg2:#45454D; --up-line:#CFCFD6; --up-tile:#E2E2E8; --up-btn:#0B0B0D; --up-btn-fg:#FFFFFF; --up-warn:#B42318; --up-ok:#116A33;

  --k-flight-t:#1F1C4A; --k-flight-i:#CBC8FF; --k-stay-t:#2C1740; --k-stay-i:#E7CCFA; --k-car-t:#10301C; --k-car-i:#BFEBCD; --k-wx-t:#0C2A3B; --k-wx-i:#C3E6FA;
  --up-bg:#F5F5F7; --up-fg:#0B0B0D; --up-fg2:#45454D; --up-line:#CFCFD6; --up-tile:#E2E2E8; --up-btn:#0B0B0D; --up-btn-fg:#FFFFFF; --up-warn:#B42318; --up-ok:#116A33;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{font-family:Geist,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

.delta{display:inline-block;font-size:13px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.01em;white-space:nowrap}
.delta.dn{background:var(--ok-tint);color:var(--ok-ink)} .delta.up{background:var(--danger-tint);color:var(--danger-ink)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;background:var(--up-bg);color:var(--up-fg);
  padding:12px 18px;border-radius:16px;font-size:16px;box-shadow:var(--sh3);transition:opacity 220ms ease-out,transform 220ms ease-out;z-index:90;pointer-events:none;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- the prototype's own chrome (not part of the design) ---------- */

.proto-bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;
  background:#17140A;color:#FFD43B;border:2px dashed #FFD43B;border-radius:99px;padding:3px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:600 14px/1 ui-monospace,"SF Mono",Menlo,monospace;white-space:nowrap}

.proto-bar .pl{padding:0 6px;text-align:center}
.proto-bar .pl small{display:block;font-size:11px;opacity:.75;margin-top:3px;letter-spacing:.06em}

/* =====================================================================================
   VARIANT 1 · Split view

.v1 .meter{position:sticky;top:8px;z-index:20;background:var(--up-bg);color:var(--up-fg);border-radius:24px;padding:14px 18px 18px;box-shadow:var(--sh3)}

.v1 .dates{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:12px 16px 6px;scroll-snap-type:x proximity}

@media (prefers-color-scheme:dark){:root:not([data-mode="light"]) .v1 .dchip.on .mini i.f{background:var(--k-flight)} :root:not([data-mode="light"]) .v1 .dchip.on .mini i.s{background:var(--k-stay)}}
.v1 .split{margin-top:14px}

.v1 .pane-tab .cnt{font-size:14px;color:var(--ink-3);font-weight:600}
.v1 .pane-tab .hint{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:500}
.v1 .reel{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 11% 12px;margin:0 -16px;scrollbar-width:none;overscroll-behavior-x:contain}
.v1 .reel::-webkit-scrollbar{display:none}
.v1 .card{flex:0 0 78%;min-width:0;scroll-snap-align:center;background:var(--card);border-radius:20px;box-shadow:var(--sh1);padding:14px;display:flex;gap:12px;align-items:flex-start;
  transition:transform var(--spring-dur) var(--spring),opacity var(--spring-dur) ease-out,box-shadow 200ms ease-out;position:relative;min-height:112px}
.v1 .card:not(.on){transform:scale(.92);opacity:.6}
.v1 .card.on{box-shadow:0 0 0 2.5px var(--ink),var(--sh2)}
.v1 .card .kt{width:48px;height:48px;font-weight:780;font-size:17px;letter-spacing:.02em}
.v1 .card .main{flex:1;min-width:0}
.v1 .card .t1{font-size:18px;font-weight:740;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v1 .card .t2,.v1 .card .t3{font-size:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v1 .card.on .lock{transform:scale(1)}
.v1 .seam{display:flex;align-items:center;justify-content:center;gap:10px;margin:-2px 0 6px;color:var(--ink-3);font-size:14px}
.v1 .seam .plus{width:32px;height:32px;border-radius:99px;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--ink)}
.v1 .divider{display:none}
.v1 .cars{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}.v1 .cars::-webkit-scrollbar{display:none}
.v1 .carchip{flex:none}
@media (max-width:899px){.v1 .row-lab .hint2{display:none} .v1 .card{flex-basis:84%;min-height:132px} .v1 .reel{padding-left:8%;padding-right:8%} .v1 .card .t1,.v1 .card .t2,.v1 .card .t3{white-space:normal} .v1 .card .t1{font-size:17px;line-height:1.2} .v1 .v-head h1{font-size:26px}}
.v1 .carchip{min-height:48px;padding:0 16px;border-radius:99px;background:var(--card);box-shadow:var(--sh1);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.v1 .carchip.on{background:var(--k-car);color:var(--k-on)}
@media (min-width:900px){
  body{font-size:15px}
  .v1.wrap{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start}
  .v1 .v-head{grid-column:1;padding-top:6px}
  .v1 .meter{grid-column:2;grid-row:1 / span 2;position:static;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
  .v1 .blk-combos{grid-column:1}
  .v1 .blk-dates,.v1 .split,.v1 .blk-cars{grid-column:1 / -1}
  .v1 .row-lab{margin-top:10px}
  .v1 .dates{margin:0;padding:4px 0 6px;overflow:visible}

  .v1 .pane-tab .dots i{width:10px;height:10px;border-radius:99px;background:var(--hairline-2)}

/* =====================================================================================
   VARIANT 2 · Trade-off board
   ===================================================================================== */
.v2 .panel{background:var(--card);border-radius:24px;box-shadow:var(--sh1);padding:16px}
.v2 .panel + .panel{margin-top:10px}
.v2 .bhead{display:flex;justify-content:space-between;align-items:baseline}
.v2 .bval{font-size:34px;font-weight:780;letter-spacing:-.03em}

.v2 .bfit b{color:var(--ink)}
.v2 .slider{position:relative;height:56px;margin-top:10px;touch-action:none;cursor:pointer}
.v2 .strack{position:absolute;left:0;right:0;top:20px;height:16px;border-radius:99px;background:var(--paper-2);overflow:hidden}

.v2 .shist i.in{background:var(--k-car)}

.v2 .chip.on{background:var(--accent);color:var(--on-accent)}
.v2 .seg2{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper-2);border-radius:18px;padding:4px;margin-top:8px}
.v2 .seg2 button{min-height:56px;border-radius:14px;font-size:16px;font-weight:650;line-height:1.1;text-align:center;padding:4px 2px}
.v2 .seg2 button small{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-top:3px}

    const anim = g.animate([{transform: 'translate(0,0) scale(1)', opacity: 1}, {transform: `translate(${dx}px,${dy}px) scale(${sc})`, opacity: .2}],
      {duration: REDUCED ? 1 : 420, easing: 'cubic-bezier(.3,1.05,.4,1)'});
    anim.onfinish = () => { g.remove(); popSlot(k); };
  }
  function addToTrip(card) {
    const k = card.dataset.k; T[k] = card.dataset.id; flyTo(card, k); update();
  }
  function cycle(k, dir = 1) { if (dir > 0) order[k].push(order[k].shift()); else order[k].unshift(order[k].pop()); layoutDeck(k); }
  // the decks: swipe sideways to flip, drag toward the tray (or tap Add) to put it in your trip
  for (const k of ['f', 's']) {
    const deck = $(k === 'f' ? '#df' : '#ds');
    $$('.dcard', deck).forEach(card => {
      let mode = null;
      drag(card, {
        start: (e, o) => { if (order[k][0] !== card.dataset.id) return false; mode = null; o.mouse = e.pointerType === 'mouse'; o.tapAdd = !!e.target.closest('[data-add]'); },
        move: (ev, dx, dy, o) => {
          if (!mode) { if (Math.hypot(dx, dy) < 8) return; mode = o.mouse ? 'drag' : (Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'drag'); card.classList.add('dragging'); }
          if (mode === 'swipe') card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
          else { card.style.transform = `translate(${dx}px,${dy}px) scale(.86) rotate(${dx / 40}deg)`; $('#tray3').classList.toggle('hot', overTray(ev)); }
        },
        end: (ev, dx, dy, o) => {
          const tray = $('#tray3'); const hot = mode === 'drag' && overTray(ev); tray.classList.remove('hot');
          if (!mode) { card.classList.remove('dragging'); addToTrip(card); return; }
          if (mode === 'swipe' && Math.abs(dx) > 70) {
            card.classList.remove('dragging'); card.style.transition = 'transform 220ms ease-in, opacity 220ms ease-in';
            card.style.transform = `translateX(${Math.sign(dx) * (card.offsetWidth + 80)}px) rotate(${Math.sign(dx) * 14}deg)`; card.style.opacity = 0;
            setTimeout(() => { card.classList.add('nodrag'); cycle(k, 1); void card.offsetWidth; card.classList.remove('nodrag'); card.style.transition = ''; }, 220);
          } else if (hot) { card.classList.remove('dragging'); T[k] = card.dataset.id; const g = card.getBoundingClientRect(); flyTo(card, k); card.classList.add('nodrag'); layoutDeck(k); void card.offsetWidth; card.classList.remove('nodrag'); update(); }
          else { card.classList.remove('dragging'); layoutDeck(k); }
          mode = null;
        }}, sig);
    });
  }
  function overTray(ev) {
    const r = $('#tray3').getBoundingClientRect(), pad = phone() ? 70 : 30;
    return ev.clientX > r.left - pad && ev.clientX < r.right + pad && ev.clientY > r.top - pad && ev.clientY < r.bottom + pad;
  }
  $$('.nav', app).forEach(b => b.addEventListener('click', () => cycle(b.dataset.nav, 1), {signal: sig}));
  $('#car3').addEventListener('click', e => { const b = e.target.closest('.cc'); if (!b) return; T.c = b.dataset.car || null; update(); if (T.c) popSlot('c'); }, {signal: sig});
  $('#best3').addEventListener('click', e => { const b = e.target.closest('.brow'); if (!b) return; const c = best()[b.dataset.k];
    T.f = c.f.id; T.s = c.s.id; bring('f', T.f); bring('s', T.s); update(); popSlot('f'); setTimeout(() => popSlot('s'), 90); }, {signal: sig});
  $('#tray3').addEventListener('click', e => { if (e.target.closest('[data-book]')) toast('Prototype: this would open each partner’s page and save the trip.'); }, {signal: sig});
  // budget: scrub sideways on the pill, like a dial
  const bud = $('#bud3');
  drag(bud, {start: (e, o) => { o.b0 = S.budget; bud.classList.add('drag'); }, move: (ev, dx, dy, o) => { const nb = clamp(Math.round((o.b0 + dx * 8) / 50) * 50, 1000, 4500); if (nb !== S.budget) { S.budget = nb; update(); } },
    end: (ev, dx, dy, o) => { bud.classList.remove('drag'); if (Math.abs(dx) < 4) { const r = bud.getBoundingClientRect(); S.budget = clamp(S.budget + (ev.clientX < r.left + r.width / 2 ? -100 : 100), 1000, 4500); update(); } }}, sig);
  // dates: drag the window along the strip (or tap a day to start there)
  const strip = $('#strip3');
  drag(strip, {start: (e, o) => { o.d0 = cur().d; strip.classList.add('drag'); },
    move: (ev, dx, dy, o) => { const w = strip.clientWidth / 12; $('#win3').style.left = (clamp(o.d0 - 2 + dx / w, 0, 7)) * w + 'px'; const nd = clamp(Math.round(o.d0 + dx / w), 2, 9); const id = STARTS.find(s => s.d === nd).id; if (id !== S.start) { S.start = id; update(); $('#win3').style.left = (clamp(o.d0 - 2 + dx / w, 0, 7)) * w + 'px'; } },
    end: (ev, dx, dy, o) => { strip.classList.remove('drag');
      if (Math.abs(dx) < 6) { const r = strip.getBoundingClientRect(); const d = clamp(Math.floor((ev.clientX - r.left) / (r.width / 12)) + 2, 2, 9); S.start = STARTS.find(s => s.d === d).id; }
      update(); }}, sig);
  addEventListener('resize', () => update(), {signal: sig});
  update();
}

/* ================================ the switcher (prototype only) ================================ */
const VARIANTS = [{k: '1', name: 'Split view', mount: mountV1}, {k: '2', name: 'Trade-off board', mount: mountV2}, {k: '3', name: 'Bento cockpit', mount: mountV3}];
let ctl;
function render() {
  const k = new URLSearchParams(location.search).get('variant') || '1';
  const i = Math.max(0, VARIANTS.findIndex(v => v.k === k)), v = VARIANTS[i];
  ctl && ctl.abort(); ctl = new AbortController();
  $('#app').innerHTML = ''; v.mount($('#app'), ctl.signal);
  $('#plabel').innerHTML = `${v.k}/${VARIANTS.length} · ${v.name}<small>PROTOTYPE</small>`;
  document.title = `PROTOTYPE ${v.k} · ${v.name} · GitAway booking`;
  scrollTo(0, 0);
}
function go(d) {
  const k = new URLSearchParams(location.search).get('variant') || '1';
  const i = Math.max(0, VARIANTS.findIndex(v => v.k === k)), n = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length];
  const u = new URL(location.href); u.searchParams.set('variant', n.k); history.replaceState(null, '', u); render();
}
$('#pv').onclick = () => go(-1); $('#nx').onclick = () => go(1);
addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
const MODES = ['auto', 'light', 'dark'];
let mode = localStorage.getItem('bs-mode') || 'auto';
function applyMode() {
  if (mode === 'auto') delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode = mode;
  $('#md').textContent = mode === 'auto' ? 'Auto' : mode === 'light' ? 'Light' : 'Dark';
}
$('#md').onclick = () => { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; localStorage.setItem('bs-mode', mode); applyMode(); };
const qm = new URLSearchParams(location.search).get('mode'); if (qm && MODES.includes(qm)) mode = qm;
applyMode(); render();
</script>
