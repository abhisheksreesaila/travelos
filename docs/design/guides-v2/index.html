<!doctype html>
<html lang="en" data-theme="light" data-palette="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitAway guides v2</title>
<meta name="description" content="Prototype of GitAway guides v2: a calmer palette, the Book · Plan · Guides bar, the guides hub, the guide page (glance, day rail, stop detail), guides inside booking and planning, and making a guide. Sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<!--
  Guides v2 + the calm palette (docs/briefs/guides-v2.md, founder 2026-11-15), in booking v2's language
  (docs/design/booking-v2 and planning-v2: the sky, the near-opaque cards, frosted glass only on widgets over the sky,
  the springs, the press-in). Type: Newsreader for display, Inter for everything you read and every number.

  The palette (switch "Palette: Calm / Before", bottom left):
    Calm   ink and indigo carry the UI: primary actions are solid indigo, neutral ones ink; headers, the planning hero and
           the pass are near-opaque cards or deep indigo. Kind colours (flight, stay, food, see, tickets, rides) only mark kinds.
    Before what v2 does today: the pink-to-violet sunset on buttons, headers, the planning hero and the pass.
  Either way the pink-violet gradient stays on exactly one thing: the Instagram share card (make a guide, then publish).

  The guide format ("the run sheet"): an at-a-glance header (six tiles), a day strip, each day a time rail of compact
  stop cards with the trip between them, and the detail one tap away (a side panel on a laptop, a sheet on a phone,
  opened in place inside a context sheet so no sheet ever opens on a sheet).

  Every guide, creator, price and link here is made up and labelled Sample. Drawings are illustrations, never photos.
  States: the "States" menu (bottom left), or ?s=<state>&theme=dark&palette=before in the address.
-->
<style>
:root {
  --f-display: "Newsreader", Georgia, serif;
  --f-ui: "Inter", system-ui, sans-serif;
  --d-wt: 560; --d-track: -0.022em;
  --num-feat: "tnum" 1, "cv11" 1, "ss01" 1;

  --sky-1: #C6E2F8; --sky-2: #E3E5FA; --sky-3: #FDE5CF;
  --ink: #0F1124; --ink-2: #41455E; --ink-3: #555A73;
  --card: rgb(255 255 255 / .88); --card-solid: #FFFFFF; --card-2: #F2F3FA; --card-3: #E8EAF5;
  --line: rgb(15 17 36 / .10); --line-2: rgb(15 17 36 / .18);
  --glass: rgb(255 255 255 / .62); --glass-line: rgb(255 255 255 / .75);
  --flight: #4338CA; --flight-t: #E4E3FB; --flight-i: #2A2185;
  --stay: #8B2FC9; --stay-t: #F1E3FA; --stay-i: #5A1785;
  --food: #C92A5E; --food-t: #FBE1EA; --food-i: #7E1538;
  --see: #0F766E; --see-t: #D9F2EF; --see-i: #0B4D48;
  --tix: #C2410C; --tix-t: #FCE6DA; --tix-i: #7A2906;
  --wx: #0369A1; --wx-t: #DBEFFA; --wx-i: #034769;
  --ride: #FFD43B; --ride-t: #FFF4C2; --ride-i: #5C4300; --ride-k: #E7B416;
  --sun: #FFB547; --sun-ink: #D97706;
  --indigo: #4338CA; --indigo-2: #3730A3; --indigo-t: #E4E3FB; --indigo-i: #2A2185; --on-indigo: #FFFFFF;
  --pill-on: #0F1124; --pill-fg: #FFFFFF;
  --cell: rgb(228 227 251 / .70); --cell-hover: rgb(214 212 250 / .95);
  --hatch: rgb(15 17 36 / .06); --scrim: rgb(10 10 30 / .26);
  --sh1: 0 1px 2px rgb(20 20 60 / .06), 0 2px 8px rgb(20 20 60 / .06);
  --sh2: 0 2px 6px rgb(20 20 60 / .08), 0 14px 32px -10px rgb(40 30 110 / .22);
  --sh3: 0 4px 14px rgb(20 20 60 / .07), 0 34px 70px -24px rgb(40 30 110 / .32);
  --sunset: linear-gradient(120deg, #4338CA 0%, #8B2FC9 52%, #C92A5E 100%);
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --press: 90ms; --release: 480ms; --quick: 200ms; --slow: 1000ms;
  --r-xl: 30px; --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
  --lead: 210px; --cw: 96px; --ch: 68px;
  /* the palette: calm (default) */
  --cta-bg: var(--indigo); --cta-fg: var(--on-indigo); --cta-sh: 0 10px 24px -12px rgb(67 56 202 / .7);
  --head-bg: var(--card); --head-fg: var(--ink); --head-fg2: var(--ink-2); --head-chip: var(--card-2);
  --pass-bg: #1E1B4B; --pass-fg: #FFFFFF; --pass-fg2: rgb(255 255 255 / .82);
  --nav-on: var(--indigo); --nav-on-fg: #FFFFFF;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --sky-1: #0B1430; --sky-2: #1D1D44; --sky-3: #33203F;
  --ink: #F4F5FB; --ink-2: #C3C6DA; --ink-3: #A9ADC4;
  --card: rgb(22 24 48 / .90); --card-solid: #171A33; --card-2: #22264A; --card-3: #2B2F57;
  --line: rgb(255 255 255 / .10); --line-2: rgb(255 255 255 / .18);
  --glass: rgb(26 28 56 / .60); --glass-line: rgb(255 255 255 / .10);
  --flight: #7B73FF; --flight-t: #24215A; --flight-i: #D2CFFF;
  --stay: #C084FC; --stay-t: #321A4A; --stay-i: #EBD4FD;
  --food: #FF6B9A; --food-t: #401528; --food-i: #FFD0DF;
  --see: #2DD4BF; --see-t: #0E302D; --see-i: #BCF0E8;
  --tix: #FB923C; --tix-t: #3D1E0E; --tix-i: #FFD6BC;
  --wx: #38BDF8; --wx-t: #0C2A3E; --wx-i: #C6EAFC;
  --ride-t: #3A300C; --ride-i: #FFE89A;
  --sun-ink: #FBBF24;
  --indigo: #5B54F0; --indigo-2: #4F46E5; --indigo-t: #24215A; --indigo-i: #D2CFFF;
  --pill-on: #F4F5FB; --pill-fg: #0F1124;
  --cell: rgb(52 50 120 / .55); --cell-hover: rgb(70 66 150 / .75);
  --hatch: rgb(255 255 255 / .06); --scrim: rgb(5 5 20 / .5);
  --sh1: 0 1px 2px rgb(0 0 0 / .3); --sh2: 0 12px 30px -10px rgb(0 0 0 / .6); --sh3: 0 30px 70px -24px rgb(0 0 0 / .75);
  --sunset: linear-gradient(120deg, #4F46E5 0%, #9333EA 52%, #DB2777 100%);
  --cta-sh: 0 10px 24px -12px rgb(0 0 0 / .7);
  --pass-bg: #2A2670;
  color-scheme: dark;
}
:root[data-theme="dark"] { --indigo: #4F46E5; }
/* the palette: before (v2 today: the sunset on buttons, headers, the planning hero and the pass) */
:root[data-palette="before"] {
  --cta-bg: var(--sunset); --cta-fg: #FFFFFF; --cta-sh: 0 12px 30px -12px rgb(139 47 201 / .6);
  --head-bg: var(--sunset); --head-fg: #FFFFFF; --head-fg2: rgb(255 255 255 / .9); --head-chip: rgb(255 255 255 / .16);
  --pass-bg: var(--sunset);
  --nav-on: var(--sunset);
}
@media (max-width: 719px) { :root { --lead: 100px; --cw: 78px; --ch: 64px; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--sky-3); scrollbar-gutter: stable; }
body { margin: 0; min-height: 100svh; color: var(--ink); font: 450 17px/1.5 var(--f-ui); font-optical-sizing: auto; overflow-x: clip; -webkit-font-smoothing: antialiased; }
@media (max-width: 719px) { body { font-size: 16px; } }
button, input { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: var(--d-wt); letter-spacing: var(--d-track); text-wrap: balance; margin: 0; }
.num { font-feature-settings: var(--num-feat); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg { flex: none; }
[hidden] { display: none !important; }
html.lock { overflow: hidden; }

/* ---------- press: every button and tappable card goes in and springs back (the built F-258 rule) ---------- */
:is(button, [role="button"], a.btn, .tap) { transition: scale var(--release) var(--spring), transform var(--quick) var(--ease), background-color var(--quick), color var(--quick), box-shadow var(--quick), opacity var(--quick); -webkit-tap-highlight-color: transparent; }
:is(button, [role="button"], a.btn, .tap):active:not(:disabled) { scale: .96; transition: scale var(--press) var(--ease); }
.tap.big:active { scale: .985; }

/* ---------- the sky: gradient, sun (a moon in the dark), clouds, the beach at the foot ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background: radial-gradient(60% 42% at 8% 0%, color-mix(in srgb, var(--wx-t) 90%, transparent), transparent 70%),
              radial-gradient(48% 36% at 96% 8%, color-mix(in srgb, var(--ride-t) 90%, transparent), transparent 70%),
              radial-gradient(70% 50% at 50% 104%, color-mix(in srgb, var(--flight-t) 95%, transparent), transparent 70%),
              linear-gradient(180deg, var(--sky-1), var(--sky-2) 52%, var(--sky-3)); transition: background var(--slow); }
.bg .sunball { position: absolute; right: 7%; top: 13%; width: 10rem; height: 10rem; border-radius: 50%; background: var(--sun);
  box-shadow: 0 0 0 2.4rem color-mix(in srgb, var(--sun) 20%, transparent), 0 0 0 5.2rem color-mix(in srgb, var(--sun) 9%, transparent);
  transition: opacity var(--slow) var(--ease) .22s, transform var(--slow) var(--spring-soft) .22s; }
:root[data-theme="dark"] .bg .sunball { opacity: 0; transform: translateY(60vh) scale(.8); transition: opacity var(--slow) var(--ease), transform var(--slow) var(--spring-soft); }
.bg .moon { position: absolute; right: 7%; top: 12%; width: 9.5rem; height: 9.5rem; opacity: 0; transform: translateY(60vh) rotate(-24deg); filter: drop-shadow(0 0 1.75rem rgb(243 235 211 / .28));
  transition: opacity var(--slow) var(--ease), transform var(--slow) var(--spring-soft); }
:root[data-theme="dark"] .bg .moon { opacity: 1; transform: none; transition: opacity var(--slow) var(--ease) .22s, transform var(--slow) var(--spring-soft) .22s; }
.bg .moon .zz { animation: zz 3.9s ease-in-out infinite alternate; }
@keyframes zz { from { opacity: .25; translate: 0 2px; } to { opacity: 1; translate: 0 -2px; } }
.bg .stars { position: absolute; left: 0; top: 0; width: 100%; height: 42vh; opacity: 0; transition: opacity var(--slow) var(--ease); }
:root[data-theme="dark"] .bg .stars { opacity: 1; transition-delay: .5s; }
.bg .stars circle { fill: #F3EBD3; animation: twinkle 3.9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -0.2s); }
@keyframes twinkle { from { opacity: .3; } to { opacity: .9; } }
.bg .cloud { position: absolute; fill: color-mix(in srgb, #fff 85%, transparent); transition: opacity var(--slow); animation: drift 60s linear infinite alternate; }
:root[data-theme="dark"] .bg .cloud { fill: rgb(255 255 255 / .06); }
@keyframes drift { to { translate: 6vw 0; } }
.bg .shore { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; min-height: 180px; transition: transform var(--slow) var(--spring-soft), opacity var(--slow); }
:root[data-theme="dark"] .bg .shore { filter: brightness(.42) saturate(.8); }
body.deep .bg .shore { transform: translateY(70%); opacity: .55; }
body.deep .bg .cloud { opacity: 0; }
body.deep .bg :is(.sunball, .moon) { scale: .6; translate: 0 -40%; }
:root[data-theme="dark"] body.deep .bg .stars { opacity: .4; }

/* ---------- top bar: brand · Book · Plan · Guides · the avatar ---------- */
.top { position: relative; z-index: 40; display: flex; align-items: center; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 16px 28px 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; text-decoration: none; color: var(--ink); font: 600 25px/1 var(--f-display); letter-spacing: -0.03em; flex: none; }
.brand svg { width: 34px; height: 34px; }
.top .sp { flex: 1; }
.sections { position: absolute; left: 50%; translate: -50% 0; display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-line), 0 10px 30px -14px rgb(40 30 110 / .25); }
.sections button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; min-width: 104px; padding: 0 20px; border: 0; border-radius: 999px; background: none; cursor: pointer; font: 620 17px/1 var(--f-ui); color: var(--ink); }
.sections button svg { width: 19px; height: 19px; }
.sections button:hover { background: color-mix(in srgb, var(--card-solid) 70%, transparent); }
.sections .blob { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--nav-on); box-shadow: var(--sh1); transition: left .5s var(--spring), width .5s var(--spring); }
.sections button > * { position: relative; z-index: 1; }
.sections button[aria-current="page"] { color: var(--nav-on-fg); background: none; }
.pill-sample { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--ride-t); color: var(--ride-i); font: 650 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.round { position: relative; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; color: var(--ink); flex: none; }
.round svg { width: 20px; height: 20px; }
.round.flat { background: var(--card-2); box-shadow: none; }
.av { --c: var(--indigo); display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; font: 700 15px/1 var(--f-ui); flex: none; }
.av.sm { width: 28px; height: 28px; font-size: 13px; }
.av.lg { width: 44px; height: 44px; font-size: 18px; }
.round.me { padding: 0; }
.round.me .av { width: 40px; height: 40px; }
.menu { position: absolute; z-index: 45; top: calc(100% - 4px); right: 28px; width: 290px; padding: 8px; border-radius: 22px; background: var(--card-solid); box-shadow: var(--sh3), 0 0 0 1px var(--line); transform-origin: calc(100% - 24px) 0; }
.menu .who { display: flex; align-items: center; gap: 12px; padding: 10px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu .who b { display: block; font-weight: 650; }
.menu .who small { display: block; color: var(--ink-2); font-size: 15px; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; border-radius: 14px; background: none; cursor: pointer; text-align: left; font: 560 16px/1.2 var(--f-ui); }
.menu button:hover { background: var(--card-2); }
.menu button svg { width: 19px; height: 19px; color: var(--ink-2); }
.menu button small { margin-left: auto; color: var(--ink-3); font-size: 14px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu .moved { margin: 4px 6px 2px; padding: 10px 12px; border-radius: 14px; background: var(--indigo-t); color: var(--indigo-i); font-size: 15px; line-height: 1.35; }

/* ---------- shared bits ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 28px 120px; }
.view { display: none; }
.view.on { display: block; animation: viewin .45s var(--ease) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer; font: 650 17px/1 var(--f-ui); text-decoration: none; white-space: nowrap; }
.btn svg { width: 19px; height: 19px; }
.btn.cta { background: var(--cta-bg); color: var(--cta-fg); box-shadow: var(--cta-sh); }
.btn.cta:hover { transform: translateY(-1px); }
.btn.ink { background: var(--pill-on); color: var(--pill-fg); }
.btn.soft { background: var(--card-solid); color: var(--ink); box-shadow: var(--sh1), inset 0 0 0 1px var(--line); }
.btn.soft:hover { box-shadow: var(--sh2), inset 0 0 0 1px var(--line-2); }
.btn.ghost { background: var(--card-2); color: var(--ink); }
.btn.lg { min-height: 56px; padding: 0 28px; font-size: 18px; }
.btn.busy { width: 56px; min-width: 0; padding: 0; pointer-events: none; transition: width .4s var(--spring-soft), padding .3s; }
.btn.busy > :not(.spin) { display: none; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgb(255 255 255 / .35); border-top-color: #fff; animation: spin .8s linear infinite; }
.spin.dk { border-color: color-mix(in srgb, var(--indigo) 22%, transparent); border-top-color: var(--indigo); width: 18px; height: 18px; border-width: 2.5px; }
@keyframes spin { to { rotate: 360deg; } }
.ic { --k: var(--see); width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--k); color: #fff; flex: none; }
.ic svg { width: 19px; height: 19px; }
.ic.k-ride { color: #2B2100; }
:root[data-theme="dark"] .ic:not(.k-ride) { color: #0B0C18; }
.k-food { --k: var(--food); --kt: var(--food-t); --ki: var(--food-i); }
.k-see { --k: var(--see); --kt: var(--see-t); --ki: var(--see-i); }
.k-tix { --k: var(--tix); --kt: var(--tix-t); --ki: var(--tix-i); }
.k-ride { --k: var(--ride-k); --kt: var(--ride-t); --ki: var(--ride-i); }
.k-stay { --k: var(--stay); --kt: var(--stay-t); --ki: var(--stay-i); }
.k-flight { --k: var(--flight); --kt: var(--flight-t); --ki: var(--flight-i); }
.smp { display: inline-flex; align-items: center; font: 650 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ride-i); background: var(--ride-t); padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.kick { font: 650 13px/1.2 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--card-solid); color: var(--ink); font: 580 16px/1 var(--f-ui); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.chip svg { width: 17px; height: 17px; }
.chip[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-fg); box-shadow: none; }
.art { overflow: hidden; background: var(--card-2); }
.art > svg { width: 100%; height: 100%; display: block; }
.ill { position: absolute; left: 10px; bottom: 10px; padding: 5px 9px; border-radius: 999px; background: rgb(15 17 36 / .66); color: #fff; font: 600 13px/1 var(--f-ui); }
.link-btn { border: 0; background: none; min-height: 48px; padding: 0 2px; color: var(--indigo-i); font: 620 16px/1 var(--f-ui); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; display: inline-flex; align-items: center; gap: 6px; }
:root[data-theme="dark"] .link-btn { color: var(--indigo-i); }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-line), 0 10px 30px -14px rgb(40 30 110 / .25); }
.scrim { position: fixed; inset: 0; z-index: 55; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: 28px; translate: -50% 0; display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; min-height: 56px; border-radius: 999px; background: var(--pill-on); color: var(--pill-fg); box-shadow: var(--sh3); font: 560 16px/1.3 var(--f-ui); opacity: 0; transform: translateY(20px) scale(.96); pointer-events: none; transition: opacity .25s var(--ease), transform .5s var(--spring); width: max-content; max-width: calc(100vw - 24px); }
.toast.on { opacity: 1; transform: none; pointer-events: auto; }
.toast .ok { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--see); color: #fff; flex: none; }
.toast .ok svg { width: 15px; height: 15px; }
.toast button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--pill-fg) 16%, transparent); color: var(--pill-fg); font-weight: 650; cursor: pointer; }

/* ---------- 1 · the hub ---------- */
.hub-top { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: end; padding-bottom: 26px; }
.hub-hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 30px 0 0; max-width: 900px; min-width: 0; }
.hub-hero h1 { font-size: clamp(2.6rem, 5vw, 4.2rem); line-height: 1.02; }
.hub-hero h1 em { font-style: italic; font-weight: 480; color: var(--ink-2); }
.hub-hero p { margin: 0; color: var(--ink-2); font-size: 19px; max-width: 40rem; }
.search { position: relative; max-width: 640px; }
.search label { position: relative; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 10px 0 22px; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh2), inset 0 0 0 1px var(--line); transition: box-shadow var(--quick); }
.search label:focus-within { box-shadow: var(--sh3), 0 0 0 3px color-mix(in srgb, var(--indigo) 35%, transparent); }
.search label > svg { width: 22px; height: 22px; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font: 500 19px/1 var(--f-ui); color: var(--ink); }
.search input::-webkit-search-cancel-button { display: none; }
.ac button > span:nth-child(2) { flex: 1; min-width: 0; }
.search input::placeholder { color: var(--ink-3); }
.search .clear { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; cursor: pointer; }
.search .clear svg { width: 18px; height: 18px; }
.ac { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 8px); padding: 8px; border-radius: 24px; background: var(--card-solid); box-shadow: var(--sh3), 0 0 0 1px var(--line); transform-origin: 30% 0; animation: grow .32s var(--spring-soft) both; }
@keyframes grow { from { opacity: 0; transform: scale(.96) translateY(-6px); } to { opacity: 1; transform: none; } }
.ac button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 6px 12px; border: 0; border-radius: 16px; background: none; cursor: pointer; text-align: left; }
.ac button:hover, .ac button.hi { background: var(--card-2); }
.ac .art { width: 44px; height: 44px; border-radius: 12px; }
.ac b { display: block; font-weight: 640; } .ac b mark { background: none; color: var(--indigo-i); }
.ac small { display: block; color: var(--ink-2); font-size: 15px; }
.ac .n { margin-left: auto; color: var(--ink-2); font: 600 15px/1 var(--f-ui); white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.fgroup { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fgroup > span { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin-right: 4px; }
.hub-body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 26px; align-items: start; }
.hub-head { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 14px; }
.hub-head h2 { font-size: 30px; }
.hub-head span { color: var(--ink-2); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.gcard { position: relative; display: flex; flex-direction: column; border: 0; padding: 0; text-align: left; border-radius: 26px; background: var(--card); box-shadow: var(--sh2); overflow: hidden; cursor: pointer; color: var(--ink); }
.gcard:hover { box-shadow: var(--sh3); transform: translateY(-2px); }
.gcard .art { position: relative; aspect-ratio: 16 / 9.4; }
.gcard .art .smp { position: absolute; left: 12px; top: 12px; }
.gcard .art .dz { position: absolute; right: 12px; top: 12px; padding: 7px 11px; border-radius: 999px; background: var(--card-solid); color: var(--ink); font: 650 14px/1 var(--f-ui); box-shadow: var(--sh1); }
.gcard .bd { display: grid; gap: 8px; padding: 14px 18px 16px; }
.gcard h3 { font-size: 23px; line-height: 1.12; }
.gcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 15px; }
.gcard .meta span { display: inline-flex; align-items: center; gap: 6px; }
.gcard .meta svg { width: 16px; height: 16px; color: var(--ink-3); }
.gcard .by { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 15px; }
.gcard .by b { color: var(--ink); font-weight: 620; }
.gcard .by .n { margin-left: auto; white-space: nowrap; }
.gcard.out { display: none; }
.empty { padding: 30px; border-radius: 26px; background: var(--card); text-align: center; color: var(--ink-2); }
.make { position: sticky; top: 16px; display: grid; gap: 14px; }
.makecard { padding: 22px; border-radius: 28px; background: var(--card); box-shadow: var(--sh3); }
.makecard h2 { font-size: 30px; line-height: 1.08; }
.makecard > p { margin: 6px 0 16px; color: var(--ink-2); font-size: 16px; }
.path { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 14px; border: 0; border-radius: 20px; background: var(--card-2); cursor: pointer; text-align: left; color: var(--ink); }
.path + .path { margin-top: 10px; }
.path:hover { background: var(--card-3); }
.path .pi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--card-solid); color: var(--indigo-i); box-shadow: var(--sh1); flex: none; overflow: hidden; }
.path .pi svg { width: 24px; height: 24px; }
.path .pi.art svg { width: 100%; height: 100%; }
.path b { display: block; font: 650 17px/1.25 var(--f-ui); }
.path small { display: block; color: var(--ink-2); font-size: 15px; line-height: 1.3; }
.path > svg { width: 20px; height: 20px; margin-left: auto; color: var(--ink-3); }
.mine { padding: 16px 18px; border-radius: 24px; }
.mine h3 { font: 650 14px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; }
.mine button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; border: 0; background: none; padding: 4px 0; text-align: left; cursor: pointer; }
.mine button + button { border-top: 1px solid var(--line); }
.mine .art { width: 44px; height: 44px; border-radius: 12px; }
.mine b { display: block; font-weight: 620; font-size: 16px; }
.mine small { display: block; color: var(--ink-2); font-size: 15px; }
.mine .st { margin-left: auto; font: 650 13px/1 var(--f-ui); padding: 6px 9px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); }

/* ---------- 2 · the guide (the run sheet) ---------- */
.gpage { display: grid; grid-template-columns: minmax(0, 1fr) 0px; gap: 0; align-items: start; transition: grid-template-columns .62s var(--spring-soft), gap .62s var(--spring-soft); }
.gpage.has-detail { grid-template-columns: minmax(0, 1fr) 440px; gap: 22px; }
.gmain { min-width: 0; display: grid; gap: 16px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px 0 10px; border: 0; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; font: 620 16px/1 var(--f-ui); justify-self: start; }
.back svg { width: 18px; height: 18px; }
.ghead { position: relative; display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 16px 22px 16px 16px; border-radius: var(--r-xl); background: var(--head-bg); color: var(--head-fg); box-shadow: var(--sh3); overflow: hidden; }
.ghead > .art { position: relative; width: 200px; height: 148px; border-radius: 22px; box-shadow: var(--sh1); }
.ghead .kick { color: var(--head-fg2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ghead h1 { margin: 8px 0 12px; font-size: clamp(2rem, 3.1vw, 2.9rem); line-height: 1.04; }
.byline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--head-fg2); font-size: 16px; }
.byline b { color: var(--head-fg); font-weight: 650; }
.byline .dot { opacity: .5; }
.gact { display: grid; gap: 10px; justify-items: stretch; min-width: 230px; }
.gact .row { display: flex; gap: 10px; justify-content: flex-end; }
:root[data-palette="before"] .ghead .btn.soft { background: rgb(255 255 255 / .18); color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35); }
:root[data-palette="before"] .ghead .round { background: rgb(255 255 255 / .18); color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35); }
:root[data-palette="before"] .ghead .btn.cta { background: #fff; color: #5A1785; }
.round.on { color: var(--food); }
.round.on svg { fill: currentColor; }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 10px; }
.gl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 12px 14px; border-radius: 20px; background: var(--card); box-shadow: var(--sh1); }
.gl > svg { grid-row: span 3; width: 22px; height: 22px; color: var(--ink-2); align-self: start; margin-top: 2px; }
.gl small { font: 650 12px/1.2 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.gl b { font: 680 18px/1.15 var(--f-ui); }
.gl span { color: var(--ink-2); font-size: 15px; line-height: 1.3; }
.daystrip { position: sticky; top: 8px; z-index: 6; display: grid; grid-template-columns: repeat(var(--nd, 3), minmax(0, 1fr)); gap: 8px; padding: 6px; border-radius: 26px; }
.dbtn { display: grid; gap: 4px; padding: 10px 14px 12px; border: 0; border-radius: 20px; background: color-mix(in srgb, var(--card-solid) 70%, transparent); cursor: pointer; text-align: left; color: var(--ink); min-width: 0; }
.dbtn .dn { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.dbtn b { font: var(--d-wt) 20px/1.15 var(--f-display); letter-spacing: var(--d-track); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dbtn .tl { position: relative; height: 12px; margin-top: 4px; }
.dbtn .tl::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; border-radius: 2px; background: var(--line-2); }
.dbtn .tl i { position: absolute; top: 0; width: 12px; height: 12px; border-radius: 4px; background: var(--k); translate: -50% 0; box-shadow: 0 0 0 2px var(--card-solid); }
.dbtn[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-fg); }
.dbtn[aria-pressed="true"] .dn { color: color-mix(in srgb, var(--pill-fg) 75%, transparent); }
.dbtn[aria-pressed="true"] .tl::before { background: color-mix(in srgb, var(--pill-fg) 30%, transparent); }
.dbtn[aria-pressed="true"] .tl i { box-shadow: 0 0 0 2px var(--pill-on); }
.daysec { scroll-margin-top: 120px; padding: 18px 20px 10px; border-radius: var(--r-xl); background: var(--card); box-shadow: var(--sh2); }
.daysec > header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; }
.daysec h2 { font-size: 28px; line-height: 1.1; }
.daysec h2 small { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }
.daysec header p { margin: 0; color: var(--ink-2); font-size: 16px; }
.daysec header .addday { margin-left: auto; }
.rail-l { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: 60px 22px minmax(0, 1fr); align-items: stretch; }
.stop .tm { padding-top: 18px; text-align: right; font: 650 16px/1 var(--f-ui); font-feature-settings: var(--num-feat); color: var(--ink); }
.stop .tm small { display: block; margin-top: 4px; font: 500 14px/1 var(--f-ui); color: var(--ink-3); }
.stop .ln { position: relative; }
.stop .ln::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line-2); }
.stop:first-child .ln::before { top: 22px; }
.stop.last .ln::before { bottom: calc(100% - 22px); }
.stop .ln i { position: absolute; left: 5px; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--k); box-shadow: 0 0 0 3px var(--card-solid); }
.leg { display: grid; grid-template-columns: 60px 22px minmax(0, 1fr); }
.leg .ln { position: relative; } .leg .ln::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(var(--line-2) 0 4px, transparent 4px 8px); }
.leg span { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0 4px 6px; color: var(--ink-2); font: 520 15px/1.3 var(--f-ui); }
.leg span svg { width: 17px; height: 17px; color: var(--ink-3); }
.sc { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; margin: 6px 0 6px 6px; padding: 12px 12px 12px 12px; border-radius: 20px; background: var(--card-solid); box-shadow: var(--sh1), inset 0 0 0 1px var(--line); cursor: pointer; text-align: left; border: 0; width: calc(100% - 6px); color: var(--ink); }
.sc:hover { box-shadow: var(--sh2), inset 0 0 0 1px var(--line-2); }
.sc[aria-expanded="true"], .sc.sel { box-shadow: var(--sh2), inset 0 0 0 2.5px var(--indigo); }
.sc .ic { margin-top: 2px; }
.sc .t { min-width: 0; display: grid; gap: 3px; }
.sc .t b { font: 650 17px/1.25 var(--f-ui); }
.sc .t .sub { color: var(--ink-3); font: 520 15px/1.3 var(--f-ui); }
.sc .t p { margin: 2px 0 0; color: var(--ink-2); font-size: 16px; line-height: 1.4; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.bdg { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; font: 620 14px/1 var(--f-ui); background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
.bdg svg { width: 14px; height: 14px; }
.bdg.cost { color: var(--ink); }
.bdg.tip { background: var(--ride-t); color: var(--ride-i); }
.bdg.lnk { background: var(--indigo-t); color: var(--indigo-i); }
.bdg.nolnk { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--ink-2); }
.sc .side { display: flex; align-items: center; gap: 4px; }
.plus { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card-2); color: var(--ink); cursor: pointer; flex: none; }
.plus svg { width: 20px; height: 20px; }
.plus:hover { background: var(--pill-on); color: var(--pill-fg); }
.plus.done { background: var(--see); color: #fff; }
:root[data-theme="dark"] .plus.done { color: #062320; }
.chev { width: 20px; height: 20px; color: var(--ink-3); transition: rotate .4s var(--spring); }
.sc[aria-expanded="true"] .chev { rotate: 90deg; }
.inplace { overflow: hidden; height: 0; transition: height .5s var(--spring-soft); margin-left: 6px; }
.inplace > div { padding: 4px 0 12px; }
.stays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stayc { display: grid; gap: 6px; padding: 14px; border-radius: 20px; background: var(--card-solid); box-shadow: var(--sh1), inset 0 0 0 1px var(--line); }
.stayc .top2 { display: flex; align-items: center; gap: 10px; }
.stayc small { font: 650 12px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.stayc b { font-weight: 650; }
.stayc p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.35; }
.stayc .pr { font: 700 20px/1 var(--f-ui); font-feature-settings: var(--num-feat); }
.stayc .pr small { font: 500 14px/1 var(--f-ui); letter-spacing: 0; text-transform: none; }
.befores { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.befores li { display: flex; gap: 12px; padding: 10px 0; font-size: 16px; color: var(--ink-2); line-height: 1.4; }
.befores li + li { border-top: 1px solid var(--line); }
.befores li svg { width: 20px; height: 20px; color: var(--ink-3); margin-top: 1px; }
.befores b { color: var(--ink); font-weight: 640; }
.disclose { color: var(--ink-2); font-size: 15px; text-align: center; padding: 6px 12px 20px; }

/* the detail: a side panel on a laptop */
.gdetail { position: sticky; top: 14px; min-width: 0; max-height: calc(100svh - 28px); overflow: hidden auto; scrollbar-width: thin; border-radius: var(--r-xl); background: var(--card-solid); box-shadow: var(--sh3); opacity: 0; transform: translateX(24px); transition: opacity .3s var(--ease), transform .62s var(--spring-soft); }
.gpage.has-detail .gdetail { opacity: 1; transform: none; }
.dt { padding: 14px 18px 20px; display: grid; gap: 14px; }
.dt.swap-dn { animation: swapdn .42s var(--ease) both; } .dt.swap-up { animation: swapup .42s var(--ease) both; }
@keyframes swapdn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes swapup { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.dt-top { display: flex; align-items: center; gap: 10px; }
.dt-top .kn { font: 650 13px/1.2 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ki); }
.dt-top .of { color: var(--ink-3); font-size: 15px; }
.dt-top .sp { flex: 1; }
.dt .art { position: relative; aspect-ratio: 16 / 9; border-radius: 20px; }
.dt h2 { font-size: 32px; line-height: 1.06; }
.dt .sub { margin-top: -6px; color: var(--ink-2); font-size: 16px; }
.words { margin: 0; padding: 14px 16px 14px 18px; border-radius: 18px; background: var(--card-2); position: relative; }
.words small { display: flex; align-items: center; gap: 8px; font: 650 12px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.words p { margin: 0; font: italic 450 20px/1.4 var(--f-display); color: var(--ink); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { padding: 10px 12px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); }
.fact small { display: block; font: 650 12px/1.2 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.fact b { display: block; margin-top: 4px; font: 640 16px/1.3 var(--f-ui); }
.fact.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.fact.wide > div { flex: 1; }
.tipbox { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 14px; border-radius: 18px; background: var(--ride-t); color: var(--ride-i); }
.tipbox .ti { grid-row: span 2; width: 34px; height: 34px; border-radius: 11px; background: var(--ride); color: #2B2100; display: grid; place-items: center; }
.tipbox .ti svg { width: 19px; height: 19px; }
.tipbox b { font: 680 15px/1.2 var(--f-ui); letter-spacing: .03em; }
.tipbox span { font-size: 16px; line-height: 1.4; }
.theirs { display: grid; gap: 8px; padding: 14px; border-radius: 18px; background: var(--indigo-t); }
.theirs .who { display: flex; align-items: center; gap: 10px; color: var(--indigo-i); font: 620 15px/1.3 var(--f-ui); }
.theirs .btn { justify-content: space-between; background: var(--card-solid); color: var(--ink); box-shadow: var(--sh1); }
.theirs .fine { color: var(--indigo-i); font-size: 15px; line-height: 1.35; margin: 0; }
.dt-act { display: grid; grid-template-columns: 1fr auto; gap: 10px; position: sticky; bottom: 0; padding: 12px 0 0; background: linear-gradient(transparent, var(--card-solid) 30%); }
.dt-empty { padding: 30px 22px; color: var(--ink-2); }

/* ---------- context sheets (booking and planning): a guide over your place ---------- */
.gsheet { position: fixed; z-index: 60; top: 12px; right: 12px; bottom: 12px; width: min(680px, 50vw); display: flex; flex-direction: column; border-radius: 30px; background: var(--card-solid); box-shadow: var(--sh3), 0 0 0 1px var(--line); overflow: hidden; }
.gsheet.peek { top: auto; height: 76px; }
.gs-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 12px; border-bottom: 1px solid var(--line); background: var(--card-solid); }
.gs-head .keep { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; min-height: 48px; border: 0; border-radius: 999px; background: var(--card-2); cursor: pointer; text-align: left; }
.gs-head .keep .ks { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card-solid); box-shadow: var(--sh1); flex: none; }
.gs-head .keep .ks svg { width: 18px; height: 18px; }
.gs-head .keep span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 560 15px/1.25 var(--f-ui); color: var(--ink-2); }
.gs-head .keep b { color: var(--ink); font-weight: 650; }
.gs-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 30px; display: grid; gap: 14px; align-content: start; }
.gsheet .ghead { grid-template-columns: 120px minmax(0, 1fr); padding: 12px; gap: 16px; box-shadow: none; }
.gsheet .ghead > .art { width: 120px; height: 104px; border-radius: 18px; }
.gsheet .ghead h1 { font-size: 28px; margin: 6px 0 8px; }
.gsheet .gact { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; min-width: 0; }
.gsheet .gact .row { display: none; }

.gsheet .daystrip { top: -14px; margin: 0 -16px; border-radius: 0; padding: 8px 16px; background: color-mix(in srgb, var(--card-solid) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 1px 0 var(--line); }
.gsheet .daysec { box-shadow: none; background: var(--card-2); padding: 14px 12px 8px; }
.gsheet .daysec .sc { width: calc(100% - 6px); }
.gsheet .stays { grid-template-columns: 1fr; }
.fitnote { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--see-t); color: var(--see-i); font: 560 16px/1.35 var(--f-ui); }
.fitnote svg { width: 22px; height: 22px; }
.fitnote b { color: var(--see-i); }

.bk { display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 22px; align-items: start; }
.sent { margin: 6px 0 18px; font: var(--d-wt) clamp(1.35rem, 1.9vw, 1.85rem)/1.3 var(--f-display); letter-spacing: var(--d-track); color: var(--ink); max-width: 1100px; }

.mx-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; padding: 0 16px 10px 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
.mx-head, .mx-row { position: relative; display: grid; grid-template-columns: var(--lead) repeat(var(--n), var(--cw)); width: max-content; }

.day { display: grid; justify-items: center; align-content: end; padding: 4px 4px 8px; border-radius: 16px 16px 0 0; }

.c { padding: 0 4px; position: relative; z-index: 1; }
.sq { position: relative; display: grid; grid-template-rows: auto 1fr; align-items: center; justify-items: center; width: 100%; height: var(--ch); padding: 9px 4px 5px; border: 0; border-radius: 18px; background: var(--cell); cursor: pointer; color: var(--ink); }

.sq.over { background: repeating-linear-gradient(135deg, transparent 0 7px, var(--hatch) 7px 14px), color-mix(in srgb, var(--card-2) 60%, transparent); color: var(--ink-3); }
.sq.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.band { position: absolute; z-index: 0; top: 8px; bottom: -6px; left: calc(var(--lead) + var(--c) * var(--cw)); width: calc(var(--k) * var(--cw)); border-radius: 22px; pointer-events: none; background: color-mix(in srgb, var(--indigo) 9%, transparent); box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--indigo) 55%, transparent); }

.grow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px; border: 0; border-radius: 18px; background: color-mix(in srgb, var(--card-solid) 72%, transparent); cursor: pointer; text-align: left; color: var(--ink); }

.grow > svg { width: 18px; height: 18px; color: var(--ink-3); }

.days5 div { padding: 8px 0; border-radius: 14px; background: color-mix(in srgb, var(--card-solid) 55%, transparent); display: grid; gap: 4px; justify-items: center; font: 600 15px/1 var(--f-ui); font-feature-settings: var(--num-feat); }

.days5 svg { width: 22px; height: 22px; } .days5 .sun svg { color: var(--sun-ink); } .days5 .rain svg { color: var(--wx); } .days5 .partly svg { color: var(--ink-2); }

:root[data-theme="dark"] .map { filter: brightness(.78) saturate(.9); }

/* ---------- 5b · planning (planning v2's calendar, kept) ---------- */
.pl { display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 16px 22px; align-items: start; }
.trip { grid-column: 1 / -1; position: relative; display: flex; align-items: center; gap: 22px; min-height: 112px; padding: 14px 22px 14px 14px; border-radius: var(--r-xl); background: var(--head-bg); color: var(--head-fg); box-shadow: var(--sh2); overflow: hidden; }

.stack { display: inline-flex; } .stack .av { box-shadow: 0 0 0 3px var(--card-solid); } .stack .av + .av { margin-left: -9px; }
:root[data-palette="before"] .trip .stack .av { box-shadow: 0 0 0 3px rgb(90 40 170); }
.together { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px 0 8px; border: 0; border-radius: 999px; background: var(--head-chip); color: var(--head-fg); cursor: pointer; font: 620 16px/1 var(--f-ui); }
.count { display: grid; justify-items: center; min-width: 110px; padding: 10px 14px; border-radius: 22px; background: var(--head-chip); }
.count b { font: 560 40px/1 var(--f-display); letter-spacing: -0.03em; }
.count span { font: 600 14px/1.2 var(--f-ui); color: var(--head-fg2); }
.cal { position: relative; border-radius: var(--r-xl); background: color-mix(in srgb, var(--card-solid) 94%, transparent); box-shadow: var(--sh3); overflow: hidden; display: flex; flex-direction: column; height: calc(100svh - 236px); min-height: 520px; }
.cal-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px 10px 18px; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--card-2); }
.seg button { min-height: 48px; padding: 0 16px; border-radius: 999px; border: 0; background: none; cursor: pointer; font: 620 15px/1 var(--f-ui); color: var(--ink-2); }

.cal-title { font: var(--d-wt) 24px/1.1 var(--f-display); letter-spacing: var(--d-track); }

.cal-top .legend .lg i { background: var(--k); width: 12px; height: 12px; border-radius: 4px; }
.grid { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); --gut: 56px; --hh: 44px; }
.g-head, .g-all, .g-inner { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); }
.dh { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0 10px; padding: 10px 10px 10px 12px; border-left: 1px solid var(--line); }
.dh .dw { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

.dh .wxl { display: inline-flex; align-items: center; gap: 5px; font: 600 15px/1.2 var(--f-ui); font-feature-settings: var(--num-feat); color: var(--ink-2); }
.dh .wxl svg { width: 20px; height: 20px; } .dh .wxl.sun svg { color: var(--sun-ink); } .dh .wxl.rain svg { color: var(--wx); }
.dh.free { background: color-mix(in srgb, var(--see-t) 40%, transparent); }
.g-all { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 40px; }

.stayband { grid-row: 1; margin: 6px 4px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 28px; border-radius: 10px; background: var(--stay-t); color: var(--stay-i); font: 620 15px/1 var(--f-ui); box-shadow: inset 4px 0 0 var(--stay); white-space: nowrap; overflow: hidden; }

.g-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.g-inner { position: relative; height: calc(var(--hours) * var(--hh)); }
.gut { position: relative; }

.ev { position: absolute; z-index: 2; top: var(--top); height: var(--h); left: 4px; right: 4px; display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--kt); color: var(--ki); box-shadow: inset 4px 0 0 var(--k); overflow: hidden; }

.flyer { position: fixed; z-index: 120; pointer-events: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 8px 14px; border-radius: 14px; overflow: hidden; background: var(--kt); color: var(--ki); box-shadow: inset 4px 0 0 var(--k), var(--sh3); font: 640 15px/1.2 var(--f-ui); }

/* ---------- 6 · making a guide ---------- */
.mk-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 4px 0 16px; }

@keyframes beat { 50% { box-shadow: inset 0 0 0 5px var(--indigo); } }
.steps li.done i { box-shadow: inset 0 0 0 10px var(--see); animation: none; } .steps li.done i svg { opacity: 1; }
:root[data-theme="dark"] .steps li.done i svg { color: #062320; }
.imp { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.src { position: sticky; top: 14px; padding: 18px 20px; border-radius: 26px; background: var(--card); box-shadow: var(--sh2); max-height: calc(100svh - 28px); overflow: auto; }

.src .ln2 { margin: 0 0 10px; padding: 4px 8px; border-radius: 10px; color: var(--ink-2); font: 450 16px/1.55 var(--f-display); font-size: 17px; transition: background-color .3s, color .3s; }
.src h4 { margin: 14px 8px 6px; font: var(--d-wt) 20px/1.2 var(--f-display); color: var(--ink); }
.src .ln2.read { background: color-mix(in srgb, var(--ride) 32%, transparent); color: var(--ink); }
.src .ln2.done { color: var(--ink); }
.src a { color: var(--indigo-i); text-decoration: underline; text-underline-offset: 3px; transition: background-color .3s; border-radius: 4px; }

.src .story { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--card-2); color: var(--ink-2); font-size: 15px; }

/* ================= motion helpers ================= */
function clipFrom(el, src, r = 22) {
  const b = el.getBoundingClientRect();
  return `inset(${Math.max(0, src.top - b.top)}px ${Math.max(0, b.right - src.right)}px ${Math.max(0, b.bottom - src.bottom)}px ${Math.max(0, src.left - b.left)}px round ${r}px)`;
}
function growFrom(el, srcEl) {
  if (RM.matches) return Promise.resolve();
  const src = srcEl && srcEl.getBoundingClientRect();
  const kids = [...el.children];
  if (src && src.width && src.bottom > 0 && src.top < innerHeight) {
    const a = el.animate([{ clipPath: clipFrom(el, src) }, { clipPath: 'inset(0 round 30px)' }], { duration: 640, easing: SPRING_SOFT });
    kids.forEach(k => k.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 120, easing: EASE, fill: 'backwards' }));
    return a.finished.catch(() => {});
  }
  const from = isPhone() ? 'translateY(100%)' : 'translateX(105%)';
  return el.animate([{ transform: from }, { transform: 'none' }], { duration: 560, easing: SPRING_SOFT }).finished.catch(() => {});
}
function shrinkTo(el, srcEl) {
  if (RM.matches) return Promise.resolve();
  const src = srcEl && srcEl.getBoundingClientRect();
  if (src && src.width && src.bottom > 0 && src.top < innerHeight) {
    [...el.children].forEach(k => k.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: EASE, fill: 'forwards' }));
    return el.animate([{ clipPath: 'inset(0 round 30px)' }, { clipPath: clipFrom(el, src) }], { duration: 380, easing: EASE, fill: 'forwards' }).finished.catch(() => {});
  }
  return el.animate([{ transform: 'none', opacity: 1 }, { transform: isPhone() ? 'translateY(100%)' : 'translateX(105%)', opacity: 1 }], { duration: 320, easing: EASE, fill: 'forwards' }).finished.catch(() => {});
}
function fly(src, dst, k, html) {
  if (RM.matches) return Promise.resolve();
  const f = document.createElement('div');
  f.className = `flyer k-${k}`; f.innerHTML = html;
  Object.assign(f.style, { left: src.left + 'px', top: src.top + 'px', width: src.width + 'px', height: src.height + 'px' });
  document.body.appendChild(f);
  const a = f.animate([{ left: src.left + 'px', top: src.top + 'px', width: src.width + 'px', height: src.height + 'px', opacity: .96 },
    { left: dst.left + 'px', top: dst.top + 'px', width: dst.width + 'px', height: dst.height + 'px', opacity: 1 }], { duration: 760, easing: SPRING_SOFT, fill: 'forwards' });
  return a.finished.catch(() => {}).then(() => f.remove());
}
function flip(container, sel, mutate) {
  const before = new Map($$(sel, container).map(e => [e, e.getBoundingClientRect()]));
  mutate();
  if (RM.matches) return;
  $$(sel, container).forEach(e => {
    const a = before.get(e), b = e.getBoundingClientRect();
    if (!b.width) return;
    if (a && a.width) { const dx = a.left - b.left, dy = a.top - b.top; if (dx || dy) e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 560, easing: SPRING_SOFT }); }
    else e.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: SPRING });
  });
}

  const D = $('#draft2'); pendAll(D);
  step(0); await wait(700); if (!alive()) return;
  $$('#minical .mb').forEach((m, i) => { if (!RM.matches) m.animate([{ transform: 'none' }, { transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 420, delay: i * 40, easing: EASE }); });
  await wait(600); if (!alive()) return;
  step(1); $$('.skel', D).forEach(e => e.classList.remove('skel')); land([$('.ghead', D)]); land($$('.gl', D), 50); land($$('.dbtn', D), 70);
  await wait(300);
  const secs = $$('.daysec[data-dsec]', D); land(secs, 90); $$('.leg', D).forEach(l => l.classList.remove('pend'));
  await frame();
  const flights = [];
  $$('.stop', D).forEach((li, i) => {
    const card = $('.sc', li), st = TG.stops.find(s => s.id === card.dataset.stop), mb = $(`#minical .mb[data-src="${st.src}"]`);
    const r = card.getBoundingClientRect(), m = mb.getBoundingClientRect();
    li.classList.remove('pend'); li.style.visibility = 'hidden';
    const show = () => { li.style.visibility = ''; if (!RM.matches) li.animate([{ transform: 'scale(.96)' }, { transform: 'none' }], { duration: 480, easing: SPRING }); };
    if (r.top < innerHeight && r.bottom > 0 && !RM.matches) flights.push(new Promise(res => setTimeout(() => fly(m, r, st.k, `<b>${esc(st.name)}</b>`).then(() => { show(); res(); }), i * 110)));
    else { setTimeout(show, RM.matches ? 0 : 400 + i * 40); }

  step(2); land($$('.daysec[data-extra]', D), 120);
  $$('.bdg.priv', D).forEach((b, i) => { if (!RM.matches) b.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520, delay: i * 80, easing: SPRING, fill: 'backwards' }); });
  $('#minical').style.opacity = '.62';
  await wait(800); if (!alive()) return; step(3);
  D.insertAdjacentHTML('afterbegin', `<div class="ready settle"><p><b>Your draft is ready:</b> 5 days, 11 stops. Add a line on why for each stop and your own links, then publish.</p><button class="btn cta" data-act="toEdit" data-g="trip">${I.pen}Edit and publish</button></div>`);
}
function drawEdit() {

    <div class="edbar"><span class="st"><i></i>Draft · saved just now</span><span class="hint">Tap any words to change them</span><span class="sp"></span><button class="btn ghost" data-act="preview">Preview</button><button class="btn cta" data-act="publish" id="pubBtn">${I.sparkle}<span>Publish</span></button></div>

        <span class="ft"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#fff"/><circle cx="26" cy="15" r="6" fill="#FFD43B"/><path d="M5 27c5-4 9-4 14 0s9 4 16 0v8a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z" fill="#4338CA"/></svg>Plan it on GitAway · ${g.url.replace('gitaway.me/', '')}</span></div>

function closeDone() { $('#done').hidden = true; $('#confetti').innerHTML = ''; $('#scrim').classList.remove('on'); document.documentElement.classList.remove('lock'); document.body.classList.remove('sheet-open'); }
function confetti() {
  if (RM.matches) return;

  $('#confetti').innerHTML = Array.from({ length: 26 }, (_, i) => `<i style="left:${8 + hash('c', i) * 84}%;--c:${cs[i % cs.length]};--d:${Math.round(hash('d', i) * 500)}ms;--x:${Math.round((hash('x', i) - .5) * 160)}px;--r:${Math.round(hash('r', i) * 720)}deg"></i>`).join('');

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('#menu, #meBtn') && !$('#menu').hidden) toggleMenu(false);
  if (!t.closest('#states, #stBtn') && !$('#states').hidden) toggleStates(false);
  if (!t.closest('#search')) { const ac = $('#ac'); if (ac) ac.hidden = true; }
  const nav = t.closest('[data-nav]'); if (nav) { e.preventDefault(); return go(nav.dataset.nav === 'guides' ? 'hub' : nav.dataset.nav); }
  const pal = t.closest('[data-pal]'); if (pal) return setPalette(pal.dataset.pal);
  const stl = t.closest('[data-state]'); if (stl) { toggleStates(false); return goState(stl.dataset.state); }
  const fl = t.closest('[data-f]'); if (fl) { const set = S.f[fl.dataset.f], v = fl.dataset.v; set.has(v) ? set.delete(v) : set.add(v); fl.setAttribute('aria-pressed', set.has(v)); return filterHub(); }
  const pl = t.closest('[data-place]'); if (pl) { S.q = pl.dataset.place; $('#q').value = S.q; $('#ac').hidden = true; $('.search .clear').hidden = false; return filterHub(); }
  const gc = t.closest('[data-g]'); if (gc && gc.classList.contains('gcard')) return gc.dataset.g === 'sd-kids' ? openGuidePage(gc) : toast('Prototype: only “Three easy days in San Diego with kids” is filled in.');
  const og = t.closest('[data-openguide]'); if (og) return og.dataset.openguide === 'sd-kids' ? openSheet(og.dataset.ctx, og) : toast('Prototype: only the first guide is filled in.');
  const add = t.closest('[data-add]'); if (add) { e.stopPropagation(); const card = add.closest('.sc'); return addStops([add.dataset.add], [card]); }
  const day = t.closest('.dbtn'); if (day) { const sec = document.getElementById(`${day.dataset.pre}-d${day.dataset.day}`); sec?.scrollIntoView({ behavior: RM.matches ? 'auto' : 'smooth', block: 'start' }); return; }
  const cday = t.closest('[data-cday]'); if (cday) { S.calDay = +cday.dataset.cday; $$('.dchip').forEach(b => b.setAttribute('aria-pressed', b === cday)); drawCal(); return scrollCalTo(8); }
  const sc = t.closest('.sc[role="button"]');
  if (sc) { if (sc.closest('#gsheet')) return toggleInplace(sc); return S.detail === sc.dataset.stop && !isPhone() ? closeDetail() : openDetail(sc.dataset.stop); }
  const a = t.closest('[data-act]'); if (!a) return;
  e.preventDefault();
  const act = a.dataset.act;
  ({
    toHub: () => go('hub'), toHubSD: () => { closeSheet(); S.q = 'San Diego'; go('hub'); },
    toPlan: () => go('plan'), myGuides: () => go('edit'), saved: () => go('hub'), editDraft: () => { S.editG = TG; go('edit'); },
    clearq: () => { S.q = ''; $('#q').value = ''; a.hidden = true; filterHub(); $('#q').focus(); },
    fromTrip: () => go('fromtrip'), fromBlog: () => go('imp'),
    toEdit: () => { S.editG = a.dataset.g === 'trip' ? TG : G; go('edit'); },
    closedetail: () => isPhone() ? closeStopSheet() : closeDetail(), prev: () => stepDetail(-1), next: () => stepDetail(1),
    closesheet: () => closeSheet(), unpeek: () => peekSheet(false),
    addday: () => addStops(['b1', 'b2', 'b3'], ['b1', 'b2', 'b3'].map(id => $(`#gsheet .sc[data-stop="${id}"]`))),
    addplan: () => { if (S.sheet === 'plan') return addStops(['b1', 'b2', 'b3'], ['b1', 'b2', 'b3'].map(id => $(`#gsheet .sc[data-stop="${id}"]`))); if (S.sheet) { closeSheet(); return toast('Saved to your San Diego trip: it waits beside your calendar in Plan.'); } go('plan').then(() => openSheet('plan', $('#v-plan [data-openguide="sd-kids"]'))); },
    planthis: () => { if (S.sheet === 'book') { closeSheet(); return toast('Guide kept with this trip: it waits beside you in Plan.'); } closeStopSheet(); closeSheet(); go('book'); toast('Searching San Diego for 3 days, the guide’s length'); },
    save: () => { S.saved = !S.saved; $$('[data-act="save"]').forEach(b => { b.classList.toggle('on', S.saved); b.setAttribute('aria-pressed', S.saved); }); toast(S.saved ? 'Saved to your guides' : 'Removed from your guides'); },
    share: () => toast('Link copied: gitaway.me/g/three-easy-days-sd'), theirlink: () => toast('Opens Maya’s own link on the partner’s site (prototype)'), maps: () => toast('Opens in your maps app (prototype)'),
    undo: () => { S.undo && S.undo(); $('#toast').classList.remove('on'); },
    addlink: () => { const tbox = a.closest('.t'); if ($('.lnkform', tbox)) return; a.insertAdjacentHTML('afterend', `<div class="lnkform"><input placeholder="Paste your link (any site)" aria-label="Your link" value="https://www.getyourguide.example/ref=saltandsun"><button class="btn ink" data-act="savelink">Save</button></div>`); $('.lnkform input', tbox).focus(); },
    savelink: () => { const f = a.closest('.lnkform'), btn = f.previousElementSibling; btn.outerHTML = `<span class="bdg lnk settle">${I.link}Your link</span>`; f.remove(); toast('Link saved. Readers see it labelled as yours.'); },
    nudge: () => { const m = $('.editing .why-missing, .editing .addlink'); m?.scrollIntoView({ block: 'center', behavior: RM.matches ? 'auto' : 'smooth' }); m?.focus?.(); },
    preview: () => { G === S.editG ? (go('guide')) : toast('Preview shows the page readers see'); },
    publish: () => publish(), closedone: () => closeDone(), copy: () => { a.textContent = 'Copied'; }, ig: () => toast('Saved the card to your photos; Instagram opens next (prototype)'),
    seeguide: () => { closeDone(); go('guide'); },
  }[act] || (() => {}))();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#done').hidden) return closeDone(); if (!$('#stopSheet').hidden) return closeStopSheet(); if (!$('#gsheet').hidden) return closeSheet(); if (S.detail) return closeDetail(); if (!$('#menu').hidden) return toggleMenu(false); }
  if (S.detail && S.view === 'guide' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.target.closest('input,[contenteditable]')) { e.preventDefault(); stepDetail(e.key === 'ArrowDown' ? 1 : -1); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.sc[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('.search .clear').hidden = !S.q; drawAc(); filterHub(); } });
document.addEventListener('focusin', e => { if (e.target.id === 'q' && S.q) drawAc(); });
$('#scrim').addEventListener('click', () => { if (!$('#done').hidden) return closeDone(); if (!$('#stopSheet').hidden) return closeStopSheet(); closeSheet(); });
$('#meBtn').addEventListener('click', () => toggleMenu());
$('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('#stBtn').addEventListener('click', () => toggleStates());

function openGuidePage(card) {
  const run = () => { go('guide', { noscroll: false }); };
  if (document.startViewTransition && !RM.matches && card) {
    const a = card.querySelector('.art'); a.style.viewTransitionName = 'g-art';
    document.startViewTransition(() => { a.style.viewTransitionName = ''; run(); });
  } else run();
}
async function go(v) {
  closeDetail(); if (!$('#gsheet').hidden) { $('#gsheet').hidden = true; S.sheet = null; $('#scrim').classList.remove('on'); document.documentElement.classList.remove('lock'); document.body.classList.remove('sheet-open'); }
  if (!$('#stopSheet').hidden) { $('#stopSheet').hidden = true; $('#scrim').classList.remove('on'); document.documentElement.classList.remove('lock'); document.body.classList.remove('sheet-open'); }
  if (!$('#done').hidden) closeDone();
  ({ hub: drawHub, guide: drawGuide, book: drawBook, plan: drawPlan, make: drawMake, edit: drawEdit, imp: () => {}, fromtrip: () => {} }[v])();
  setView(v);
  if (v === 'imp') runImport();
  if (v === 'fromtrip') runFromTrip();

}

/* ================= theme, palette, states ================= */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? I.sunline : I.moon; $('#themeBtn').setAttribute('aria-label', t === 'dark' ? 'Switch to light' : 'Switch to dark');
  try { localStorage.setItem('gv2-theme', t); } catch {}
}
function setPalette(p) {
  document.documentElement.dataset.palette = p;
  $$('[data-pal]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pal === p));
  try { localStorage.setItem('gv2-palette', p); } catch {}
}
const STATES = [
  ['The calm palette and the bar', [['hub', 'Guides hub'], ['hub-search', 'Hub: search a place, filter'], ['menu', 'The avatar menu']]],
  ['A guide', [['guide', 'Guide page (the run sheet)'], ['guide-stop', 'Guide: a stop’s detail']]],
  ['Guides in context', [['book', 'Book: guides beside the matrix'], ['book-sheet', 'Book: a guide over your trips'], ['book-stop', 'Book: a stop opened in place'], ['plan', 'Plan: guides beside the calendar'], ['plan-sheet', 'Plan: a guide over your plan'], ['plan-added', 'Plan: a morning dropped in']]],
  ['Making a guide', [['make', 'Make a guide: two ways in'], ['make-blog', 'From a blog post (live)'], ['make-trip', 'From your trip (live)'], ['edit', 'Edit inline'], ['published', 'Published, the Instagram card']]],
];
let curState = 'hub';
function toggleStates(on) {
  const s = $('#states'); on = on ?? s.hidden;
  $('#stBtn').setAttribute('aria-expanded', on);
  if (!on) { s.hidden = true; return; }
  let n = 0;
  s.innerHTML = STATES.map(([h, list]) => `<h4>${h}</h4>${list.map(([k, l]) => `<button data-state="${k}" class="${k === curState ? 'cur' : ''}"><i>${++n}</i>${l}</button>`).join('')}`).join('') +
    `<h4>Palette</h4><div class="pal"><button data-pal="calm" aria-pressed="${document.documentElement.dataset.palette === 'calm'}">Calm</button><button data-pal="before" aria-pressed="${document.documentElement.dataset.palette === 'before'}">Before</button></div>`;
  s.hidden = false;
}
async function goState(k) {
  curState = k; toggleMenu(false); $('#toast').classList.remove('on');
  S.added.clear(); S.events = EVENTS0.map(e => ({ ...e })); S.calDay = 1; S.detail = null;
  const at = (sel) => $(sel);
  switch (k) {
    case 'hub': S.q = ''; Object.values(S.f).forEach(s => s.clear()); await go('hub'); break;
    case 'hub-search': S.q = ''; Object.values(S.f).forEach(s => s.clear()); await go('hub'); { const q = $('#q'); q.focus(); for (const ch of 'San') { q.value += ch; S.q = q.value; drawAc(); await wait(90); } $('.search .clear').hidden = false; S.f.who.add('family'); $('[data-f="who"][data-v="family"]').setAttribute('aria-pressed', 'true'); filterHub(); } break;
    case 'menu': await go('hub'); toggleMenu(true); break;
    case 'guide': await go('guide'); break;
    case 'guide-stop': await go('guide'); await frame(); { const s = $('#page-sd-kids-d1'); if (!isPhone()) window.scrollTo({ top: s.getBoundingClientRect().top + scrollY - 100, behavior: 'instant' }); } openDetail('a3'); break;
    case 'book': await go('book'); break;
    case 'book-sheet': case 'book-stop': await go('book'); $('#mxScroll').scrollLeft = 96; await frame(); await openSheet('book', at('#v-book [data-openguide="sd-kids"]'));
      if (k === 'book-stop') { await wait(200); const c = $('#gsheet .sc[data-stop="a3"]'); $('#gsBody').scrollTop = c.offsetTop - 120; toggleInplace(c); } break;
    case 'plan': await go('plan'); break;
    case 'plan-sheet': case 'plan-added': await go('plan'); await frame(); await openSheet('plan', at('#v-plan [data-openguide="sd-kids"]'));
      { const sec = $('#gsheet [data-dsec="2"]'); $('#gsBody').scrollTop = sec.offsetTop - 70; }
      if (k === 'plan-added') { await wait(250); await addStops(['b1', 'b2', 'b3'], ['b1', 'b2', 'b3'].map(id => $(`#gsheet .sc[data-stop="${id}"]`))); } break;
    case 'make': await go('make'); break;
    case 'make-blog': await go('imp'); break;
    case 'make-trip': await go('fromtrip'); break;
    case 'edit': S.editG = G; await go('edit'); break;
    case 'published': S.editG = G; await go('edit'); await wait(200); await publish(); break;
  }
  try { const u = new URL(location); u.searchParams.set('s', k); history.replaceState(null, '', u); } catch {}
}

    <rect x="120" y="128" width="380" height="6" fill="#2B3A4A"/>${Array.from({ length: 16 }, (_, i) => `<rect x="${130 + i * 24}" y="134" width="4" height="40" fill="#2B3A4A"/>`).join('')}<rect x="456" y="104" width="40" height="24" rx="2" fill="#E4572E"/><path d="M450 104h52l-26-14z" fill="#2B3A4A"/>

    <g transform="translate(860 150)"><path d="M0 0 h60 l-8 10 h-44z" fill="#C2410C"/><path d="M28 0 V-46 L56 -4z" fill="#FFD43B"/><path d="M26 -2 V-38 L6 -4z" fill="#fff"/></g>`;
  PHONE.addEventListener('change', () => { if (S.view === 'plan') drawCal(); if (S.view === 'guide' && S.detail) closeDetail(); setNav(SECTION_OF[S.view], false); });
  addEventListener('resize', () => setNav(SECTION_OF[S.view], false));
  goState(q.get('s') || 'hub');
  document.fonts?.ready.then(() => setNav(SECTION_OF[S.view], false));
})();
</script>
