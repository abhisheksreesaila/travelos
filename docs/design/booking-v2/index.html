<!doctype html>
<html lang="en" data-theme="light" data-type="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitAway booking v2</title>
<meta name="description" content="Prototype of GitAway's booking page: the sentence, the matrix, the widgets, the drawer and the booking, every state clickable. Sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:opsz,wght@14..32,400..800&family=Geist:wght@400..800&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet">
<!--
  TYPE: three pairings, flip them live with the floating "Type" switch (bottom left).

  A (recommended) Bricolage Grotesque for display + Inter for everything you read and every number.
    Why: the founder liked the cover's title (a heavy, tight grotesque) and disliked the body. Bricolage keeps that weight and tightness but adds
    warmth and a little ink-trap character, so the sentence reads like a travel brand, not a dashboard. Inter is the most legible UI face there is
    at 16-18px, and its tabular figures (tnum) plus the open digits (cv11 / ss01) make prices line up column by column in the matrix, the way
    Google Flights and Stripe do it. Body is 17px on a laptop, 16px on a phone, never smaller; prices are 20px+ and the totals 44px+.
  B Geist 800 display + Inter body: the cover's own title face, only the body swapped. The safe, continuous choice.
  C Newsreader display + Inter body: the founder's reading pairing (2026-11-13). Editorial, magazine-like; softer, less "app".
-->
<style>
:root {
  --f-display: "Bricolage Grotesque", system-ui, sans-serif;
  --f-ui: "Inter", system-ui, sans-serif;
  --f-num: "Inter", system-ui, sans-serif;
  --d-wt: 720; --d-track: -0.035em; --d-lh: 1.06;
  --num-feat: "tnum" 1, "cv11" 1, "ss01" 1;

  --sky-1: #C6E2F8; --sky-2: #E3E5FA; --sky-3: #FDE5CF;
  --ink: #0F1124; --ink-2: #41455E; --ink-3: #555A73;
  --card: rgb(255 255 255 / .86); --card-solid: #FFFFFF; --card-2: #F2F3FA; --lead-bg: #F8F8FD;
  --line: rgb(15 17 36 / .10); --line-2: rgb(15 17 36 / .18);
  --glass: rgb(255 255 255 / .62); --glass-line: rgb(255 255 255 / .75);
  --flight: #4338CA; --flight-t: #E4E3FB; --flight-i: #2A2185;
  --stay: #8B2FC9; --stay-t: #F1E3FA; --stay-i: #5A1785;
  --food: #C92A5E; --food-t: #FBE1EA; --food-i: #7E1538;
  --see: #0F766E; --see-t: #D9F2EF; --see-i: #0B4D48;
  --tix: #C2410C; --tix-t: #FCE6DA; --tix-i: #7A2906;
  --wx: #0369A1; --wx-t: #DBEFFA; --wx-i: #034769;
  --ride: #FFD43B; --ride-t: #FFF4C2; --ride-i: #5C4300;
  --sun: #FFB547; --on: #FFFFFF;
  --cell: rgb(228 227 251 / .70); --cell-hover: rgb(214 212 250 / .95);
  --hatch: rgb(15 17 36 / .06);
  --sh1: 0 1px 2px rgb(20 20 60 / .06), 0 2px 8px rgb(20 20 60 / .06);
  --sh2: 0 2px 6px rgb(20 20 60 / .08), 0 14px 32px -10px rgb(40 30 110 / .22);
  --sh3: 0 4px 14px rgb(20 20 60 / .07), 0 34px 70px -24px rgb(40 30 110 / .32);
  --sunset: linear-gradient(120deg, #4338CA 0%, #8B2FC9 52%, #C92A5E 100%);
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --r-xl: 32px; --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
  --lead: 226px; --cw: 100px; --ch: 70px;
  color-scheme: light;
}
:root[data-type="b"] { --f-display: "Geist", system-ui, sans-serif; --f-num: "Geist", system-ui, sans-serif; --d-wt: 800; --d-track: -0.05em; --d-lh: 1.02; --num-feat: "tnum" 1; }
:root[data-type="c"] { --f-display: "Newsreader", Georgia, serif; --d-wt: 560; --d-track: -0.022em; --d-lh: 1.08; }
:root[data-theme="dark"] {
  --sky-1: #0B1430; --sky-2: #1D1D44; --sky-3: #33203F;
  --ink: #F4F5FB; --ink-2: #C3C6DA; --ink-3: #A9ADC4;
  --card: rgb(20 22 44 / .80); --card-solid: #171A33; --card-2: #22264A; --lead-bg: #1A1D39;
  --line: rgb(255 255 255 / .10); --line-2: rgb(255 255 255 / .18);
  --glass: rgb(26 28 56 / .60); --glass-line: rgb(255 255 255 / .10);
  --flight: #7B73FF; --flight-t: #24215A; --flight-i: #D2CFFF;
  --stay: #C084FC; --stay-t: #321A4A; --stay-i: #EBD4FD;
  --food: #FF6B9A; --food-t: #401528; --food-i: #FFD0DF;
  --see: #2DD4BF; --see-t: #0E302D; --see-i: #BCF0E8;
  --tix: #FB923C; --tix-t: #3D1E0E; --tix-i: #FFD6BC;
  --wx: #38BDF8; --wx-t: #0C2A3E; --wx-i: #C6EAFC;
  --ride-t: #3A300C; --ride-i: #FFE89A;
  --on: #FFFFFF;
  --cell: rgb(52 50 120 / .55); --cell-hover: rgb(70 66 150 / .75);
  --hatch: rgb(255 255 255 / .06);
  --sh1: 0 1px 2px rgb(0 0 0 / .3); --sh2: 0 12px 30px -10px rgb(0 0 0 / .6); --sh3: 0 30px 70px -24px rgb(0 0 0 / .75);
  --sunset: linear-gradient(120deg, #4F46E5 0%, #9333EA 52%, #DB2777 100%);
  color-scheme: dark;
}
@media (max-width: 719px) { :root { --lead: 100px; --cw: 80px; --ch: 66px; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; color: var(--ink); background: var(--sky-3); font: 450 17px/1.5 var(--f-ui); font-optical-sizing: auto; overflow-x: hidden; overflow-x: clip; }
@media (max-width: 719px) { body { font-size: 16px; } }
button { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-feature-settings: var(--num-feat); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); font-weight: var(--d-wt); letter-spacing: var(--d-track); line-height: var(--d-lh); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- the sky behind everything (the cover's, kept) ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background: radial-gradient(60% 42% at 8% 0%, color-mix(in srgb, var(--wx-t) 90%, transparent), transparent 70%),
              radial-gradient(48% 36% at 96% 8%, color-mix(in srgb, var(--ride-t) 90%, transparent), transparent 70%),
              radial-gradient(70% 50% at 50% 104%, color-mix(in srgb, var(--flight-t) 95%, transparent), transparent 70%),
              linear-gradient(180deg, var(--sky-1), var(--sky-2) 52%, var(--sky-3)); }
.bg .sunball { position: absolute; right: 7%; top: 13%; width: 10rem; height: 10rem; border-radius: 50%; background: var(--sun);
  box-shadow: 0 0 0 2.4rem color-mix(in srgb, var(--sun) 20%, transparent), 0 0 0 5.2rem color-mix(in srgb, var(--sun) 9%, transparent); transition: opacity .8s var(--ease-out), transform 1s var(--spring-soft); }
:root[data-theme="dark"] .bg .sunball { background: #F3EBD3; box-shadow: 0 0 0 2.4rem rgb(243 235 211 / .08), 0 0 0 5.2rem rgb(243 235 211 / .04); width: 9rem; height: 9rem; }
.bg .cloud { position: absolute; fill: color-mix(in srgb, #fff 85%, transparent); transition: opacity .8s; animation: drift 60s linear infinite alternate; }
:root[data-theme="dark"] .bg .cloud { fill: rgb(255 255 255 / .06); }
@keyframes drift { to { translate: 6vw 0; } }
.bg .shore { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; min-height: 180px; transition: transform 1s var(--spring-soft), opacity .8s; }
body.is-results .bg .shore { transform: translateY(70%); opacity: .55; }
body.is-results .bg .sunball, body.is-results .bg .cloud { opacity: 0; }
body.is-results .bg .sunball { transform: translateY(-40%) scale(.6); }
:root[data-theme="dark"] .bg .shore { filter: brightness(.42) saturate(.8); }

/* ---------- top bar ---------- */
.top { position: relative; z-index: 20; display: flex; align-items: center; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 18px 28px 0; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 760 22px/1 var(--f-display); letter-spacing: -0.03em; }
.brand svg { width: 34px; height: 34px; }
.top .sp { flex: 1; }
.pill-sample { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--ride-t); color: var(--ride-i); font: 650 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; }
.round { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; color: var(--ink); transition: transform .18s var(--ease-out); }
.round:active { transform: scale(.94); }
.round svg { width: 20px; height: 20px; }

/* ---------- the sentence ---------- */
.stage { position: relative; max-width: 1440px; margin: 0 auto; padding: 0 28px; }
.hero { min-height: calc(100svh - 80px); display: grid; align-content: center; justify-items: center; text-align: center; gap: 34px; padding: 0 0 22vh; }
.kicker { max-width: 100%; text-align: left; display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh1); font: 600 15px/1 var(--f-ui); color: var(--ink-2); }
.kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--see); }
.sent { margin: 0; max-width: 1120px; font-family: var(--f-display); font-weight: var(--d-wt); letter-spacing: var(--d-track); line-height: 1.16; font-size: clamp(2.1rem, 4.3vw, 4.1rem); text-wrap: balance; color: var(--ink); transform-origin: 0 0; }
.sent .fill { color: var(--ink-2); }
.w { display: inline; padding: 0 .06em; margin: 0; border: 0; background: none; cursor: pointer; font: inherit; letter-spacing: inherit; color: var(--flight);
  text-decoration: underline; text-decoration-thickness: .1em; text-underline-offset: .14em; text-decoration-color: color-mix(in srgb, var(--flight) 30%, transparent);
  border-radius: .18em; transition: background-color .2s, text-decoration-color .2s; -webkit-tap-highlight-color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
@media (min-width: 720px) { .w { white-space: nowrap; } }
.w:hover, .w[aria-expanded="true"] { text-decoration-color: var(--flight); background: color-mix(in srgb, var(--flight) 9%, transparent); }
.w:active { background: color-mix(in srgb, var(--flight) 16%, transparent); }
.w.flash { animation: flash .7s var(--ease-out); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--ride) 70%, transparent); } 100% { background: transparent; } }
.go { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 30px 0 34px; border: 0; border-radius: 999px; cursor: pointer; background: var(--ink); color: var(--card-solid);
  font: 650 20px/1 var(--f-ui); box-shadow: var(--sh2); transition: transform .2s var(--ease-out), box-shadow .2s; }
:root[data-theme="dark"] .go { background: #F4F5FB; color: #0F1124; }
.go:hover { transform: translateY(-1px); box-shadow: var(--sh3); }
.go:active { transform: scale(.96); }
.go svg { width: 22px; height: 22px; }
.hero-sub { margin: -14px 0 0; color: var(--ink-2); font-size: 17px; max-width: 34rem; }
body.is-results .hero { min-height: 0; padding: 14px 0 18px; justify-items: start; text-align: left; gap: 0; align-content: start; }
body.is-results .sent { font-size: clamp(1.35rem, 1.9vw, 1.85rem); max-width: 1180px; line-height: 1.28; text-wrap: pretty; }
body.is-results .kicker, body.is-results .go, body.is-results .hero-sub { display: none; }

/* ---------- popovers ---------- */
.pop { position: fixed; z-index: 60; width: min(380px, calc(100vw - 24px)); padding: 20px; border-radius: 24px; background: var(--card-solid); color: var(--ink); box-shadow: var(--sh3), 0 0 0 1px var(--line);
  text-align: left; font: 450 17px/1.4 var(--f-ui); letter-spacing: 0; }
.pop h4 { margin: 0 0 4px; font: 650 14px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pop .big { font: var(--d-wt) 34px/1.1 var(--f-display); letter-spacing: var(--d-track); margin: 6px 0 14px; }
.pop .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.pop .row + .row { border-top: 1px solid var(--line); }
.pop .row b { font-weight: 620; } .pop .row small { display: block; color: var(--ink-3); font-size: 15px; }
.step { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card-2); }
.step button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.step button:active { transform: scale(.9); }
.step button:disabled { opacity: .4; cursor: default; }
.step output { min-width: 32px; text-align: center; font: 700 20px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; background: var(--card-2); color: var(--ink); font: 560 16px/1 var(--f-ui); box-shadow: inset 0 0 0 1px var(--line); transition: background-color .2s, color .2s, transform .15s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card-solid); box-shadow: none; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: #F4F5FB; color: #0F1124; }
.chip svg { width: 16px; height: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal span { font: 600 13px/2 var(--f-ui); color: var(--ink-3); letter-spacing: .05em; }
.cal button { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--card-2); cursor: pointer; font: 600 16px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.cal button:disabled { background: none; color: var(--ink-3); opacity: .5; cursor: default; }
.cal button[aria-pressed="true"] { background: var(--flight); color: #fff; }
.cal button.wk:not([aria-pressed="true"]):not(:disabled) { background: color-mix(in srgb, var(--flight-t) 70%, var(--card-2)); }
.range { width: 100%; margin: 8px 0 4px; accent-color: var(--flight); height: 36px; }
.ticks { display: flex; justify-content: space-between; color: var(--ink-3); font: 500 14px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line-2); cursor: pointer; transition: background-color .25s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: var(--sh1); transition: left .35s var(--spring), width .2s; }
.switch:active::after { width: 32px; }
.switch[aria-checked="true"] { background: var(--see); }
.switch[aria-checked="true"]::after { left: 23px; }
.switch[aria-checked="true"]:active::after { left: 17px; }
.pop .done { margin-top: 16px; width: 100%; height: 50px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 650 17px/1 var(--f-ui); cursor: pointer; }
:root[data-theme="dark"] .pop .done { background: #F4F5FB; color: #0F1124; }
.scrim { position: fixed; inset: 0; z-index: 55; background: rgb(10 10 30 / .28); opacity: 0; pointer-events: none; transition: opacity .22s; }
.scrim.on { opacity: 1; pointer-events: auto; }
@media (min-width: 720px) { .scrim.pop-scrim { background: transparent; } }

/* ---------- results layout ---------- */
.results { display: none; max-width: 1440px; margin: 0 auto; padding: 0 28px 140px; grid-template-columns: minmax(0, 1fr) 344px; gap: 22px; align-items: start; }
body.is-results .results { display: grid; }
.main-col { min-width: 0; display: grid; gap: 18px; }

/* the matrix card */
.mx { position: relative; border-radius: var(--r-xl); background: var(--card); box-shadow: var(--sh3), inset 0 0 0 1px color-mix(in srgb, var(--card-solid) 60%, transparent); padding: 18px 0 6px; overflow: hidden; }
.mx-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 0 22px 10px; }
.mx-status { display: inline-flex; align-items: center; gap: 10px; font-weight: 560; color: var(--ink-2); min-height: 32px; }
.mx-status b { color: var(--ink); font-weight: 680; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--flight) 22%, transparent); border-top-color: var(--flight); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { rotate: 360deg; } }
.legend { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card-2); font: 560 15px/1 var(--f-ui); color: var(--ink-2); }
.lg i { width: 14px; height: 14px; border-radius: 5px; }
.lg .i-pick { background: var(--flight); } .lg .i-cheap { background: var(--see); } .lg .i-over { background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }
.lg .i-band { background: color-mix(in srgb, var(--stay) 20%, transparent); box-shadow: inset 0 0 0 2px var(--stay); }

/* the focal pick bar */
.pickbar { position: relative; margin: 0 22px 8px; display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 10px; border-radius: 22px; background: var(--flight); color: #fff; border: 0; width: calc(100% - 44px); text-align: left; cursor: pointer; transition: transform .2s var(--ease-out), opacity .4s; box-shadow: var(--sh2); }
.pickbar:active { transform: scale(.985); }
.pickbar .art { width: 64px; height: 48px; border-radius: 12px; overflow: hidden; flex: none; }
.pickbar .t { flex: 1; min-width: 0; }
.pickbar .t b { display: block; font: var(--d-wt) 21px/1.15 var(--f-display); letter-spacing: var(--d-track); }
.pickbar .t span { color: rgb(255 255 255 / .86); font-size: 16px; }
.pickbar .t .short { display: none; }
.pickbar .t b .long, .pickbar .t b .short { color: #fff; font-size: inherit; }
.pickbar .badge { flex: none; background: var(--ride); color: #2B2100; font: 700 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; }
.pickbar .p { font: 760 30px/1 var(--f-num); font-feature-settings: var(--num-feat); letter-spacing: -0.02em; }
.pickbar .open { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: rgb(255 255 255 / .18); font-weight: 620; }
.pickbar.skel { background: var(--card-2); box-shadow: none; pointer-events: none; }
.pickbar.skel > * { visibility: hidden; }
:root[data-theme="dark"] .pickbar:not(.skel) { background: #4338CA; }

/* the grid */
.mx-scroll { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; padding: 0 16px 14px 0; scroll-behavior: auto; }
.mx-head, .mx-row { position: relative; display: grid; grid-template-columns: var(--lead) repeat(var(--n), var(--cw)); width: max-content; }
.mx-head { position: relative; z-index: 4; }
.mx-row { padding-top: 12px; }
.lead { position: sticky; left: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 22px; background: var(--lead-bg); box-shadow: 10px 0 14px -12px rgb(20 20 60 / .25); clip-path: inset(0 -24px 0 0); }
.mx-head .lead { align-items: end; padding-bottom: 8px; }
.mx-head .lead span { font: 650 13px/1.2 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.lead .art { width: 48px; height: 48px; border-radius: 16px; overflow: hidden; flex: none; box-shadow: var(--sh1); }
.lead .nm { min-width: 0; }
.lead .nm b { display: block; font: var(--d-wt) 18px/1.12 var(--f-display); letter-spacing: var(--d-track); }
.lead .nm small { display: block; margin-top: 3px; color: var(--ink-2); font: 500 15px/1.25 var(--f-ui); }
.lead .nm small .num { color: var(--ink); font-weight: 650; }
.day { display: grid; justify-items: center; align-content: end; padding: 4px 4px 8px; border-radius: 16px 16px 0 0; position: relative; }
.day .dw { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.day .dn { font: var(--d-wt) 22px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.day .mo { position: absolute; top: -16px; font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.day.wkend { background: color-mix(in srgb, var(--flight-t) 45%, transparent); }

.c { padding: 0 4px; position: relative; z-index: 1; }
.sq { position: relative; display: grid; grid-template-rows: auto 1fr; align-items: center; justify-items: center; width: 100%; height: var(--ch); padding: 9px 4px 5px; border: 0; border-radius: 18px; background: var(--cell); cursor: pointer; color: var(--ink);
  transition: background-color .2s, box-shadow .25s, transform .18s var(--ease-out); -webkit-tap-highlight-color: transparent; }

.sq .wx.rain svg { color: var(--wx); } .sq .wx.sun svg { color: #D97706; } :root[data-theme="dark"] .sq .wx.sun svg { color: #FBBF24; }
.sq .pr { font: 720 20px/1 var(--f-num); font-feature-settings: var(--num-feat); letter-spacing: -0.015em; }
.sq .tag { position: absolute; top: -12px; left: 50%; translate: -50% 0; white-space: nowrap; padding: 5px 9px; border-radius: 999px; font: 700 12px/1 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; box-shadow: var(--sh1); z-index: 2; }

.sq.pick .tag { background: var(--ride); color: #2B2100; }

:root[data-theme="dark"] .sq.cheap .tag { color: #062320; }
.sq.good { box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--flight) 60%, transparent); }

.sq.over { background: repeating-linear-gradient(135deg, transparent 0 7px, var(--hatch) 7px 14px), color-mix(in srgb, var(--card-2) 60%, transparent); color: var(--ink-3); }

.sq.skel { background: var(--card-2); pointer-events: none; overflow: hidden; }

.lead.skel .art, .lead.skel b, .lead.skel small { background: var(--card-2); color: transparent; border-radius: 8px; box-shadow: none; }
.lead.skel .art > * { display: none; }

/* the nights band */
.band { position: absolute; z-index: 0; top: 8px; bottom: -6px; left: calc(var(--lead) + var(--c) * var(--cw)); width: calc(var(--k) * var(--cw)); border-radius: 22px; pointer-events: none;
  background: color-mix(in srgb, var(--stay) 11%, transparent); box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--stay) 70%, transparent);
  transition: left .45s var(--spring-soft), width .45s var(--spring-soft), opacity .2s; }
.band b { position: absolute; right: 8px; top: -11px; padding: 5px 10px; border-radius: 999px; background: var(--stay); color: #fff; font: 650 13px/1 var(--f-ui); white-space: nowrap; }
:root[data-theme="dark"] .band b { background: #9333EA; }
.band.hide { opacity: 0; }
.mx-more { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; color: var(--ink-2); font-weight: 560; }
.edge-note { position: absolute; right: 18px; top: 50%; z-index: 6; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh2); font: 600 15px/1 var(--f-ui); color: var(--ink-2); opacity: 0; transition: opacity .25s; pointer-events: none; }
.edge-note.on { opacity: 1; }

/* ---------- widgets (the rail) ---------- */
.rail { position: sticky; top: 16px; display: grid; gap: 14px; max-height: calc(100svh - 32px); overflow-y: auto; scrollbar-width: none; padding-bottom: 20px; }
.rail::-webkit-scrollbar { display: none; }
.rail-head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 2px; }
.rail-head .art { width: 44px; height: 44px; border-radius: 14px; overflow: hidden; box-shadow: var(--sh1); flex: none; }
.rail-head b { display: block; font: var(--d-wt) 22px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.rail-head small { color: var(--ink-2); font-size: 15px; }
.wg { position: relative; padding: 16px 18px 18px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 0 0 1px var(--glass-line), 0 10px 30px -14px rgb(40 30 110 / .25); }
.wg header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.ic svg { width: 17px; height: 17px; }
.smp { font: 600 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ride-i); background: var(--ride-t); padding: 5px 8px; border-radius: 999px; }
.wg .bigline { display: flex; align-items: baseline; gap: 10px; }
.wg .bigline .n { font: var(--d-wt) 46px/1 var(--f-display); letter-spacing: var(--d-track); }
.wg .bigline .n.num { font-family: var(--f-num); font-weight: 760; letter-spacing: -0.03em; }
.wg p { margin: 4px 0 0; color: var(--ink-2); font-size: 16px; line-height: 1.4; }
.wg .fine { font-size: 15px; color: var(--ink-3); margin-top: 8px; }
.days5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
.days5 div { padding: 8px 0; border-radius: 14px; background: color-mix(in srgb, var(--card-solid) 55%, transparent); display: grid; gap: 4px; justify-items: center; font: 560 15px/1 var(--f-num); font-feature-settings: var(--num-feat); }

.days5 svg { width: 22px; height: 22px; }
.map { width: 100%; height: 150px; border-radius: 16px; display: block; overflow: hidden; }
:root[data-theme="dark"] .map { filter: brightness(.78) saturate(.9); }
.dist { display: grid; gap: 2px; margin-top: 10px; }
.dist div { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 16px; }
.dist div + div { border-top: 1px solid var(--line); }
.dist i { width: 12px; height: 12px; border-radius: 50%; background: var(--k); flex: none; }
.dist span { flex: 1; color: var(--ink-2); }
.dist b { font: 650 16px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { padding: 12px; border-radius: 16px; background: color-mix(in srgb, var(--card-solid) 60%, transparent); }
.tile small { display: block; color: var(--ink-3); font: 600 13px/1 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; }
.tile b { display: block; margin-top: 6px; font: 740 24px/1 var(--f-num); font-feature-settings: var(--num-feat); letter-spacing: -0.02em; }
.tile span { display: block; margin-top: 4px; color: var(--ink-2); font-size: 15px; }
.bars { display: flex; align-items: end; gap: 6px; height: 84px; margin-top: 8px; }
.bars div { flex: 1; display: grid; gap: 5px; justify-items: center; align-content: end; height: 100%; }
.bars i { width: 100%; border-radius: 8px; background: var(--k); }
.bars span { font: 600 13px/1 var(--f-num); color: var(--ink-3); }
.mini-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 620 16px/1 var(--f-ui); cursor: pointer; transition: transform .15s; }
:root[data-theme="dark"] .mini-btn { background: #F4F5FB; color: #0F1124; }
.mini-btn:active { transform: scale(.95); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-size: 16px; }
.list li + li { border-top: 1px solid var(--line); }
.list li .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--card-solid) 70%, transparent); font: 700 14px/1 var(--f-num); flex: none; }

.list li .t small { display: block; color: var(--ink-3); font-size: 15px; }
.tagk { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--food-t); color: var(--food-i); font: 620 13px/1 var(--f-ui); margin-right: 4px; }
.link-btn { border: 0; background: none; padding: 8px 0 0; color: var(--flight-i); font: 620 16px/1 var(--f-ui); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.rail.swap .wg, .rail.swap .rail-head { animation: wgin .45s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes wgin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- the drawer ---------- */
.drawer { position: relative; border-radius: var(--r-xl); background: var(--card-solid); box-shadow: var(--sh3); overflow: hidden; }

.dr-head { display: flex; align-items: center; gap: 18px; padding: 20px 22px 18px; border-bottom: 1px solid var(--line); }
.dr-head .art { width: 104px; height: 72px; border-radius: 16px; overflow: hidden; flex: none; }
.dr-head .ti { flex: 1; min-width: 0; }
.dr-head h2 { margin: 0; font: var(--d-wt) 30px/1.08 var(--f-display); letter-spacing: var(--d-track); }
.dr-head .ti p { margin: 6px 0 0; color: var(--ink-2); font-size: 17px; }
.why { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px; border-radius: 999px; background: var(--flight-t); color: var(--flight-i); font: 600 15px/1.1 var(--f-ui); }

.tot small { display: block; margin-top: 6px; color: var(--ink-2); font-size: 15px; }
.dr-panels { display: flex; gap: 14px; padding: 16px; align-items: stretch; }
.pn { position: relative; min-width: 0; border-radius: 26px; padding: 16px; transition: flex-grow .6s var(--spring-soft), flex-basis .6s var(--spring-soft), background-color .3s; cursor: default; }
.pn-stay { flex: 1.35 1 0; background: color-mix(in srgb, var(--stay-t) 55%, var(--card-solid)); }

.dr-panels[data-focus="stay"] .pn-stay { flex: 1 1 0; }
.dr-panels[data-focus="stay"] .pn-fly { flex: 0 0 236px; }

.dr-panels[data-focus="fly"] .pn-stay { flex: 0 0 236px; }
.pn .full, .pn .mini { min-width: 0; }
.pn .mini { display: none; }
.pn.is-mini { cursor: pointer; }
.pn.is-mini .full { display: none; }
.pn.is-mini .mini { display: grid; gap: 10px; }
.pn.is-mini:hover { filter: brightness(.985); }
.pn-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pn-h h3 { margin: 0; font: 650 15px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); flex: 1; }
.pn-h .fbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--card-solid) 80%, transparent); cursor: pointer; font: 600 15px/1 var(--f-ui); color: var(--ink-2); }
.pn-h .fbtn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: color-mix(in srgb, var(--card-solid) 75%, transparent); margin-bottom: 12px; flex-wrap: wrap; }
.seg button { height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: none; cursor: pointer; font: 600 15px/1 var(--f-ui); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--stay); color: #fff; }
.stay-grid > div { min-width: 0; }
.stay-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
.dr-panels:not([data-focus="stay"]) .stay-grid { grid-template-columns: 1fr; }
.gal { position: relative; border-radius: 20px; overflow: hidden; background: var(--card-2); }
.gal-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 16 / 10; }
.dr-panels[data-focus=""] .gal-track { aspect-ratio: 16 / 8; }
.gal-track::-webkit-scrollbar { display: none; }
.gal-track > div { flex: 0 0 100%; scroll-snap-align: center; }
.gal-track svg { width: 100%; height: 100%; display: block; }
.gal-nav { position: absolute; top: 50%; translate: 0 -50%; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .9); color: #0F1124; box-shadow: var(--sh1); cursor: pointer; display: grid; place-items: center; }
.gal-nav svg { width: 18px; height: 18px; } .gal-nav.l { left: 10px; } .gal-nav.r { right: 10px; }
.gal-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.gal-dots i { width: 7px; height: 7px; border-radius: 99px; background: rgb(255 255 255 / .6); transition: width .3s var(--spring), background-color .3s; }
.gal-dots i.on { width: 20px; background: #fff; }
.gal-cap { position: absolute; left: 10px; top: 10px; padding: 5px 9px; border-radius: 999px; background: rgb(15 17 36 / .62); color: #fff; font: 600 13px/1 var(--f-ui); }
.h-name { margin: 0; font: var(--d-wt) 26px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.h-meta { margin: 6px 0 10px; color: var(--ink-2); font-size: 16px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.h-meta .star { color: var(--ink); font-weight: 650; display: inline-flex; align-items: center; gap: 3px; }
.h-meta .star svg { width: 15px; height: 15px; color: #D97706; }
.feats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.feat { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--card-solid) 80%, transparent); font: 560 15px/1 var(--f-ui); }
.feat svg { width: 15px; height: 15px; color: var(--stay); }
.feat.food svg { color: var(--food); }
.sub-h { margin: 14px 0 8px; font: 650 14px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.rooms { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 16px; background: color-mix(in srgb, var(--card-solid) 82%, transparent); cursor: pointer; text-align: left; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s, transform .15s; }
.opt:active { transform: scale(.985); }
.opt .rad { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); flex: none; transition: box-shadow .25s var(--spring); }
.opt[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--k, var(--stay)); }
.opt[aria-checked="true"] .rad { box-shadow: inset 0 0 0 7px var(--k, var(--stay)); }
.opt .t { flex: 1; min-width: 0; }
.opt .t b { display: block; font-weight: 640; }
.opt .t small { display: block; color: var(--ink-2); font-size: 15px; }
.opt .d { font: 650 16px/1 var(--f-num); font-feature-settings: var(--num-feat); white-space: nowrap; }
.opt .d.minus { color: var(--see); } :root[data-theme="dark"] .opt .d.minus { color: var(--see); }
.alts { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 3px 3px 6px; margin: 0 -3px; scroll-snap-type: x proximity; }
.alts::-webkit-scrollbar { display: none; }
.alt { flex: 0 0 196px; scroll-snap-align: start; display: grid; gap: 8px; padding: 8px; border: 0; border-radius: 18px; background: color-mix(in srgb, var(--card-solid) 82%, transparent); cursor: pointer; text-align: left; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s, transform .15s; }
.alt:active { transform: scale(.97); }
.alt[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--stay); }
.alt .art { height: 84px; border-radius: 12px; overflow: hidden; }
.alt b { font-weight: 640; line-height: 1.2; padding: 0 4px; }
.alt small { display: flex; justify-content: space-between; padding: 0 4px 4px; color: var(--ink-2); font-size: 15px; }
.alt small .num { color: var(--ink); font-weight: 650; }
.leg { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 14px; padding: 14px 16px; border-radius: 18px; background: color-mix(in srgb, var(--card-solid) 82%, transparent); }
.leg + .leg { margin-top: 8px; }
.leg .lbl { grid-column: 1 / -1; font: 650 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.leg .tm { font: 720 26px/1 var(--f-num); font-feature-settings: var(--num-feat); letter-spacing: -0.02em; }
.leg .tm small { display: block; margin-top: 4px; font: 600 15px/1 var(--f-ui); letter-spacing: 0; color: var(--ink-2); }
.leg .tm.r { text-align: right; }
.leg .ln { position: relative; height: 2px; background: var(--line-2); margin: 0 4px; }
.leg .ln svg { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 20px; height: 20px; color: var(--flight); background: color-mix(in srgb, var(--card-solid) 100%, transparent); padding: 1px; border-radius: 50%; }
.leg .ln span { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 14px; color: var(--ink-3); }

.mini .k { font: 650 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.mini .art { height: 110px; border-radius: 16px; overflow: hidden; }
.mini b { font: var(--d-wt) 21px/1.12 var(--f-display); letter-spacing: var(--d-track); }
.mini .route { font: 760 28px/1 var(--f-num); letter-spacing: -0.02em; }
.mini .pp { font: 700 20px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.mini p { margin: 0; color: var(--ink-2); font-size: 15px; }
.mini .exp { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--card-solid); font: 600 15px/1 var(--f-ui); box-shadow: var(--sh1); }
.dr-foot { position: sticky; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 14px 18px 14px 22px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--card-solid) 94%, transparent); }
.dr-foot .note { flex: 1; color: var(--ink-2); font-size: 16px; }
.dr-foot .note b { color: var(--ink); }
.book { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 12px; height: 64px; min-width: 300px; padding: 0 30px; border: 0; border-radius: 999px; cursor: pointer; background: var(--sunset); color: #fff;
  font: 700 21px/1 var(--f-ui); box-shadow: 0 12px 30px -10px rgb(139 47 201 / .6); transition: transform .2s var(--ease-out), box-shadow .2s, min-width .4s var(--spring-soft), width .4s; }
.book:hover { transform: translateY(-1px); box-shadow: 0 18px 38px -12px rgb(139 47 201 / .7); }
.book:active { transform: scale(.96); }
.book .num { font-weight: 760; }
.book .spin { border-color: rgb(255 255 255 / .35); border-top-color: #fff; width: 26px; height: 26px; border-width: 3px; }
.book.busy { min-width: 64px; padding: 0; width: 64px; pointer-events: none; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card-2); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.x svg { width: 18px; height: 18px; }
.x:active { transform: scale(.92); }

  }
  setTimeout(() => box.remove(), 4200);
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
$('#scrim').addEventListener('click', () => { if (!$('#sheet').hidden && ['done', 0, 1, 2, 3].includes(B.step)) closeSheet(); });

/* ================= theme and type ================= */
const TYPENAMES = { a: 'Bricolage + Inter · our pick', b: 'Geist + Inter', c: 'Newsreader + Inter' };
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? I.sunline : I.moon; $('#themeBtn').setAttribute('aria-label', t === 'dark' ? 'Switch to light' : 'Switch to dark');
  try { localStorage.setItem('bv2-theme', t); } catch {}
}
$('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('#typesw').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.documentElement.dataset.type = b.dataset.t; $$('#typesw button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#typeName').textContent = TYPENAMES[b.dataset.t];
  try { localStorage.setItem('bv2-type', b.dataset.t); } catch {}
});
(function init() {
  let t = 'light', ty = 'a';
  try { t = localStorage.getItem('bv2-theme') || 'light'; ty = localStorage.getItem('bv2-type') || 'a'; } catch {}
  const q = new URLSearchParams(location.search); if (q.get('theme')) t = q.get('theme'); if (q.get('type')) ty = q.get('type');
  setTheme(t); document.documentElement.dataset.type = ty; $('#typeName').textContent = TYPENAMES[ty]; $$('#typesw button').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === ty));
  /* the shore along the landing's foot: sea, a pier, palms, the far hills (the cover's scene, redrawn) */

    <rect x="120" y="128" width="380" height="6" fill="#2B3A4A"/>${Array.from({ length: 16 }, (_, i) => `<rect x="${130 + i * 24}" y="134" width="4" height="40" fill="#2B3A4A"/>`).join('')}<rect x="456" y="104" width="40" height="24" rx="2" fill="#E4572E"/><path d="M450 104h52l-26-14z" fill="#2B3A4A"/>
    <path d="M0 214 Q300 190 640 206 T1440 200 V260 H0Z" fill="#F4D9A0"/>
    ${[[1180, 214, 2.1], [1240, 220, 1.6], [1320, 212, 2.4], [70, 222, 1.8]].map(([x, y, s]) => A.palm(x, y, s, '#1F8A5B', '#7A4E26')).join('')}
    <g transform="translate(860 150)"><path d="M0 0 h60 l-8 10 h-44z" fill="#C2410C"/><path d="M28 0 V-46 L56 -4z" fill="#FFD43B"/><path d="M26 -2 V-38 L6 -4z" fill="#fff"/></g>`;
  drawSentence();
  if (q.get('state') === 'results') { glide(); runSearch(); }
})();
