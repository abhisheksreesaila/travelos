<style>
body{margin:0;background:#FFF8EE}
button{font-family:'Figtree',sans-serif;color:#1E1A2E}
button:focus-visible{outline:3px solid #1E1A2E;outline-offset:3px}
@keyframes ga-deal{0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(0deg) scale(.8)}100%{opacity:1;transform:translate(0,0) rotate(var(--r)) scale(1)}}
@keyframes ga-float{0%,100%{translate:0 0}50%{translate:0 -8px}}

.ga-card{animation:ga-deal .9s cubic-bezier(.2,.9,.3,1.2) both, ga-float 6s ease-in-out 1s infinite}
.ga-stamp{animation:ga-stamp .6s cubic-bezier(.2,.9,.3,1.3) 1.4s both}
.ga-go{transition:transform .15s cubic-bezier(.2,.9,.3,1.3),box-shadow .15s}
.ga-go:hover{transform:translateY(-2px);box-shadow:0 6px 0 #000}
.ga-go:active{transform:translateY(4px);box-shadow:0 0 0 #000}
@media (prefers-reduced-motion: reduce){.ga-card,.ga-stamp{animation:none}.ga-go{transition:none}}
</style>

Continue with Google

<p style="margin: 0; font-size: 14px; font-weight: 700; color: #5A5470">Use the Gmail your family invited. You'll stay signed in for 30 days.</p>
