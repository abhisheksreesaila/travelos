<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitAway · Journey map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Figtree:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFF8EE}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 56px 64px; background: #FFF8EE; color: #1E1A2E; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 48px; letter-spacing: -0.02em">How people move through GitAway</h1>
<span style="font-size: 18px; font-weight: 600; color: #4A4460">Two doors on the landing page. Everything ends in a plan someone else can fork.</span>
</div>
<div style="display: flex; gap: 10px; font-size: 14px; font-weight: 800">
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #1E1A2E; color: #FFFFFF; display: flex; align-items: center">Sign-in asked here</span>
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FF7352; display: flex; align-items: center">Hero screen</span>
</div>
</div>
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 20px; padding: 18px 20px; border-radius: 28px; background: {{l.tint}}">
<div style="width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{l.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A4460">{{l.who}}</span>
</div>
<div style="flex: 1; display: flex; align-items: center; gap: 8px">
<sc-for list="{{l.steps}}" as="s" hint-placeholder-count="5">
<div style="flex: 1; min-width: 0; height: 104px; box-sizing: border-box; padding: 12px 14px; border-radius: 20px; background: {{s.bg}}; box-shadow: 0 0 0 1px rgba(30,26,46,0.06), 0 8px 14px -10px rgba(30,26,46,0.4); display: flex; flex-direction: column; justify-content: space-between">
<span style="font-weight: 800; font-size: 16px; line-height: 1.25">{{s.label}}</span>
<span style="display: flex; gap: 6px">
<sc-if value="{{s.auth}}" hint-placeholder-val="{{no}}"><span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #1E1A2E; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center">SIGN-IN</span></sc-if>
<sc-if value="{{s.ticket}}" hint-placeholder-val="{{no}}"><span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.7); font-size: 11px; font-weight: 800; display: flex; align-items: center">{{s.ticket}}</span></sc-if>
</span>
</div>
<sc-if value="{{s.more}}" hint-placeholder-val="{{no}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1A2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    function lane(name, who, tint, steps) {
      return { name: name, who: who, tint: tint, steps: steps.map(function (s, i) {
        return { label: s[0], ticket: s[1] || false, auth: !!s[2], bg: s[3] || '#FFFFFF', more: i < steps.length - 1 };
      }) };
    }
    var HERO = '#FF7352';
    return {
      no: false,
      lanes: [
        lane('Plan a trip', 'Traveler, trip decided', '#FFF1C2', [
          ['Landing: "Plan a trip"', 'F-013'], ['Booking workspace', 'F-015/16'], ['One-tap pay sheet', 'F-018', true], ['"You’re going to LA!"', 'F-018'], ['Trip calendar', 'F-019']
        ]),
        lane('Together', 'Family & friends', '#D4F7EA', [
          ['Trip calendar', 'F-019'], ['Invite friends', 'F-020', true], ['Friends add plans & notes live', 'F-020'], ['Share', 'F-022'], ['Scrapbook itinerary page', 'F-014', false, HERO]
        ]),
        lane('Get inspired', 'Traveler, still dreaming', '#DDEEFF', [
          ['Landing: "Get inspired"', 'F-013'], ['Community hub', 'F-022'], ['Scrapbook itinerary page', 'F-014', false, HERO], ['Fork', 'F-014', true], ['Your forks list', 'F-021'], ['Apply to your calendar', 'F-021']
        ]),
        lane('Creators', 'YouTube & Instagram', '#FFE3F1', [
          ['Paste a video or post link', 'F-023'], ['Skeleton, then fade in', 'F-023'], ['AI-drafted scrapbook page', 'F-023'], ['Edit', 'F-023'], ['Submit', 'F-023', true], ['Live in the community hub', 'F-022']
        ])
      ]
    };
  }
}
</script>
</body>
</html>
