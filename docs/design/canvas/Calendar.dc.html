<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitAway · Trip calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;family=Caveat:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF8EE}
a{color:#1E1A2E}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E1A2E;outline-offset:3px}
@keyframes ca-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.ca-pop{animation:ca-pop .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:.6s}
@keyframes ca-pulse{0%,100%{box-shadow:0 0 0 0 rgba(72,209,160,.6)}50%{box-shadow:0 0 0 6px rgba(72,209,160,0)}}
.ca-live{animation:ca-pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ca-pop,.ca-live{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; padding: 0 24px 24px; background: #FFF8EE; color: #1E1A2E; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<header style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 8px">
<span style="width: 36px; height: 36px; border-radius: 11px; background: #FF7352; box-shadow: 0 3px 0 #C9431F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2.2"></circle><circle cx="18" cy="5" r="2.2"></circle><circle cx="12" cy="19" r="2.2"></circle><path d="M6 7.5v1.5c0 2 1.5 3 3 3h6c1.5 0 3-1 3-3V7.5M12 12v4.5"></path></svg></span>
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">LA with the kids</h1>
<span style="font-size: 14px; font-weight: 700; color: #4A4460">Fri Oct 16 – Tue Oct 20 · booked · $3,088</span>
</div>
<div style="margin-left: auto; display: flex; align-items: center">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #C3B2FF; border: 3px solid #FFF8EE; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">AR</span>
<span style="position: relative; margin-left: -10px; width: 40px; height: 40px; border-radius: 999px; background: #FF8CC6; border: 3px solid #FFF8EE; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">MO<span class="ca-live" style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 999px; background: #48D1A0; border: 2px solid #FFF8EE"></span></span>
<span style="margin-left: -10px; width: 40px; height: 40px; border-radius: 999px; background: #48D1A0; border: 3px solid #FFF8EE; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">SK</span>
</div>
<span style="font-size: 14px; font-weight: 700; color: #16865F">Mom is planning with you</span>
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(30,26,46,0.08), 0 4px 0 rgba(30,26,46,0.12); display: flex; align-items: center; gap: 8px; font-weight: 800; text-decoration: none">Your forks <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #FFC93C; font-size: 12px; display: flex; align-items: center">1</span></a>
<a href="#" style="height: 44px; padding: 0 18px; border-radius: 999px; background: #FF7352; box-shadow: 0 4px 0 #C9431F; display: flex; align-items: center; font-weight: 800; text-decoration: none">Invite</a>
<a href="#" style="height: 44px; padding: 0 18px; border-radius: 999px; background: #1E1A2E; color: #FFFFFF; box-shadow: 0 4px 0 #000000; display: flex; align-items: center; font-weight: 800; text-decoration: none">Share trip</a>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px">

<!-- Calendar -->
<section aria-label="Trip calendar" style="border-radius: 28px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06); padding: 16px 18px 18px; display: grid; grid-template-columns: 52px repeat(5, minmax(0, 1fr)); grid-template-rows: 58px 1fr; column-gap: 10px; overflow: hidden">
<span></span>
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<div style="padding: 6px 10px; border-radius: 16px; background: {{d.tint}}; display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">{{d.num}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 800">{{d.dow}}</span><span style="font-size: 12px; font-weight: 700; color: #4A4460">{{d.weather}}</span></span>
</div>
</sc-for>
<div style="position: relative; display: flex; flex-direction: column">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="15">
<span style="height: 48px; font-size: 12px; font-weight: 700; color: #5A5470; font-variant-numeric: tabular-nums; transform: translateY(-8px)">{{h}}</span>
</sc-for>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<div style="position: relative; height: 720px; background-image: repeating-linear-gradient(to bottom, rgba(30,26,46,0.07) 0, rgba(30,26,46,0.07) 1px, transparent 1px, transparent 48px)">
<sc-if value="{{d.empty}}" hint-placeholder-val="{{no}}">
<button style="position: absolute; left: 0; right: 0; top: 96px; height: 336px; border: 2px dashed rgba(30,26,46,0.2); border-radius: 18px; background: #FAF7F2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; font: 700 15px 'Figtree', sans-serif; color: #4A4460; cursor: pointer">
<span style="font-family: 'Caveat', cursive; font-size: 30px; color: #1E1A2E">wide open!</span>
<span>Add something fun, or drop in a day from your forks</span>
</button>
</sc-if>
<sc-for list="{{d.events}}" as="e" hint-placeholder-count="3">
<div class="{{e.cls}}" style="position: absolute; left: 0; right: 0; top: {{e.top}}; height: {{e.height}}; box-sizing: border-box; padding: 8px 10px; border-radius: 14px; background: {{e.bg}}; color: {{e.fg}}; box-shadow: {{e.ring}}; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<span style="font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums">{{e.time}}</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.2">{{e.title}}</span>
<sc-if value="{{e.by}}" hint-placeholder-val="{{no}}"><span style="margin-top: auto; align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.8); font-size: 11px; font-weight: 800; display: flex; align-items: center; color: #1E1A2E">{{e.by}}</span></sc-if>
</div>
</sc-for>
<sc-if value="{{d.ghost}}" hint-placeholder-val="{{no}}">
<button aria-label="Add something on Saturday from 11 AM" style="position: absolute; left: 0; right: 0; top: 192px; height: 144px; border: 2px dashed #FF7352; border-radius: 14px; background: #FFF4EF; font: 800 14px 'Figtree', sans-serif; color: #1E1A2E; cursor: pointer">+ Add something fun</button>
</sc-if>
</div>
</sc-for>
</section>

<!-- Notes -->
<aside aria-label="Trip notes" style="border-radius: 28px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 12px -6px rgba(0,0,0,0.06); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Trip notes</h2>
<span style="font-size: 13px; font-weight: 700; color: #4A4460">everyone sees these</span>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div class="{{n.cls}}" style="display: flex; gap: 10px">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px; background: {{n.color}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">{{n.who}}</span>
<div style="flex: 1; padding: 10px 12px; border-radius: 4px 16px 16px 16px; background: {{n.bg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; color: #4A4460">{{n.meta}}</span>
<span style="font-size: 15px; font-weight: 600; line-height: 1.4">{{n.text}}</span>
</div>
</div>
</sc-for>
</div>
<form style="display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: #FAF7F2">
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a note for everyone</span><input placeholder="Add a note for everyone" style="flex: 1; border: 0; background: transparent; padding: 0 12px; font: 600 15px 'Figtree', sans-serif; color: #1E1A2E"></label>
<button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #1E1A2E; color: #FFFFFF; font: 800 15px 'Figtree', sans-serif; cursor: pointer">Send</button>
</form>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    function ev(start, end, time, title, kind, by, live) {
      var styles = {
        booked: ['#1E1A2E', '#FFFFFF'], sun: ['#FFF1C2', '#1E1A2E'], mint: ['#D4F7EA', '#1E1A2E'],
        sky: ['#DDEEFF', '#1E1A2E'], grape: ['#ECE4FF', '#1E1A2E'], pink: ['#FFE3F1', '#1E1A2E']
      };
      var s = styles[kind];
      return { top: ((start - 7) * 48) + 'px', height: Math.max(40, (end - start) * 48 - 4) + 'px', time: time, title: title,
        bg: s[0], fg: s[1], by: by || false, cls: live ? 'ca-pop' : '', ring: live ? '0 0 0 3px #48D1A0' : 'none' };
    }
    var hours = [];
    for (var h = 7; h < 22; h++) { hours.push(h === 12 ? '12 PM' : (h < 12 ? h + ' AM' : (h - 12) + ' PM')); }
    return {
      no: false,
      hours: hours,
      days: [
        { num: '16', dow: 'FRI', weather: '75°F sunny', tint: '#FFF1C2', empty: false, ghost: false, events: [
          ev(8.08, 9.55, '8:05 AM', 'Skylark Air 214 · SFO → LAX', 'booked'),
          ev(11, 11.9, '11:00 AM', 'Check in · The Tidewater', 'booked'),
          ev(13, 16, '1:00 PM', 'Santa Monica Pier & rides', 'sun', 'Sam'),
          ev(18.5, 20, '6:30 PM', 'Tacos at Mariscos La Ola', 'mint', 'Mom')
        ]},
        { num: '17', dow: 'SAT', weather: '73°F sunny', tint: '#D4F7EA', empty: false, ghost: true, events: [
          ev(9, 10.5, '9:00 AM', 'Venice Canals stroll', 'mint', 'You'),
          ev(14.5, 16.5, '2:30 PM', 'Bike the Strand', 'sky', 'Sam')
        ]},
        { num: '18', dow: 'SUN', weather: '70°F clouds', tint: '#ECE4FF', empty: false, ghost: false, events: [
          ev(10, 12.5, '10:00 AM', 'Travel Town steam trains', 'grape', 'Mom · just now', true),
          ev(16, 18.5, '4:00 PM', 'Griffith Observatory', 'grape', 'You')
        ]},
        { num: '19', dow: 'MON', weather: '72°F sunny', tint: '#DDEEFF', empty: true, ghost: false, events: [] },
        { num: '20', dow: 'TUE', weather: '77°F sunny', tint: '#FFE3F1', empty: false, ghost: false, events: [
          ev(9, 10.5, '9:00 AM', 'Farmers Market brunch', 'pink', 'You'),
          ev(11.5, 12.3, '11:30 AM', 'Check out · The Tidewater', 'booked'),
          ev(14.17, 15.5, '2:10 PM', 'Skylark Air 219 · LAX → SFO', 'booked')
        ]}
      ],
      notes: [
        { who: 'AR', color: '#C3B2FF', bg: '#FAF7F2', meta: 'You · yesterday', text: 'Booked! Flights and The Tidewater are on the calendar. Add anything you want to do.', cls: '' },
        { who: 'SK', color: '#48D1A0', bg: '#FAF7F2', meta: 'Sam · on Pier & rides', text: 'Pier first thing Friday, before the lines. Wristbands are cheaper for the kids.', cls: '' },
        { who: 'MO', color: '#FF8CC6', bg: '#FAF7F2', meta: 'Mom · on Tacos', text: 'I read the patio is dog friendly, so we could bring Biscuit next time!', cls: '' },
        { who: 'MO', color: '#FF8CC6', bg: '#D4F7EA', meta: 'Mom · just now', text: 'Added Travel Town on Sunday. The little one will love the trains.', cls: 'ca-pop' }
      ]
    };
  }
}
</script>
</body>
</html>
