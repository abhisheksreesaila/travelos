  <h1>Direction B · Ticket</h1>
  <p><b>Warm paper and ink; the kinds as tonal containers; the trip printed like a ticket.</b> The accent is git vermilion (#C93A1D light, #FF7A59 dark), GitAway’s own heritage. Widgets are soft tonal containers with a solid kind tile, so a full day reads calmly while still colour-coded. Fraunces sets headings and the big numbers (times, prices, temperatures); Geist sets everything you read. No glass anywhere: the phone tab bar is a solid Material bar flush with the bottom edge.</p>
  <ul>
    <li><b>The signature is the ticket:</b> Up next, the booking total and the checklist are printed stubs with a dotted perforation and two punched notches.</li>
    <li><b>Motion (Liquid, phone):</b> marking a booking done tears the stub along its perforation (the lower half slides 12 px and fades, 280 ms) and the row settles into “Booked elsewhere”; a widget grows into its sheet from where it sits; the active tab’s tonal pill stretches toward the next tab and settles (spring-fast). Press is a 0.96 squash; live values update in place.</li>
    <li><b>Motion (laptop):</b> a calm 180 ms fade for everything that opens; no tearing, no zoom.</li>
    <li><b>Landing:</b> the italic word “getaway.” writes itself in once (stroke then fill, 0.9 s), sections rise 28 px as they enter. Reduced motion: everything static.</li>
  </ul>
</div></template>
