<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitAway planning v2</title>
<meta name="description" content="Prototype of GitAway's planning page: the trip's calendar with flights and the hotel already in, help beside it, planning together, and the save. Sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet">
<!--
  Planning v2: the next room of booking v2 (docs/design/booking-v2/index.html, approved 2026-11-14).
  Same tokens, sky, frosted widgets, springs and dark mode. Type is fixed: Newsreader (display) + Inter (UI and every number).
  States: arrival (the booking pass morphs into the trip header) · week calendar · day calendar · quick add · drag and resize ·
  suggestions dropped in (+ or drag) · "use this day" · planning together (drawer / sheet) · a family member adding live · save · share.
  URL: ?state=calendar skips the arrival · ?view=day|week · ?theme=dark · ?live=0 stops the simulated family member.
-->
<style>
:root {
  --f-display: "Newsreader", Georgia, serif;
  --f-ui: "Inter", system-ui, sans-serif;
  --f-num: "Inter", system-ui, sans-serif;
  --d-wt: 560; --d-track: -0.022em; --d-lh: 1.08;
  --num-feat: "tnum" 1, "cv11" 1, "ss01" 1;

  --sky-1: #C6E2F8; --sky-2: #E3E5FA; --sky-3: #FDE5CF;
  --ink: #0F1124; --ink-2: #41455E; --ink-3: #555A73;
  --card: rgb(255 255 255 / .86); --card-solid: #FFFFFF; --card-2: #F2F3FA; --lead-bg: #F8F8FD;
  --line: rgb(15 17 36 / .10); --line-2: rgb(15 17 36 / .18);
  --glass: rgb(255 255 255 / .62); --glass-line: rgb(255 255 255 / .75); --glass-strong: rgb(255 255 255 / .84);
  --flight: #4338CA; --flight-t: #E4E3FB; --flight-i: #2A2185;
  --stay: #8B2FC9; --stay-t: #F1E3FA; --stay-i: #5A1785;
  --food: #C92A5E; --food-t: #FBE1EA; --food-i: #7E1538;
  --see: #0F766E; --see-t: #D9F2EF; --see-i: #0B4D48;
  --tix: #C2410C; --tix-t: #FCE6DA; --tix-i: #7A2906;
  --wx: #0369A1; --wx-t: #DBEFFA; --wx-i: #034769;
  --ride: #FFD43B; --ride-t: #FFF4C2; --ride-i: #5C4300; --ride-k: #D9A800;
  --sun: #FFB547; --on: #FFFFFF; --live: #16A34A;
  --hatch: rgb(15 17 36 / .06);
  --sh1: 0 1px 2px rgb(20 20 60 / .06), 0 2px 8px rgb(20 20 60 / .06);
  --sh2: 0 2px 6px rgb(20 20 60 / .08), 0 14px 32px -10px rgb(40 30 110 / .22);
  --sh3: 0 4px 14px rgb(20 20 60 / .07), 0 34px 70px -24px rgb(40 30 110 / .32);
  --sunset: linear-gradient(120deg, #4338CA 0%, #8B2FC9 52%, #C92A5E 100%);
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --r-xl: 32px; --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
  --gut: 64px; --hh: 52px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --sky-1: #0B1430; --sky-2: #1D1D44; --sky-3: #33203F;
  --ink: #F4F5FB; --ink-2: #C3C6DA; --ink-3: #A9ADC4;
  --card: rgb(20 22 44 / .80); --card-solid: #171A33; --card-2: #22264A; --lead-bg: #1A1D39;
  --line: rgb(255 255 255 / .10); --line-2: rgb(255 255 255 / .18);
  --glass: rgb(26 28 56 / .60); --glass-line: rgb(255 255 255 / .10); --glass-strong: rgb(23 26 51 / .86);
  --flight: #7B73FF; --flight-t: #24215A; --flight-i: #D2CFFF;
  --stay: #C084FC; --stay-t: #321A4A; --stay-i: #EBD4FD;
  --food: #FF6B9A; --food-t: #401528; --food-i: #FFD0DF;
  --see: #2DD4BF; --see-t: #0E302D; --see-i: #BCF0E8;
  --tix: #FB923C; --tix-t: #3D1E0E; --tix-i: #FFD6BC;
  --wx: #38BDF8; --wx-t: #0C2A3E; --wx-i: #C6EAFC;
  --ride-t: #3A300C; --ride-i: #FFE89A; --ride-k: #FFD43B;
  --live: #4ADE80;
  --hatch: rgb(255 255 255 / .06);
  --sh1: 0 1px 2px rgb(0 0 0 / .3); --sh2: 0 12px 30px -10px rgb(0 0 0 / .6); --sh3: 0 30px 70px -24px rgb(0 0 0 / .75);
  --sunset: linear-gradient(120deg, #4F46E5 0%, #9333EA 52%, #DB2777 100%);
  color-scheme: dark;
}
@media (max-width: 719px) { :root { --gut: 46px; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; color: var(--ink); background: var(--sky-3); font: 450 17px/1.5 var(--f-ui); font-optical-sizing: auto; overflow-x: hidden; overflow-x: clip; }
@media (max-width: 719px) { body { font-size: 16px; } }
button { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-feature-settings: var(--num-feat); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); font-weight: var(--d-wt); letter-spacing: var(--d-track); line-height: var(--d-lh); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- the sky (booking v2's, kept; calmer once you are planning) ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background: radial-gradient(60% 42% at 8% 0%, color-mix(in srgb, var(--wx-t) 90%, transparent), transparent 70%),
              radial-gradient(48% 36% at 96% 8%, color-mix(in srgb, var(--ride-t) 90%, transparent), transparent 70%),
              radial-gradient(70% 50% at 50% 104%, color-mix(in srgb, var(--flight-t) 95%, transparent), transparent 70%),
              linear-gradient(180deg, var(--sky-1), var(--sky-2) 52%, var(--sky-3)); }
.bg .sunball { position: absolute; right: 7%; top: 13%; width: 10rem; height: 10rem; border-radius: 50%; background: var(--sun); opacity: .5;
  box-shadow: 0 0 0 2.4rem color-mix(in srgb, var(--sun) 20%, transparent), 0 0 0 5.2rem color-mix(in srgb, var(--sun) 9%, transparent); }
:root[data-theme="dark"] .bg .sunball { background: #F3EBD3; opacity: .35; box-shadow: 0 0 0 2.4rem rgb(243 235 211 / .08), 0 0 0 5.2rem rgb(243 235 211 / .04); width: 9rem; height: 9rem; }
.bg .cloud { position: absolute; fill: color-mix(in srgb, #fff 85%, transparent); animation: drift 60s linear infinite alternate; }
:root[data-theme="dark"] .bg .cloud { fill: rgb(255 255 255 / .06); }
@keyframes drift { to { translate: 6vw 0; } }
.bg .shore { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; min-height: 180px; transform: translateY(70%); opacity: .55; }
:root[data-theme="dark"] .bg .shore { filter: brightness(.42) saturate(.8); }

/* ---------- top bar ---------- */
.top { position: relative; z-index: 30; display: flex; align-items: center; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 16px 28px 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 600 24px/1 var(--f-display); letter-spacing: -0.02em; }
.brand svg { width: 34px; height: 34px; }
.crumb { display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; padding: 8px 14px; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh1); font: 600 15px/1 var(--f-ui); color: var(--ink-2); }
.crumb b { color: var(--ink); font-weight: 650; }
.crumb i { width: 8px; height: 8px; border-radius: 50%; background: var(--see); }
.top .sp { flex: 1; }
.pill-sample { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--ride-t); color: var(--ride-i); font: 650 13px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; }
.round { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; color: var(--ink); transition: transform .18s var(--ease-out); flex: none; }
.round:active { transform: scale(.94); }
.round svg { width: 20px; height: 20px; }
.together { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px 0 8px; border: 0; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; font: 620 16px/1 var(--f-ui); color: var(--ink); transition: transform .18s var(--ease-out), box-shadow .2s; position: relative; }
.together:hover { box-shadow: var(--sh2); transform: translateY(-1px); }
.together:active { transform: scale(.96); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--food); color: #fff; font: 700 13px/22px var(--f-num); text-align: center; box-shadow: 0 0 0 3px var(--card-solid); }
.badge[hidden] { display: none; }
.badge.bump { animation: pop .5s var(--spring); }
@keyframes pop { from { transform: scale(.4); } to { transform: none; } }
.save { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; min-width: 150px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer; background: var(--sunset); color: #fff;
  font: 680 17px/1 var(--f-ui); box-shadow: 0 12px 30px -12px rgb(139 47 201 / .6); transition: transform .2s var(--ease-out), box-shadow .2s, min-width .4s var(--spring-soft), width .4s var(--spring-soft), padding .3s; }
.save:hover { transform: translateY(-1px); box-shadow: 0 18px 38px -12px rgb(139 47 201 / .7); }
.save:active { transform: scale(.96); }
.save svg { width: 19px; height: 19px; }
.save.busy { min-width: 48px; width: 48px; padding: 0; pointer-events: none; }
.save .spin { border-color: rgb(255 255 255 / .35); border-top-color: #fff; width: 22px; height: 22px; border-width: 3px; }

/* avatars */
.av { --c: var(--flight); position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; font: 700 15px/1 var(--f-ui); flex: none; box-shadow: 0 0 0 2.5px var(--card-solid); }
.av.sm { width: 24px; height: 24px; font-size: 12px; box-shadow: 0 0 0 2px var(--card-solid); }
.av.big { width: 44px; height: 44px; font-size: 18px; }
.av.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2.5px var(--card-solid); }
.av.big.on::after { width: 13px; height: 13px; }
.stack { display: inline-flex; }
.stack .av + .av { margin-left: -9px; }
.stack .av.add { background: var(--card-2); color: var(--ink-2); }

/* ---------- the page ---------- */
.app { max-width: 1440px; margin: 0 auto; padding: 0 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 16px 22px; align-items: start; }

/* the trip header: the booking pass, now the room's ceiling */
.trip { grid-column: 1 / -1; position: relative; display: flex; align-items: center; gap: 22px; min-height: 124px; padding: 16px 24px 16px 16px; border-radius: var(--r-xl); background: var(--sunset); color: #fff; box-shadow: var(--sh2); overflow: hidden; isolation: isolate; }
.trip .deco { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.trip .deco svg { position: absolute; right: 0; bottom: 0; height: 100%; width: 60%; }
.trip .art { width: 132px; height: 92px; border-radius: 20px; overflow: hidden; flex: none; box-shadow: 0 8px 20px -8px rgb(0 0 0 / .35); }
.trip .art svg { width: 100%; height: 100%; display: block; }
.trip .ti { flex: 1; min-width: 0; }
.trip .k { font: 650 13px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .86); display: inline-flex; align-items: center; gap: 8px; }
.trip .k .chk { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ride); color: #2B2100; }
.trip .k .chk svg { width: 11px; height: 11px; }
.trip h1 { margin: 6px 0 4px; font: var(--d-wt) 46px/1 var(--f-display); letter-spacing: var(--d-track); }
.trip h1 em { font-style: italic; font-weight: 500; color: rgb(255 255 255 / .9); }
.trip .meta { color: rgb(255 255 255 / .9); font-size: 17px; }
.trip .who { display: grid; gap: 6px; justify-items: end; }
.trip .who .stack .av { box-shadow: 0 0 0 3px rgb(80 40 160); width: 40px; height: 40px; font-size: 16px; }
.trip .who small { color: rgb(255 255 255 / .88); font-size: 15px; }
.count { display: grid; justify-items: center; min-width: 120px; padding: 10px 16px; border-radius: 22px; background: rgb(255 255 255 / .16); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); }
.count b { font: 560 46px/1 var(--f-display); letter-spacing: -0.03em; }
.count span { font: 600 14px/1.2 var(--f-ui); color: rgb(255 255 255 / .9); letter-spacing: .02em; }

/* ---------- the calendar card ---------- */
.cal { position: relative; border-radius: var(--r-xl); background: color-mix(in srgb, var(--card-solid) 93%, transparent); box-shadow: var(--sh3), inset 0 0 0 1px color-mix(in srgb, var(--card-solid) 60%, transparent); overflow: hidden; display: flex; flex-direction: column; height: calc(100svh - 236px); min-height: 560px; }
.cal-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px 10px 18px; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--card-2); }
.seg button { height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: none; cursor: pointer; font: 620 15px/1 var(--f-ui); color: var(--ink-2); transition: background-color .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card-solid); box-shadow: var(--sh1); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #F4F5FB; color: #0F1124; }
.cal-title { font: var(--d-wt) 24px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.cal-title small { font: 500 15px/1 var(--f-ui); letter-spacing: 0; color: var(--ink-2); margin-left: 6px; }
.legend { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 999px; background: var(--card-2); font: 560 15px/1 var(--f-ui); color: var(--ink-2); }
.lg i { width: 12px; height: 12px; border-radius: 4px; background: var(--k); }
.addbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px 0 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); cursor: pointer; font: 650 16px/1 var(--f-ui); box-shadow: var(--sh1); transition: transform .15s var(--ease-out); }
:root[data-theme="dark"] .addbtn { background: #F4F5FB; color: #0F1124; }
.addbtn:active { transform: scale(.95); }
.addbtn svg { width: 18px; height: 18px; }
.nav2 { display: none; gap: 6px; }
.cal[data-view="day"] .nav2 { display: inline-flex; }
.cal[data-view="day"] .legend { display: none; }
.cal[data-view="day"] .addbtn { margin-left: auto; }
.nav2 .round { width: 40px; height: 40px; box-shadow: none; background: var(--card-2); }

/* day chips (day view) */
.chipsrow { display: none; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
.chipsrow::-webkit-scrollbar { display: none; }
.cal[data-view="day"] .chipsrow { display: flex; }
.dchip { flex: 1 0 auto; min-width: 96px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; padding: 9px 14px 9px 12px; border: 0; border-radius: 18px; background: var(--card-2); cursor: pointer; text-align: left; scroll-snap-align: start; transition: background-color .25s, color .25s, transform .15s; }
.dchip:active { transform: scale(.96); }
.dchip .w { grid-row: span 2; width: 26px; height: 26px; }
.dchip .w svg { width: 26px; height: 26px; }
.dchip b { font: 650 15px/1.1 var(--f-ui); }
.dchip small { font: 500 14px/1.1 var(--f-num); color: var(--ink-2); font-feature-settings: var(--num-feat); }
.dchip[aria-pressed="true"] { background: var(--ink); color: var(--card-solid); }
.dchip[aria-pressed="true"] small { color: color-mix(in srgb, var(--card-solid) 80%, transparent); }
:root[data-theme="dark"] .dchip[aria-pressed="true"] { background: #F4F5FB; color: #0F1124; }
:root[data-theme="dark"] .dchip[aria-pressed="true"] small { color: #41455E; }

/* the grid */
.grid { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.g-head, .g-all, .g-inner { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); }
.g-head { position: relative; z-index: 3; background: color-mix(in srgb, var(--card-solid) 55%, transparent); }
.dh { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0 10px; padding: 10px 10px 10px 12px; border-left: 1px solid var(--line); cursor: pointer; background: none; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; transition: background-color .2s; }
.dh:hover { background: color-mix(in srgb, var(--card-solid) 60%, transparent); }
.dh .dw { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.dh .dn { grid-row: span 2; font: var(--d-wt) 34px/1 var(--f-display); letter-spacing: var(--d-track); }
.dh .wxl { display: inline-flex; align-items: center; gap: 5px; font: 600 15px/1.2 var(--f-num); font-feature-settings: var(--num-feat); color: var(--ink-2); }
.dh .wxl svg { width: 20px; height: 20px; flex: none; }
.dh .wxl.rain svg { color: var(--wx); } .dh .wxl.sun svg { color: #D97706; } :root[data-theme="dark"] .dh .wxl.sun svg { color: #FBBF24; }
.dh .wxl.partly svg { color: var(--ink-2); }
.dh .note { grid-column: 1 / -1; margin-top: 6px; font: 560 14px/1.25 var(--f-ui); color: var(--wx-i); background: var(--wx-t); padding: 5px 8px; border-radius: 10px; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }
.dh .note svg { width: 15px; height: 15px; }
.dh.wet { background: color-mix(in srgb, var(--wx-t) 35%, transparent); }
.cal[data-view="day"] .dh { cursor: default; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.cal[data-view="day"] .dh .dn, .cal[data-view="day"] .dh .dw { display: none; }
.cal[data-view="day"] .dh .note { margin: 0; }
.g-all { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 40px; position: relative; }
.g-all .lbl { display: grid; place-items: center; font: 650 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.stayband { grid-row: 1; margin: 6px 4px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 28px; border-radius: 10px; background: var(--stay-t); color: var(--stay-i); font: 620 15px/1 var(--f-ui); box-shadow: inset 4px 0 0 var(--stay); white-space: nowrap; overflow: hidden; }
.stayband svg { width: 16px; height: 16px; flex: none; color: var(--stay); }
.g-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.g-inner { position: relative; height: calc(var(--hours) * var(--hh)); }
.gut { position: relative; }
.gut span { position: absolute; right: 10px; translate: 0 -50%; font: 560 14px/1 var(--f-num); font-feature-settings: var(--num-feat); color: var(--ink-3); }
.col { position: relative; border-left: 1px solid var(--line); cursor: copy;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--line) 45%, transparent) 1px, transparent 1px);
  background-size: 100% var(--hh), 100% var(--hh); background-position: 0 0, 0 calc(var(--hh) / 2); }
.col.off-am, .col.off-pm { }
.offwin { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 7px, var(--hatch) 7px 14px); pointer-events: none; }
.rainband { position: absolute; left: 0; right: 0; pointer-events: none; background: repeating-linear-gradient(110deg, color-mix(in srgb, var(--wx) 13%, transparent) 0 3px, transparent 3px 11px), color-mix(in srgb, var(--wx-t) 40%, transparent); border-top: 2px dashed color-mix(in srgb, var(--wx) 45%, transparent); }
.rainband span { position: absolute; right: 6px; top: 6px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: var(--wx-t); color: var(--wx-i); font: 620 13px/1 var(--f-ui); }
.rainband span svg { width: 15px; height: 15px; }
.rainband.flash { animation: rainflash 1.6s var(--ease-out) 2; }
@keyframes rainflash { 30% { background-color: color-mix(in srgb, var(--wx) 30%, transparent); } }
.more { position: absolute; right: 6px; z-index: 4; min-width: 40px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 700 14px/28px var(--f-num); box-shadow: var(--sh2); cursor: pointer; transition: transform .15s var(--ease-out); }
.more:active { transform: scale(.92); }
:root[data-theme="dark"] .more { background: #F4F5FB; color: #0F1124; }
.hov { position: absolute; left: 4px; right: 4px; height: calc(var(--hh) / 2); border-radius: 10px; background: color-mix(in srgb, var(--flight) 9%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--flight) 35%, transparent); color: var(--flight-i); font: 620 14px/1 var(--f-num); display: flex; align-items: center; gap: 6px; padding: 0 10px; pointer-events: none; opacity: 0; transition: opacity .12s; }
.hov.on { opacity: 1; }
.hov svg { width: 14px; height: 14px; }

/* events: filled with their kind's colour, Teams-style */
.ev { --k: var(--see); --kt: var(--see-t); --ki: var(--see-i);
  position: absolute; z-index: 2; top: var(--top); height: var(--h); left: calc(var(--lane) * (100% - 6px) / var(--lanes) + 4px); width: calc((100% - 8px) / var(--lanes) - 3px);
  display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--kt); color: var(--ki); box-shadow: inset 4px 0 0 var(--k), 0 1px 0 rgb(255 255 255 / .4) inset;
  overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; transition: box-shadow .2s, transform .18s var(--ease-out), top .12s var(--ease-out), height .12s var(--ease-out); -webkit-tap-highlight-color: transparent; }
.ev:hover { box-shadow: inset 4px 0 0 var(--k), 0 6px 16px -8px color-mix(in srgb, var(--k) 60%, transparent); }
.ev b { font: 640 16px/1.2 var(--f-ui); color: var(--ki); overflow-wrap: normal; }
.ev.l2 b { font-size: 15px; }
.ev.narrow { padding: 5px 5px 5px 9px; }
.ev.narrow b { font-size: 14px; }
.ev.narrow .tm, .ev.narrow small, .ev.narrow .who, .ev.narrow .lk { display: none; }
.ev.lock { padding-right: 28px; }
.ev .tm { font: 560 14px/1.2 var(--f-num); font-feature-settings: var(--num-feat); color: color-mix(in srgb, var(--ki) 82%, var(--kt)); }
.ev small { white-space: nowrap; overflow: hidden; font: 500 14px/1.25 var(--f-ui); color: color-mix(in srgb, var(--ki) 82%, var(--kt)); }
.ev.short { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; flex-wrap: wrap; }
.ev.short { flex-wrap: nowrap; white-space: nowrap; }
.ev.short b { font-size: 15px; overflow-wrap: normal; }
.ev.short .tm { font-size: 14px; }
.ev .who { position: absolute; right: 6px; bottom: 6px; }
.ev .lk { position: absolute; right: 7px; top: 7px; width: 16px; height: 16px; color: color-mix(in srgb, var(--ki) 70%, transparent); }
.ev.short .lk { top: 50%; translate: 0 -50%; }
.ev.lock { cursor: pointer; }
.ev .rz { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; cursor: ns-resize; }
.ev .rz::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 28px; height: 4px; translate: -50% 0; border-radius: 99px; background: color-mix(in srgb, var(--k) 55%, transparent); opacity: 0; transition: opacity .15s; }
.ev:hover .rz::after, .ev.dragging .rz::after, .ev.sel .rz::after { opacity: 1; }
.ev.k-flight { --k: var(--flight); --kt: var(--flight-t); --ki: var(--flight-i); }
.ev.k-stay { --k: var(--stay); --kt: var(--stay-t); --ki: var(--stay-i); }
.ev.k-food { --k: var(--food); --kt: var(--food-t); --ki: var(--food-i); }
.ev.k-see { --k: var(--see); --kt: var(--see-t); --ki: var(--see-i); }
.ev.k-ride { --k: var(--ride-k); --kt: var(--ride-t); --ki: var(--ride-i); }
.ev.dragging { z-index: 20; cursor: grabbing; transform: scale(1.03); box-shadow: inset 4px 0 0 var(--k), var(--sh3); transition: box-shadow .2s, transform .25s var(--spring); }
.ev.armed { transform: scale(1.04); box-shadow: inset 4px 0 0 var(--k), var(--sh2); }
.ev.land { animation: land .7s var(--spring) both; animation-delay: var(--dl, 0ms); }
@keyframes land { from { opacity: 0; transform: translateY(-10px) scale(.86); } to { opacity: 1; transform: none; } }
.ev.settle { animation: settle .55s var(--spring); }
@keyframes settle { 0% { transform: scale(1.03); } 100% { transform: none; } }
.ev.wiggle { animation: wiggle .42s var(--ease-out); }
@keyframes wiggle { 20% { translate: -5px 0; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } 80% { translate: 2px 0; } }
.ev.ghost { background: color-mix(in srgb, var(--kt) 55%, transparent); box-shadow: inset 0 0 0 2px var(--k); pointer-events: none; opacity: .92; }
.ev.ghost.live { animation: breathe 1.1s ease-in-out infinite; border: 2px dashed var(--c); background: color-mix(in srgb, var(--kt) 40%, transparent); box-shadow: none; }
@keyframes breathe { 50% { opacity: .5; } }
.ev.byother { box-shadow: inset 4px 0 0 var(--k), 0 0 0 2.5px var(--c); }
.ev.hidden { visibility: hidden; }
.tip { position: absolute; z-index: 25; padding: 6px 10px; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 650 14px/1 var(--f-num); white-space: nowrap; pointer-events: none; box-shadow: var(--sh2); translate: -50% -130%; }

.cursor { position: absolute; z-index: 26; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px 999px 999px 6px; background: var(--c); color: #fff; font: 650 14px/1 var(--f-ui); box-shadow: var(--sh2); pointer-events: none; white-space: nowrap; }
.cursor .av { box-shadow: 0 0 0 2px rgb(255 255 255 / .6); }
.flyer { position: fixed; z-index: 120; pointer-events: none; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 6px 12px; overflow: hidden; box-shadow: var(--sh3); }
.dragcard { position: fixed; z-index: 120; pointer-events: none; display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 16px; font: 640 16px/1.2 var(--f-ui); box-shadow: var(--sh3); rotate: -2deg; }
.dragcard .ic { width: 28px; height: 28px; }

/* ---------- popovers (booking v2's) ---------- */
.pop { position: fixed; z-index: 60; width: min(400px, calc(100vw - 24px)); max-height: calc(100svh - 24px); overflow-y: auto; padding: 18px 20px 20px; border-radius: 24px; background: var(--card-solid); color: var(--ink); box-shadow: var(--sh3), 0 0 0 1px var(--line); font: 450 17px/1.4 var(--f-ui); }

.pop .ph b { display: block; margin-top: 6px; font: var(--d-wt) 26px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.pop .lab { margin: 14px 0 8px; font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card-2); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.x svg { width: 16px; height: 16px; }
.x:active { transform: scale(.92); }
.timeline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card-2); }
.step button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--card-solid); box-shadow: var(--sh1); cursor: pointer; display: grid; place-items: center; }
.step button svg { width: 16px; height: 16px; }
.step button:active { transform: scale(.9); }
.step output { min-width: 62px; text-align: center; font: 700 19px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; background: var(--card-2); color: var(--ink); font: 580 16px/1 var(--f-ui); box-shadow: inset 0 0 0 1px var(--line); transition: background-color .2s, color .2s, transform .15s; }
.chip:active { transform: scale(.95); }

.chip[aria-pressed="true"] { background: var(--ink); color: var(--card-solid); box-shadow: none; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: #F4F5FB; color: #0F1124; }

.sugs { display: grid; gap: 6px; }
.sug { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 16px; background: var(--card-2); cursor: pointer; text-align: left; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s, transform .15s; }

.sug .t { flex: 1; min-width: 0; }
.sug .t b { display: block; font-weight: 630; font-size: 16px; }
.sug .t small { display: block; color: var(--ink-2); font-size: 15px; }
.fit { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--food-t); color: var(--food-i); font: 640 13px/1 var(--f-ui); margin-right: 4px; vertical-align: 1px; }
.fit.see { background: var(--see-t); color: var(--see-i); }
.fit.wx { background: var(--wx-t); color: var(--wx-i); }
.namefield { display: block; position: relative; margin-top: 8px; }
.namefield input { width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font: 500 17px/1 var(--f-ui); }

.namefield input:focus { outline: none; box-shadow: inset 0 0 0 2.5px var(--flight); }
.pop .go1 { margin-top: 14px; width: 100%; height: 54px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 680 17px/1 var(--f-ui); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s; }

:root[data-theme="dark"] .pop .go1 { background: #F4F5FB; color: #0F1124; }
.pop .row2 { display: flex; gap: 8px; margin-top: 14px; }
.pop .row2 > * { flex: 1; }
.btn2 { height: 50px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--card-2); cursor: pointer; font: 620 16px/1 var(--f-ui); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; }
.btn2:active { transform: scale(.96); }
.btn2 svg { width: 17px; height: 17px; }
.btn2.danger { color: var(--food-i); background: var(--food-t); }
.evmeta { display: grid; gap: 8px; }
.evmeta div { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--ink-2); }
.evmeta svg { width: 18px; height: 18px; flex: none; color: var(--ink-3); }
.evmeta b { color: var(--ink); font-weight: 620; }
.kpill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--kt); color: var(--ki); font: 650 13px/1 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; }
.lockline { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card-2); color: var(--ink-2); font-size: 16px; display: flex; gap: 10px; align-items: flex-start; }
.lockline svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.heart { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 12px; border: 0; border-radius: 999px; background: var(--card-2); cursor: pointer; font: 640 16px/1 var(--f-num); color: var(--ink-2); transition: transform .15s, background-color .2s, color .2s; }
.heart svg { width: 19px; height: 19px; transition: transform .35s var(--spring); }
.heart[aria-pressed="true"] { background: var(--food-t); color: var(--food-i); }

.heart.bump svg { animation: pop .45s var(--spring); }
.heart:active { transform: scale(.94); }
.scrim { position: fixed; inset: 0; z-index: 55; background: rgb(10 10 30 / .28); opacity: 0; pointer-events: none; transition: opacity .22s; }
.scrim.on { opacity: 1; pointer-events: auto; }
@media (min-width: 720px) { .scrim.light { background: transparent; } }

/* ---------- the rail: help beside the calendar ---------- */
.rail { position: sticky; top: 14px; display: grid; gap: 14px; max-height: calc(100svh - 28px); overflow-y: auto; scrollbar-width: none; padding-bottom: 20px; border-radius: 26px; }

.rail-head small { color: var(--ink-2); font-size: 15px; }
.rail-row { display: grid; gap: 14px; }
.wg { position: relative; padding: 16px 18px 18px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 0 0 1px var(--glass-line), 0 10px 30px -14px rgb(40 30 110 / .25); }
.wg > header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.wg > header h3 { margin: 0; flex: 1; font: 650 15px/1.1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--k); color: #fff; flex: none; }
.ic svg { width: 17px; height: 17px; }
.ic.ride { color: #2B2100; }
.smp { font: 600 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ride-i); background: var(--ride-t); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.wg p { margin: 4px 0 0; color: var(--ink-2); font-size: 16px; line-height: 1.4; }
.wg .fine { font-size: 15px; color: var(--ink-3); margin-top: 8px; }
.days5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
.days5 button { padding: 8px 0; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--card-solid) 55%, transparent); display: grid; gap: 4px; justify-items: center; font: 600 15px/1 var(--f-num); font-feature-settings: var(--num-feat); color: var(--ink); cursor: pointer; transition: transform .15s, background-color .2s; }
.days5 button:active { transform: scale(.94); }
.days5 button span { font: 650 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.days5 button small { font: 500 13px/1 var(--f-num); color: var(--ink-3); }
.days5 svg { width: 24px; height: 24px; }
.days5 .rain svg { color: var(--wx); } .days5 .sun svg { color: #D97706; } :root[data-theme="dark"] .days5 .sun svg { color: #FBBF24; } .days5 .partly svg { color: var(--ink-2); }
.days5 button.wet { background: color-mix(in srgb, var(--wx-t) 85%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--wx) 50%, transparent); }
.nudge { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--wx-t) 82%, transparent); color: var(--wx-i); }
.nudge .ni { grid-row: span 2; width: 36px; height: 36px; border-radius: 12px; background: var(--wx); color: #fff; display: grid; place-items: center; }
:root[data-theme="dark"] .nudge .ni { color: #062033; }
.nudge .ni svg { width: 20px; height: 20px; }
.nudge b { font: 650 16px/1.3 var(--f-ui); color: var(--wx-i); }
.nudge span { font-size: 15px; line-height: 1.35; }
.nudge .link-btn { grid-column: 2; justify-self: start; color: var(--wx-i); padding-top: 4px; }
.link-btn { border: 0; background: none; padding: 8px 0 0; color: var(--flight-i); font: 620 16px/1 var(--f-ui); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.plus { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card-solid); color: var(--ink); box-shadow: var(--sh1); cursor: pointer; flex: none; transition: transform .18s var(--ease-out), background-color .2s; }
.plus svg { width: 18px; height: 18px; }
.plus:hover { background: var(--ink); color: var(--card-solid); }
:root[data-theme="dark"] .plus:hover { background: #F4F5FB; color: #0F1124; }
.plus:active { transform: scale(.9); }
.plus.done { background: var(--see); color: #fff; }
:root[data-theme="dark"] .plus.done { color: #062320; }
.fits { list-style: none; margin: 0; padding: 0; display: grid; }
.fits li { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.fits li + li { border-top: 1px solid var(--line); }
.fits .art { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; flex: none; box-shadow: var(--sh1); }
.fits .art svg { width: 100%; height: 100%; display: block; }
.fits .t { flex: 1; min-width: 0; }
.fits .t b { display: block; font-weight: 640; font-size: 16px; }
.fits .t small { display: block; color: var(--ink-2); font-size: 15px; line-height: 1.35; }
[data-drag] { cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.honest { margin-top: 10px; padding: 10px 12px; border-radius: 16px; background: color-mix(in srgb, var(--card-solid) 55%, transparent); font-size: 15px; color: var(--ink-2); line-height: 1.4; display: flex; gap: 10px; align-items: center; }
.honest b { color: var(--ink); }
.honest svg { flex: none; }
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3.3; background: var(--card-2); box-shadow: var(--sh1); transition: transform .2s var(--ease-out); }
.pl:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 8.4; }
.pl > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.pl .cap { position: absolute; z-index: 1; left: 10px; right: 10px; bottom: 8px; color: #fff; pointer-events: none; }
.pl .cap b { display: block; font: 640 15px/1.15 var(--f-ui); }
.pl:first-child .cap b { font: var(--d-wt) 22px/1.1 var(--f-display); letter-spacing: var(--d-track); }
.pl .cap small { display: block; font: 560 13px/1.2 var(--f-num); color: rgb(255 255 255 / .92); margin-top: 2px; }
.pl .rk { position: absolute; z-index: 1; left: 8px; top: 8px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 9px; background: rgb(255 255 255 / .92); color: #0F1124; font: 720 14px/26px var(--f-num); text-align: center; }
.pl .ill { position: absolute; z-index: 1; left: 40px; top: 10px; padding: 4px 8px; border-radius: 999px; background: rgb(15 17 36 / .62); color: #fff; font: 600 12px/1 var(--f-ui); }
.pl .plus { position: absolute; z-index: 2; right: 8px; top: 8px; width: 36px; height: 36px; }
.pl[hidden] { display: none; }
.fam { padding: 12px; border-radius: 20px; background: color-mix(in srgb, var(--card-solid) 60%, transparent); }
.fam + .fam { margin-top: 10px; }
.fam-h { display: flex; align-items: center; gap: 10px; }
.fam-h .t { flex: 1; min-width: 0; }
.fam-h b { display: block; font-weight: 640; font-size: 16px; }
.fam-h small { display: block; color: var(--ink-2); font-size: 14px; }
.fam-h .hc { display: inline-flex; align-items: center; gap: 4px; font: 640 14px/1 var(--f-num); color: var(--food-i); }
.fam-h .hc svg { width: 15px; height: 15px; fill: currentColor; }
.fam h4 { margin: 10px 0 6px; font: var(--d-wt) 21px/1.15 var(--f-display); letter-spacing: var(--d-track); }
.mini-tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mini-tl li { display: grid; grid-template-columns: 48px 10px 1fr; align-items: center; gap: 8px; font-size: 15px; padding: 3px 0; }
.mini-tl .tm { font: 560 14px/1 var(--f-num); font-feature-settings: var(--num-feat); color: var(--ink-3); text-align: right; }
.mini-tl i { width: 10px; height: 10px; border-radius: 4px; background: var(--k); }
.mini-btn { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 620 16px/1 var(--f-ui); cursor: pointer; transition: transform .15s; }
:root[data-theme="dark"] .mini-btn { background: #F4F5FB; color: #0F1124; }
.mini-btn:active { transform: scale(.95); }
.mini-btn svg { width: 17px; height: 17px; }
.happen { list-style: none; margin: 0; padding: 0; }
.happen li { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 16px; }
.happen li + li { border-top: 1px solid var(--line); }
.happen .t { flex: 1; } .happen small { display: block; color: var(--ink-2); font-size: 15px; }
.rail.swap .wg, .rail.swap .rail-head { animation: wgin .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes wgin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- planning together: drawer on a laptop, sheet on a phone ---------- */
.side { position: fixed; z-index: 70; top: 14px; right: 14px; bottom: 14px; width: 432px; display: flex; flex-direction: column; border-radius: 30px; background: var(--glass-strong); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); box-shadow: var(--sh3), inset 0 0 0 1px var(--glass-line); overflow: clip; }
.side[hidden] { display: none; }
.sd-head { display: flex; align-items: center; gap: 12px; padding: 18px 16px 10px 22px; }
.sd-head .t { flex: 1; }
.sd-head small { display: block; color: var(--ink-3); font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; }
.sd-head b { display: block; margin-top: 6px; font: var(--d-wt) 28px/1.05 var(--f-display); letter-spacing: var(--d-track); }
.sd-body { flex: 1; overflow-y: auto; overflow-x: clip; padding: 4px 18px 18px; display: grid; gap: 14px; align-content: start; scrollbar-width: thin; }
.sd-body > * { min-width: 0; }
.sd-sec { padding: 14px; border-radius: 22px; background: color-mix(in srgb, var(--card-solid) 70%, transparent); }
.sd-sec > h5 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.sd-sec > h5 .sp { flex: 1; }
.people { display: grid; gap: 4px; }
.person { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.person .t { flex: 1; min-width: 0; }
.person b { font-weight: 640; font-size: 16px; }
.person small { display: block; color: var(--ink-2); font-size: 15px; }
.person small.live { color: color-mix(in srgb, var(--live) 70%, var(--ink)); font-weight: 560; }
.role { font: 620 13px/1 var(--f-ui); color: var(--ink-3); padding: 6px 9px; border-radius: 999px; background: var(--card-2); }
.invite { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--card-2); }
.invite code { flex: 1; min-width: 0; font: 560 15px/1 var(--f-num); color: var(--ink); overflow-wrap: anywhere; }
.invite button { height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 640 15px/1 var(--f-ui); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
:root[data-theme="dark"] .invite button { background: #F4F5FB; color: #0F1124; }
.invite button svg { width: 16px; height: 16px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.feed li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 16px; color: var(--ink-2); }
.feed li b { color: var(--ink); font-weight: 640; }
.feed li .tm { margin-left: auto; font: 500 14px/1 var(--f-num); color: var(--ink-3); white-space: nowrap; }
.feed li.new { animation: feedin .7s var(--spring) both; border-radius: 12px; background: color-mix(in srgb, var(--live) 12%, transparent); padding: 7px 8px; margin: 0 -8px; }
@keyframes feedin { from { opacity: 0; transform: translateY(-8px) scale(.96); } to { opacity: 1; transform: none; } }
.ideas { display: grid; gap: 8px; }
.idea { display: flex; align-items: center; gap: 12px; }
.idea .art { width: 48px; height: 48px; border-radius: 14px; overflow: hidden; flex: none; }
.idea .art svg { width: 100%; height: 100%; display: block; }
.idea .t { flex: 1; min-width: 0; }
.idea .t b { display: block; font-size: 16px; font-weight: 640; }
.idea .t small { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 14px; }
.threads { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 10px; padding: 0 14px; }
.threads::-webkit-scrollbar { display: none; }
.threads .chip { min-height: 38px; font-size: 15px; flex: none; }
.threads .chip .cnt { font: 650 13px/1 var(--f-num); opacity: .75; }
.bubbles { display: grid; gap: 4px; }
.bubbles .div { text-align: center; color: var(--ink-3); font: 560 13px/1 var(--f-ui); margin: 8px 0 4px; }
.bub { max-width: 84%; padding: 9px 13px; border-radius: 20px; font-size: 16px; line-height: 1.35; }
.bub.them { justify-self: start; background: var(--card-2); border-bottom-left-radius: 6px; }
.bub.me { justify-self: end; background: var(--flight); color: #fff; border-bottom-right-radius: 6px; }
:root[data-theme="dark"] .bub.me { background: #4F46E5; }
.bub .nm { display: block; font: 650 13px/1.3 var(--f-ui); color: var(--c); margin-bottom: 2px; }
:root[data-theme="dark"] .bub .nm { filter: brightness(1.5); }
.bub.new { animation: feedin .55s var(--spring) both; }
.ref { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 9px; border-radius: 999px; background: var(--kt); color: var(--ki); font: 620 13px/1.2 var(--f-ui); }
.bub.me .ref { background: rgb(255 255 255 / .2); color: #fff; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick .chip { min-height: 36px; font-size: 15px; }
.composer { display: flex; gap: 8px; margin-top: 10px; }
.composer input { flex: 1; min-width: 0; height: 46px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font: 500 16px/1 var(--f-ui); }
.composer input::placeholder { color: var(--ink-3); }
.composer input:focus { outline: none; box-shadow: inset 0 0 0 2.5px var(--flight); }
.composer button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--flight); color: #fff; cursor: pointer; display: grid; place-items: center; }
.composer button svg { width: 18px; height: 18px; }

/* the beacon: a live pill that grows at the top */
.beacon { position: fixed; z-index: 96; left: 50%; top: 14px; translate: -50% 0; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 999px; background: #0F1124; color: #fff; box-shadow: var(--sh3); font: 560 16px/1.2 var(--f-ui); max-width: calc(100vw - 24px); }
:root[data-theme="dark"] .beacon { background: #F4F5FB; color: #0F1124; }
.beacon[hidden] { display: none; }
.beacon .av { box-shadow: none; }
.beacon b { font-weight: 680; }
.beacon .t { white-space: nowrap; overflow: hidden; }
.beacon button { height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .16); color: inherit; font: 640 15px/1 var(--f-ui); cursor: pointer; flex: none; }
:root[data-theme="dark"] .beacon button { background: rgb(15 17 36 / .1); }

/* ---------- the save sheet (booking v2's success, again) ---------- */
.sheet { position: fixed; z-index: 80; left: 50%; top: 50%; width: min(600px, calc(100vw - 32px)); max-height: min(860px, calc(100svh - 40px)); translate: -50% -50%; display: flex; flex-direction: column; border-radius: 32px; background: var(--card-solid); box-shadow: var(--sh3), 0 0 0 1px var(--line); overflow: hidden; }
.sheet[hidden] { display: none; }
.sh-body { flex: 1; overflow-y: auto; padding: 22px 24px 18px; position: relative; }
.sh-body > .pane { animation: paneIn .38s var(--ease-out) both; }
@keyframes paneIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.sh-foot { display: flex; gap: 10px; padding: 14px 18px 18px; border-top: 1px solid var(--line); align-items: center; }
.sh-foot .sp { flex: 1; }
.btn1 { height: 56px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card-solid); cursor: pointer; font: 680 18px/1 var(--f-ui); display: inline-flex; align-items: center; gap: 10px; transition: transform .15s; }
:root[data-theme="dark"] .btn1 { background: #F4F5FB; color: #0F1124; }
.btn1.sun, :root[data-theme="dark"] .btn1.sun { background: var(--sunset); color: #fff; box-shadow: 0 12px 30px -12px rgb(139 47 201 / .6); }
.btn1:active { transform: scale(.96); }
.btn1 svg { width: 20px; height: 20px; }
.sh-x { position: absolute; right: 16px; top: 16px; z-index: 2; }
.done-h { text-align: center; margin: 10px 0 14px; }
.done-h b { display: block; font: var(--d-wt) 36px/1.05 var(--f-display); letter-spacing: var(--d-track); }
.done-h p { margin: 8px 0 0; color: var(--ink-2); }
.pass { position: relative; border-radius: 26px; overflow: hidden; background: var(--sunset); color: #fff; box-shadow: var(--sh2); }
.pass .top-art { height: 120px; position: relative; }
.pass .top-art svg { width: 100%; height: 100%; display: block; }
.pass .pb { padding: 16px 20px 20px; display: grid; gap: 12px; }
.pass .pb small { color: rgb(255 255 255 / .86); font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; }
.pass h3 { margin: 4px 0 0; font: var(--d-wt) 32px/1.05 var(--f-display); letter-spacing: var(--d-track); }
.pass .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pass .cols b { display: block; margin-top: 6px; font: 740 26px/1 var(--f-num); font-feature-settings: var(--num-feat); }
.pass .perf { height: 0; border-top: 2px dashed rgb(255 255 255 / .4); margin: 2px -20px; }
.wkstrip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.wkstrip > div { display: grid; gap: 3px; align-content: start; padding: 8px 6px; border-radius: 14px; background: rgb(255 255 255 / .14); min-height: 92px; }
.wkstrip span { font: 650 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: rgb(255 255 255 / .9); margin-bottom: 3px; }
.wkstrip i { display: block; height: 7px; border-radius: 99px; }
.stamp { position: absolute; right: 18px; top: 74px; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; text-align: center; color: var(--ride); border: 4px solid var(--ride); box-shadow: inset 0 0 0 7px var(--ride); rotate: -14deg; font: 760 15px/1 var(--f-ui); letter-spacing: .05em; background: rgb(43 20 90 / .58); }
.stamp { align-content: center; gap: 4px; }
.stamp small { display: block; margin-top: 3px; font: 700 10px/1.3 var(--f-ui); letter-spacing: .08em; color: var(--ride); }
.stamp.thump { animation: thump .55s cubic-bezier(.2, 1.4, .4, 1) both .3s; }
@keyframes thump { from { opacity: 0; transform: scale(2.4); } 70% { opacity: 1; } to { opacity: 1; transform: none; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; }
.share-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
.scard { position: relative; aspect-ratio: 1080 / 1350; border-radius: 22px; overflow: hidden; background: var(--sunset); color: #fff; box-shadow: var(--sh2); display: flex; flex-direction: column; }
.scard .sa { height: 52%; }
.scard .sa svg { width: 100%; height: 100%; display: block; }
.scard .sb { flex: 1; padding: 12px 14px; display: grid; align-content: space-between; }
.scard h3 { margin: 0; font: var(--d-wt) 28px/1 var(--f-display); letter-spacing: var(--d-track); }
.scard p { margin: 4px 0 0; font-size: 14px; color: rgb(255 255 255 / .9); }
.scard .bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.scard .bars div { display: grid; gap: 2px; align-content: end; height: 30px; overflow: hidden; }
.scard .bars i { display: block; height: 4px; border-radius: 9px; }
.scard .sb { gap: 8px; }
.scard .url { font: 600 12px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: rgb(255 255 255 / .85); }
.opts { display: grid; gap: 4px; }
.optrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 16px; }
.optrow + .optrow { border-top: 1px solid var(--line); }
.optrow .t { flex: 1; } .optrow small { display: block; color: var(--ink-2); font-size: 15px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line-2); cursor: pointer; transition: background-color .25s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: var(--sh1); transition: left .35s var(--spring), width .2s; }
.switch:active::after { width: 32px; }
.switch[aria-checked="true"] { background: var(--see); }
.switch[aria-checked="true"]::after { left: 23px; }
.switch[aria-checked="true"]:active::after { left: 17px; }
.shares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.shares button { display: grid; justify-items: center; gap: 8px; padding: 12px 6px; border: 0; border-radius: 18px; background: var(--card-2); cursor: pointer; font: 600 15px/1.1 var(--f-ui); color: var(--ink); transition: transform .15s; }
.shares button:active { transform: scale(.95); }
.shares .ic { width: 40px; height: 40px; border-radius: 14px; }
.shares .ic svg { width: 20px; height: 20px; }
.privacy { margin-top: 12px; color: var(--ink-2); font-size: 15px; display: flex; gap: 8px; align-items: flex-start; }
.privacy svg { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--see); }

/* ---------- arrival: the pass from booking, flying into place ---------- */
.arrive { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; pointer-events: none; }
.arrive .veil { position: absolute; inset: 0; background: color-mix(in srgb, var(--sky-2) 70%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.arrive .flypass { position: relative; width: min(460px, calc(100vw - 40px)); border-radius: 28px; overflow: hidden; background: var(--sunset); color: #fff; box-shadow: var(--sh3); transform-origin: 0 0; }
.arrive .flypass .top-art { height: 150px; }
.arrive .flypass .top-art svg { width: 100%; height: 100%; display: block; }
.arrive .flypass .pb { padding: 16px 20px 20px; }
.arrive .flypass small { font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: rgb(255 255 255 / .86); }
.arrive .flypass h3 { margin: 6px 0 4px; font: var(--d-wt) 36px/1.05 var(--f-display); letter-spacing: var(--d-track); }
.arrive .flypass p { margin: 0; color: rgb(255 255 255 / .9); }
.arrive .say { position: relative; margin-top: 18px; font: var(--d-wt) 26px/1.2 var(--f-display); letter-spacing: var(--d-track); color: var(--ink); text-align: center; }
.arrive .inner { display: grid; justify-items: center; }
body.arriving .app > *, body.arriving .top .together, body.arriving .top .save { opacity: 0; }
.rise { animation: rise .7s var(--spring-soft) both; animation-delay: var(--dl, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* toast */
.toast { position: fixed; z-index: 95; left: 50%; bottom: 28px; translate: -50% 0; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 20px; border-radius: 999px; background: var(--ink); color: var(--card-solid); font: 600 16px/1.25 var(--f-ui); box-shadow: var(--sh3); opacity: 0; transition: opacity .2s, transform .3s var(--ease-out); transform: translateY(10px); pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: none; pointer-events: auto; }
.toast.noact { padding-right: 20px; }
.toast button { height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .16); color: inherit; font: 650 15px/1 var(--f-ui); cursor: pointer; flex: none; }
:root[data-theme="dark"] .toast button { background: rgb(15 17 36 / .1); }
.toast button[hidden] { display: none; }

/* the prototype's own island (not part of the product) */
.demo { position: fixed; z-index: 50; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: var(--card-solid); box-shadow: var(--sh3), 0 0 0 1px var(--line); }
.demo > span { padding: 0 8px 0 10px; font: 650 13px/1 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.demo button { height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: none; cursor: pointer; font: 600 15px/1 var(--f-ui); color: var(--ink-2); white-space: nowrap; }
.demo button:hover { background: var(--card-2); }

/* phone dock */
.dock { display: none; }

/* ---------- tablet and phone ---------- */
@media (max-width: 1099px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: relative; top: 0; max-height: none; overflow: visible; display: block; padding: 0; }
  .rail-head { margin-bottom: 10px; }
  .rail-row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -28px; padding: 2px 28px 12px; scroll-padding: 0 28px; align-items: start; }
  .rail-row::-webkit-scrollbar { display: none; }
  .rail-row .wg { flex: 0 0 320px; scroll-snap-align: start; }
  .cal { height: 72svh; }
}
@media (max-width: 719px) {
  .top { padding: 10px 16px 10px; gap: 8px; }
  .top .pill-sample, .top .crumb, .top .together, .top .save { display: none; }
  .brand { font-size: 22px; }
  .app { padding: 0 12px 120px; gap: 12px; }
  .trip { flex-wrap: wrap; gap: 12px 14px; padding: 14px; border-radius: 26px; min-height: 0; }
  .trip { padding: 16px; }
  .trip .art, .trip h1 em, .trip .who small { display: none; }
  .trip .ti { flex-basis: 100%; }
  .trip h1 { font-size: 36px; margin: 6px 0 2px; }
  .trip .meta { font-size: 15px; }
  .trip .k { font-size: 12px; }
  .trip .who { order: 3; flex: 1; justify-items: start; }
  .trip .who .stack .av { width: 34px; height: 34px; font-size: 14px; }
  .count { order: 4; min-width: 0; padding: 8px 14px; display: flex; align-items: baseline; gap: 8px; border-radius: 18px; }
  .count b { font-size: 32px; }
  .cal { border-radius: 26px; height: calc(100svh - 130px); min-height: 520px; }
  .cal-top { padding: 12px 12px 8px; gap: 8px; }
  .cal-title { display: none; }
  .legend { order: 5; margin: 0 -12px; padding: 0 12px; width: calc(100% + 24px); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .legend::-webkit-scrollbar { display: none; }
  .lg { flex: none; font-size: 14px; height: 30px; }
  .addbtn { margin-left: auto; height: 44px; }
  .cal[data-view="day"] .nav2 { display: none; }
  .chipsrow { padding: 0 12px 10px; }
  .dchip { min-width: 0; padding: 8px 12px 8px 10px; }
  .dh { padding: 8px 4px 8px 6px; grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 2px; }
  .dh .dn { grid-row: auto; font-size: 24px; }
  .dh .dw { font-size: 12px; }
  .dh .wxl { font-size: 13px; gap: 2px; }
  .dh .wxl svg { width: 16px; height: 16px; }
  .dh .note { display: none; }
  .cal[data-view="day"] .dh { grid-template-columns: auto 1fr; justify-items: start; text-align: left; padding: 8px 12px; gap: 0 10px; }
  .cal[data-view="day"] .dh .dn { grid-row: span 2; font-size: 34px; }
  .cal[data-view="day"] .dh { display: flex; padding: 8px 12px; }
  .cal[data-view="day"] .dh .dn, .cal[data-view="day"] .dh .dw, .cal[data-view="day"] .dh .wxl { display: none; }
  .cal[data-view="day"] .dh .note { display: inline-flex; margin: 0; }
  .cal[data-view="week"] .ev { padding: 4px 4px 4px 8px; border-radius: 9px; box-shadow: inset 3px 0 0 var(--k); }
  .cal[data-view="week"] .ev b { font-size: 13px; line-height: 1.15; }
  .cal[data-view="week"] .ev .tm, .cal[data-view="week"] .ev small, .cal[data-view="week"] .ev .who, .cal[data-view="week"] .ev .lk { display: none; }
  .stayband { font-size: 14px; padding: 0 8px; }
  .g-all .lbl { font-size: 0; }
  .g-all .lbl svg { width: 16px; height: 16px; color: var(--ink-3); }
  .gut span { font-size: 13px; right: 6px; }
  .rail-row { margin: 0 -12px; padding: 2px 12px 12px; scroll-padding: 0 12px; }
  .rail-row .wg { flex-basis: 304px; }
  .rail-head b { font-size: 22px; }
  .demo { display: none; }
  .dock { position: fixed; z-index: 50; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--sh3), inset 0 0 0 1px var(--glass-line); }
  .dock .together { flex: 1; box-shadow: none; background: var(--card-2); height: 52px; }
  .dock .save { flex: 1; height: 52px; }

let HH = 52;
function setHH() {

}
const visDays = () => S.view === 'week' ? [0, 1, 2, 3, 4] : [S.day];
const maxLanes = () => (phone() && S.view === 'week') ? 1 : 2;
function lanes(list, max = maxLanes()) {
  const out = new Map(), chips = []; const sorted = [...list].sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], end = -1;
  const flush = () => {
    const ends = []; const hidden = [];
    cluster.forEach(e => { let l = ends.findIndex(x => x <= e.s); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = e.e; out.set(e.id, { lane: l, hidden: l >= max }); if (l >= max) hidden.push(e); });
    cluster.forEach(e => out.get(e.id).lanes = Math.min(ends.length, max));
    if (hidden.length) { const top = Math.min(...hidden.map(e => e.s)), bot = Math.max(...cluster.map(e => e.e)); chips.push({ s: Math.max(top, bot - 38), ids: hidden.map(e => e.id) }); }
    cluster = [];
  };
  sorted.forEach(e => { if (e.s >= end && cluster.length) flush(); cluster.push(e); end = Math.max(end, e.e); });
  if (cluster.length) flush();
  out.chips = chips;
  return out;
}

function freeHours(d) {

    col.insertAdjacentHTML('beforeend', evHTML(ev, null, { cls: 'ghost live' }).replace('class="ev', `style="--c:${P.maya.c}" class="ev`));
    const g = $('.ev.ghost.live', col); g.style.setProperty('--c', P.maya.c);
    const cur = document.createElement('div'); cur.className = 'cursor'; cur.style.setProperty('--c', P.maya.c); cur.innerHTML = `${av('maya', 'sm')}Maya`;
    $('#grid').appendChild(cur);
    const gr = $('#grid').getBoundingClientRect(), tr = g.getBoundingClientRect();
    const to = { x: tr.left - gr.left + tr.width - 30, y: tr.top - gr.top + 14 };
    cur.style.left = to.x + 'px'; cur.style.top = to.y + 'px';
    if (!RM.matches) cur.animate([{ transform: `translate(${Math.round(gr.width - to.x)}px, ${Math.round(-Math.abs(to.y) * .4)}px)`, opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'none', opacity: 1 }], { duration: 1100, easing: SPRING_SOFT });
    setTimeout(() => { cur.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, delay: 1300, fill: 'forwards' }).onfinish = () => cur.remove(); }, 1400);
  }
  setTimeout(() => {
    $$('.ev.ghost.live').forEach(n => n.remove());
    S.events.push(ev);
    render({ fresh: new Set(['live1']) });
    FEED.push({ who: 'maya', text: `added <b>Aerial Tramway</b> · Thu 13:00`, tm: 'now', fresh: true });
    (THREADS['ev-live1'] = THREADS['ev-live1'] || []).push({ who: 'maya', tm: 'Just now', text: 'Put the tram on Thursday: rain after lunch, and the cabin is indoors. Jackets for the top!', ref: { k: 'see', t: 'Aerial Tramway · Thu 13:00' }, fresh: true });
    (THREADS.d2 = THREADS.d2 || []).push({ who: 'maya', text: 'Tram on Thursday, then?', fresh: true });
    $$('[data-presence="maya"]').forEach(n => n.textContent = 'Editing Thursday');
    PRESENCE.maya = 'Editing Thursday';
    if (S.panelOpen) drawSide(); else { S.unread += 1; drawBadge(); $$('.together .badge').forEach(b => { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }); }
    beacon('maya', `<b>Mom</b> added Aerial Tramway · Thu 13:00`);
    drawChips();
  }, visible ? 1500 : 200);
}
let beaconT;
function beacon(p, html) {
  const b = $('#beacon');
  b.innerHTML = `${av(p)}<span class="t">${html}</span><button data-see>See</button>`;
  b.hidden = false; clearTimeout(beaconT);
  if (!RM.matches) b.animate([{ clipPath: 'inset(0 calc(50% - 20px) round 999px)', opacity: .4 }, { clipPath: 'inset(0 0 round 999px)', opacity: 1 }], { duration: 640, easing: SPRING_SOFT });
  beaconT = setTimeout(hideBeacon, 6000);
}
function hideBeacon() { const b = $('#beacon'); if (b.hidden) return; if (RM.matches) { b.hidden = true; return; } b.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: 200, easing: EASE }).onfinish = () => b.hidden = true; }
$('#beacon').addEventListener('click', e => { if (e.target.closest('[data-see]')) { hideBeacon(); openSide('ev-live1'); } });

/* ================= save, then share ================= */
function save(btn) {
  closePop(true); closeSide();
  btn.classList.add('busy'); btn.dataset.html = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>';
  setTimeout(() => { btn.classList.remove('busy'); btn.innerHTML = btn.dataset.html; S.saved = true; openSheet('saved'); }, RM.matches ? 100 : 1000);
}
function stats() {
  const mine = S.events.filter(e => !e.lock && e.k !== 'flight');
  const days = new Set(S.events.filter(e => !e.lock && e.by).map(e => e.d));
  const fam = S.events.filter(e => e.by && e.by !== 'me').length + IDEAS.filter(i => S.events.some(e => e.sug === i.id)).length;
  return { plans: mine.length, days: days.size, fam };
}
function wk(onDark = true) { return DAYS.map((D, i) => `<div><span>${D.dw}</span>${S.events.filter(e => e.d === i).sort((a, b) => a.s - b.s).map(e => `<i style="background:${e.k === 'ride' ? '#FFD43B' : `var(--${e.k})`};${onDark ? 'box-shadow:0 0 0 1px rgb(255 255 255 / .5)' : ''}"></i>`).join('')}</div>`).join(''); }
function openSheet(which) {
  const sh = $('#sheet'); const st = stats();
  document.body.classList.add('sheet-open'); $('#scrim').classList.add('on'); $('#scrim').classList.remove('light');
  if (which === 'saved') {
    sh.innerHTML = `<div class="sh-body"><button class="x sh-x" data-close aria-label="Close">${I.close}</button><div class="pane">
      <div class="done-h"><b>Your plan is ready!</b><p>Maya, Anika and Dev see it now. It stays editable until you go.</p></div>
      <div class="pass"><div class="top-art">${art('desert')}</div><div class="stamp ${RM.matches ? '' : 'thump'}">PLANNED<small>DEC 15–19</small></div>
        <div class="pb"><div><small>The Rao family · 4 travelling</small><h3>Palm Springs</h3></div>
          <div class="cols"><div><small>Plans</small><b class="num">${st.plans}</b></div><div><small>Days</small><b class="num">${st.days} of 5</b></div><div><small>By family</small><b class="num">${st.fam}</b></div></div>
          <div class="perf"></div>
          <div class="wkstrip">${wk()}</div>
          <small style="text-align:right">Sample plan · nothing booked by saving</small></div></div>
    </div></div>
    <div class="sh-foot"><button class="btn2" data-close>Keep planning</button><span class="sp"></span><button class="btn1 sun" data-share>Share the trip ${I.arrow}</button></div>`;
    confetti();
  } else {
    sh.innerHTML = `<div class="sh-body"><button class="x sh-x" data-close aria-label="Close">${I.close}</button><div class="pane">
      <div class="done-h" style="text-align:left;margin-top:0"><b>Share the trip</b><p>A card for Instagram or the family chat, linking to a read-only page.</p></div>
      <div class="share-wrap">
        <div class="scard" id="scard"><div class="sa">${art('desert')}</div><div class="sb"><div><h3>Palm Springs</h3><p id="scWhen">December · 5 days</p><p id="scWho">A family of 4</p></div><div class="bars">${DAYS.map((D, i) => `<div>${S.events.filter(e => e.d === i).sort((a, b) => a.s - b.s).slice(0, 5).map(e => `<i style="background:${e.k === 'ride' ? '#FFD43B' : `var(--${e.k})`};box-shadow:0 0 0 1px rgb(255 255 255 / .55)"></i>`).join('')}</div>`).join('')}</div><span class="url">gitaway.me · planned on GitAway</span></div></div>
        <div>
          <div class="opts">
            <div class="optrow"><span class="t">Show exact dates<small>Off: it says "December"</small></span><button class="switch" role="switch" aria-checked="false" data-sw="when" aria-label="Show exact dates"></button></div>
            <div class="optrow"><span class="t">Show first names<small>Off: "a family of 4"</small></span><button class="switch" role="switch" aria-checked="false" data-sw="who" aria-label="Show first names"></button></div>
          </div>
          <div class="shares">
            <button data-sh="Copied the trip link (sample)"><span class="ic" style="--k:var(--flight)">${I.link}</span>Copy link</button>
            <button data-sh="Saved the card for Instagram (sample)"><span class="ic" style="--k:var(--food)">${I.camera}</span>Instagram</button>
            <button data-sh="Opened the share sheet (sample)"><span class="ic" style="--k:var(--see)">${I.share}</span>More</button>
          </div>
          <p class="privacy">${I.shield}<span>No booking, price or email is ever on the card or the page.</span></p>
        </div>
      </div></div></div>
    <div class="sh-foot"><button class="btn2" data-back>Back</button><span class="sp"></span><button class="btn1" data-close>Done</button></div>`;
  }
  const first = sh.hidden; sh.hidden = false;
  if (first && !RM.matches) sh.animate(phone() ? [{ transform: 'translateY(100%)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: phone() ? 560 : 520, easing: phone() ? SPRING_SOFT : SPRING });
}
function closeSheet() { const sh = $('#sheet'); if (sh.hidden) return; sh.hidden = true; document.body.classList.remove('sheet-open'); $('#scrim').classList.remove('on'); }
$('#sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeSheet();
  if (e.target.closest('[data-share]')) return openSheet('share');
  if (e.target.closest('[data-back]')) return openSheet('saved');
  const sw = e.target.closest('[data-sw]'); if (sw) { const on = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', on); if (sw.dataset.sw === 'when') $('#scWhen').textContent = on ? 'Dec 15 to 19 · 5 days' : 'December · 5 days'; else $('#scWho').textContent = on ? 'Maya, Raj, Anika and Dev' : 'A family of 4'; return; }
  const s = e.target.closest('[data-sh]'); if (s) toast(s.dataset.sh);
});
function confetti() {
  if (RM.matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; document.body.appendChild(box);
  const cols = ['#4338CA', '#8B2FC9', '#C92A5E', '#FFD43B', '#0F766E', '#C2410C', '#38BDF8'];
  for (let i = 0; i < 140; i++) {
    const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length]; if (i % 3 === 0) p.style.borderRadius = '50%';
    p.style.width = (6 + Math.random() * 8) + 'px'; p.style.height = (8 + Math.random() * 10) + 'px'; box.appendChild(p);
    const dx = (Math.random() - .5) * 240, rot = (Math.random() - .5) * 1080, dur = 1800 + Math.random() * 1600;
    p.animate([{ transform: 'translate(0, -20px) rotate(0)' }, { transform: `translate(${dx}px, ${innerHeight * .55}px) rotate(${rot / 2}deg)`, offset: .6 }, { transform: `translate(${dx * 1.3}px, ${innerHeight + 40}px) rotate(${rot}deg)`, opacity: .9 }], { duration: dur, delay: Math.random() * 400, easing: 'cubic-bezier(.25,.6,.4,1)', fill: 'both' });
  }
  setTimeout(() => box.remove(), 4200);
}

/* ================= arrival: the pass from booking flies up into the header ================= */
function arrive() {
  closePop(true); closeSide(); closeSheet();
  const fresh = new Set(S.events.map(e => e.id));
  if (RM.matches) { document.body.classList.remove('arriving'); render({ fresh }); drawRail(); return Promise.resolve(); }
  document.body.classList.add('arriving');
  const ov = document.createElement('div'); ov.className = 'arrive';
  ov.innerHTML = `<div class="veil"></div><div class="inner"><div class="flypass"><div class="top-art">${art('desert')}</div><div class="pb"><small>Booked · Desert Bloom + Coastline Air</small><h3>Palm Springs</h3><p class="num">Tue, Dec 15 → Sat, Dec 19 · a family of 4</p></div></div><div class="say">Let's plan it together.</div></div>`;
  document.body.appendChild(ov);
  const pass = $('.flypass', ov), say = $('.say', ov), veil = $('.veil', ov);
  pass.animate([{ opacity: 0, transform: 'translateY(30px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: SPRING_SOFT });
  say.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 250, easing: EASE, fill: 'backwards' });
  return new Promise(res => setTimeout(() => {
    render({ fresh, hide: fresh }); drawRail();
    const trip = $('#trip'); const to = trip.getBoundingClientRect(); const from = pass.getBoundingClientRect();
    say.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    const sx = to.width / from.width, sy = to.height / from.height;
    pass.animate([{ transform: 'none', borderRadius: '28px' }, { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${sx}, ${sy})`, borderRadius: `${32 / sx}px / ${32 / sy}px` }], { duration: 760, easing: SPRING_SOFT, fill: 'forwards' });
    $$('.top-art, .pb', pass).forEach(n => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' }));
    veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 200, fill: 'forwards' });
    setTimeout(() => {
      document.body.classList.remove('arriving');
      trip.classList.add('rise'); trip.style.setProperty('--dl', '0ms');
      trip.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 300 });
      ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: 'forwards' }).onfinish = () => ov.remove();
      const cal = $('#cal'); cal.classList.remove('rise'); void cal.offsetWidth; cal.style.setProperty('--dl', '60ms'); cal.classList.add('rise');
      drawRail(true);
      $$('.ev.hidden').forEach((n, i) => { n.style.setProperty('--dl', (380 + i * 110) + 'ms'); n.classList.remove('hidden'); n.classList.add('land'); });
      $$('.top .together, .top .save').forEach(n => n.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 500, easing: EASE, fill: 'backwards' }));
      setTimeout(() => { trip.classList.remove('rise'); cal.classList.remove('rise'); res(); }, 1500);
    }, 700);
  }, 1300));
}

/* ================= toast ================= */
let toastT;
function toast(msg, canUndo) {
  const t = $('#toast'); $('#toastMsg').textContent = msg; $('#toastAct').hidden = !canUndo; t.classList.toggle('noact', !canUndo);
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), canUndo ? 4800 : 3200);
}
$('#toastAct').addEventListener('click', () => { $('#toast').classList.remove('on'); undo(); refreshPlusMarks(); });

/* ================= chrome ================= */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? I.sunline : I.moon; $('#themeBtn').setAttribute('aria-label', t === 'dark' ? 'Switch to light' : 'Switch to dark');
  try { localStorage.setItem('pv2-theme', t); } catch {}
}
$('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$$('.seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#chipsrow').addEventListener('click', e => { const c = e.target.closest('[data-day]'); if (c) setView('day', +c.dataset.day); });
$('#prevDay').addEventListener('click', () => setView('day', (S.day + 4) % 5));
$('#nextDay').addEventListener('click', () => setView('day', (S.day + 1) % 5));
$('#addBtn').addEventListener('click', e => {
  const d = S.view === 'day' ? S.day : 1; const sug = { k: 'see', dur: 120, t: '' };
  const slot = findSlot(sug, d) || { d, s: 10 * 60 };
  openQuickAdd(slot.d, slot.s, phone() ? null : e.currentTarget.getBoundingClientRect());
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-together], #togetherBtn')) return S.panelOpen ? closeSide() : openSide();
  const sv = e.target.closest('[data-save], #saveBtn'); if (sv) return save(sv);
});
$('#demo').addEventListener('click', e => {
  const b = e.target.closest('[data-demo]'); if (!b) return;
  if (b.dataset.demo === 'arrive') arrive();
  if (b.dataset.demo === 'live') { S.liveDone = false; S.events = S.events.filter(x => x.id !== 'live1'); render(); liveAdd(); }
  if (b.dataset.demo === 'reset') { S.events = BASE_EVENTS(); S.hist = []; S.liveDone = false; render(); drawRail(); }
});
let lastPhone = phone();
addEventListener('resize', () => { if (phone() !== lastPhone) { lastPhone = phone(); closePop(true); render(); } });

/* ================= go ================= */
(function init() {
  let t = 'light'; try { t = localStorage.getItem('pv2-theme') || 'light'; } catch {}
  const q = new URLSearchParams(location.search); if (q.get('theme')) t = q.get('theme');
  setTheme(t);
  S.view = q.get('view') || (phone() ? 'day' : 'week');
  if (q.get('day')) S.day = +q.get('day');
  $('#addBtn').innerHTML = `${I.plus}Add`;
  $('#prevDay').innerHTML = I.left; $('#nextDay').innerHTML = I.right;
  $('#saveBtn').innerHTML = `${I.check}Save plan`;
  $('#legend').innerHTML = Object.entries(KINDS).map(([k, x]) => `<span class="lg" style="--k:${kv(k)}"><i></i>${x.n}</span>`).join('');
  drawTrip(); drawTogether();
  $('#shore').innerHTML = `<path d="M0 120 Q160 70 330 110 T700 96 T1060 108 T1440 92 V260 H0Z" fill="#C9B9D9" opacity=".55"/>
    <path d="M0 150 Q240 132 480 146 T960 140 T1440 148 V260 H0Z" fill="#E7C49A"/><path d="M0 176 Q240 160 480 172 T960 166 T1440 174 V260 H0Z" fill="#D9A06A"/>
    <path d="M0 214 Q300 190 640 206 T1440 200 V260 H0Z" fill="#F4D9A0"/>${[[1180, 214, 2.1], [1240, 220, 1.6], [1320, 212, 2.4], [70, 222, 1.8]].map(([x, y, s]) => A.palm(x, y, s, '#1F8A5B', '#7A4E26')).join('')}`;
  const go = () => { if (q.get('live') !== '0') setTimeout(liveAdd, RM.matches ? 1500 : 4200); };
  if (q.get('state') === 'calendar') { render(); drawRail(); go(); }
  else arrive().then(go);
  window.demo = { arrive, liveAdd, openQuickAdd, openSide, closeSide, save: () => save($('#saveBtn')), openSheet, closeSheet, closePop, setView, addSuggestion, openUseDay, useDay: (fid, d) => useDay(FAMS.find(f => f.id === fid), d), showRain, S, undo, stack: () => addEvent({ d: 1, s: 12 * 60 + 30, e: 13 * 60 + 30, k: 'food', t: SUG.f2.t, sub: SUG.f2.sub, by: 'me', sug: 'f2' }), openEvent: id => openEvent(id, $(`.ev[data-id="${id}"]`)) };
})();
